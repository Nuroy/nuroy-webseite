<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projekt — Nuroy</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    :root {
      --pink: #FF2D7A;
      --violet: #8B5CF6;
      --fg: #f5f2ec;
      --fg-muted: rgba(245, 242, 236, 0.65);
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      background: #05050a;
      color: var(--fg);
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
    }
    #particles-bg {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
    }
    .particles-fallback #particles-bg {
      background:
        radial-gradient(ellipse 60% 40% at 50% 8%, rgba(255, 45, 122, 0.14), transparent 70%),
        radial-gradient(ellipse 40% 60% at 50% 60%, rgba(139, 92, 246, 0.1), transparent 70%);
    }
    /* Seiten-Übergang: schlichter Standard-Crossfade der View-Transitions-API
       (Browser ohne Support wechseln normal, reduced motion sofort) */
    @view-transition { navigation: auto; }
    @media (prefers-reduced-motion: reduce) {
      ::view-transition-group(*),
      ::view-transition-old(*),
      ::view-transition-new(*) { animation: none !important; }
    }
    .wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: 8vh 24px 0;
    }
    /* Inhalt taucht nach dem Laden sanft auf */
    .pj-in {
      opacity: 0;
      transform: translateY(26px);
      transition: opacity 0.9s ease, transform 0.9s ease;
    }
    html.stream-arrived .pj-in { opacity: 1; transform: none; }

    .pj-back {
      display: inline-block;
      color: var(--fg-muted);
      font-size: 14px;
      text-decoration: none;
      margin-bottom: 7vh;
    }
    .pj-back:hover { color: var(--fg); }
    .eyebrow {
      font-family: ui-monospace, monospace;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--pink);
      margin-bottom: 18px;
    }
    .eyebrow .dim { color: var(--fg-muted); }
    .pj-logo {
      display: block;
      height: 30px;
      width: auto;
      margin-bottom: 18px;
      filter: brightness(0) invert(1);
      opacity: 0.85;
    }
    h1 {
      font-size: clamp(36px, 5vw, 68px);
      font-weight: 900;
      letter-spacing: -0.04em;
      line-height: 1.05;
      text-shadow: 0 4px 24px rgba(0, 0, 0, 0.9);
    }
    .pj-site {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-top: 16px;
      font-family: ui-monospace, monospace;
      font-size: 13px;
      letter-spacing: 0.08em;
      color: var(--pink);
      text-decoration: none;
      border-bottom: 1px solid rgba(255, 45, 122, 0.35);
      padding-bottom: 2px;
      transition: border-color 0.2s ease;
    }
    .pj-site:hover { border-color: var(--pink); }
    .tagline {
      margin-top: 18px;
      font-size: clamp(18px, 1.8vw, 24px);
      font-weight: 600;
      line-height: 1.5;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.9);
    }
    .desc {
      margin-top: 26px;
      font-size: 16px;
      color: var(--fg-muted);
      line-height: 1.75;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.9);
    }
    .stack {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 30px;
    }
    .tag {
      font-family: ui-monospace, monospace;
      font-size: 12px;
      letter-spacing: 0.06em;
      color: var(--pink);
      border: 1px solid rgba(255, 45, 122, 0.35);
      border-radius: 999px;
      padding: 6px 12px;
    }

    /* --- Milchglas-Ebene: ab den Stack-Badges liegt der Inhalt auf Glas,
       die Partikel dahinter sind nur noch weich zu sehen (Hero bleibt scharf) --- */
    .pj-glas {
      position: relative;
      margin-top: 12vh;
      padding-top: 9vh;
      background: rgba(5, 5, 10, 0.3);
      -webkit-backdrop-filter: blur(14px) saturate(1.3);
      backdrop-filter: blur(14px) saturate(1.3);
    }
    @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
      .pj-glas { background: rgba(5, 5, 10, 0.88); }
    }
    /* weicher Übergang: scharfe Partikel → dunkel → verschwommene Partikel.
       z-index -1 hält den Verlauf unter dem Inhalt (sonst dimmt er die Überschrift) */
    .pj-glas::before {
      content: '';
      position: absolute;
      z-index: -1;
      left: 0;
      right: 0;
      top: -90px;
      height: 230px;
      background: linear-gradient(to bottom, transparent, #05050a 38% 42%, transparent);
      pointer-events: none;
    }
    .pj-glas .wrap { padding-top: 0; }

    /* --- Module --- */
    .pj-module h2,
    .pj-galerie h2 {
      font-size: clamp(24px, 2.6vw, 34px);
      font-weight: 900;
      letter-spacing: -0.02em;
      margin: 10vh 0 28px;
      text-shadow: 0 4px 24px rgba(0, 0, 0, 0.9);
    }
    .pj-module h2 { margin-top: 0; }
    .mod-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }
    @media (max-width: 640px) { .mod-grid { grid-template-columns: 1fr; } }
    .mod {
      padding: 20px 22px;
      border: 1px solid rgba(245, 242, 236, 0.1);
      border-radius: 14px;
      background: rgba(10, 9, 18, 0.55);
    }
    .mod h3 {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.01em;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .mod p { font-size: 14px; color: var(--fg-muted); line-height: 1.6; }
    .mod .soon {
      font-family: ui-monospace, monospace;
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--violet);
      border: 1px solid rgba(139, 92, 246, 0.45);
      border-radius: 999px;
      padding: 2px 8px;
    }

    /* --- Galerie: breiter als der Text --- */
    .pj-galerie {
      width: min(1080px, calc(100vw - 48px));
      margin: 0 auto;
    }
    .pj-galerie .shots { display: grid; gap: 26px; }
    .pj-galerie a {
      display: block;
      border: 1px solid rgba(245, 242, 236, 0.12);
      border-radius: 14px;
      overflow: hidden;
      background: rgba(10, 9, 18, 0.55);
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }
    .pj-galerie a:hover {
      border-color: rgba(255, 45, 122, 0.45);
      box-shadow: 0 0 42px rgba(255, 45, 122, 0.1);
    }
    .pj-galerie img { display: block; width: 100%; height: auto; }

    /* --- Lightbox: Bilder öffnen auf der Seite, nicht im neuen Tab --- */
    .lb {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(3, 3, 8, 0.94);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .lb[hidden] { display: none; }
    .lb img {
      max-width: min(1400px, 94vw);
      max-height: 90vh;
      border: 1px solid rgba(245, 242, 236, 0.15);
      border-radius: 12px;
      box-shadow: 0 20px 80px rgba(0, 0, 0, 0.7);
    }
    .lb button {
      position: absolute;
      background: rgba(10, 9, 18, 0.7);
      border: 1px solid rgba(245, 242, 236, 0.2);
      color: var(--fg);
      font-size: 22px;
      line-height: 1;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
      transition: border-color 0.2s ease, color 0.2s ease;
    }
    .lb button:hover { border-color: var(--pink); color: var(--pink); }
    .lb .lb-x { top: 20px; right: 20px; }
    .lb .lb-prev { left: 18px; top: 50%; transform: translateY(-50%); }
    .lb .lb-next { right: 18px; top: 50%; transform: translateY(-50%); }
    .lb .lb-count {
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      font-family: ui-monospace, monospace;
      font-size: 12px;
      letter-spacing: 0.1em;
      color: var(--fg-muted);
    }

    /* --- CTA --- */
    .cta {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;
      padding: 10vh 24px 16vh;
    }
    .btn-ghost {
      display: inline-block;
      padding: 12px 24px;
      border: 1px solid var(--pink);
      border-radius: 8px;
      background: transparent;
      color: var(--pink);
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.2s ease;
    }
    .btn-ghost:hover { background: rgba(255, 45, 122, 0.1); }
    .btn-plain {
      display: inline-block;
      padding: 12px 24px;
      border: 1px solid rgba(245, 242, 236, 0.25);
      border-radius: 8px;
      color: var(--fg);
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      transition: border-color 0.2s ease;
    }
    .btn-plain:hover { border-color: rgba(245, 242, 236, 0.6); }

    /* Fallback-Liste, wenn ?p= fehlt/unbekannt ist */
    .pj-list { list-style: none; padding: 0; margin: 26px 0 16vh; }
    .pj-list li { border-bottom: 1px solid rgba(245, 242, 236, 0.12); }
    .pj-list a {
      display: block;
      padding: 18px 0;
      color: inherit;
      text-decoration: none;
      font-weight: 600;
    }
    .pj-list a:hover { color: var(--pink); }
    .pj-list .dim { color: var(--fg-muted); font-weight: 400; font-size: 13px; }
  </style>
</head>
<body>
<div id="particles-bg" aria-hidden="true"></div>

<div class="pj-in">
  <div class="wrap">
    <a class="pj-back" href="test-zeitstrahl">← Alle Arbeiten</a>
    <article id="pj-content"><!-- kommt aus assets/projekte-daten.mjs --></article>
  </div>
  <div class="pj-glas" id="pj-glas">
    <div class="wrap">
      <section class="pj-module" id="pj-module"></section>
    </div>
    <section class="pj-galerie" id="pj-galerie"></section>
    <div class="cta" id="pj-cta"></div>
  </div>
</div>

<div class="lb" id="lb" hidden>
  <button class="lb-x" aria-label="Schließen">×</button>
  <button class="lb-prev" aria-label="Vorheriges Bild">‹</button>
  <img id="lb-img" alt="">
  <button class="lb-next" aria-label="Nächstes Bild">›</button>
  <span class="lb-count" id="lb-count"></span>
</div>

<script type="speculationrules">
  { "prefetch": [{ "urls": ["test-zeitstrahl", "test-reaktor"] }] }
</script>
<script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.166.1/build/three.module.js" } }
</script>
<script type="module">
  import { initDetailStream } from './assets/particles/timeline.mjs'
  import { PROJEKTE, sortiereProjekte, formatDatum } from './assets/projekte-daten.mjs'

  const id = new URLSearchParams(location.search).get('p')
  const projekt = PROJEKTE.find((p) => p.id === id)
  const content = document.getElementById('pj-content')
  const moduleEl = document.getElementById('pj-module')
  const galerie = document.getElementById('pj-galerie')
  const cta = document.getElementById('pj-cta')

  if (projekt) {
    document.title = `${projekt.name} — ${projekt.kunde} · Nuroy`
    content.innerHTML = `
      ${projekt.logo ? `<img class="pj-logo" src="${projekt.logo}" alt="${projekt.kunde}">` : ''}
      <p class="eyebrow">${projekt.kunde} <span class="dim">· ${projekt.kategorie} · ${projekt.laufend ? 'in Arbeit' : formatDatum(projekt.datum)}</span></p>
      <h1>${projekt.name}</h1>
      ${projekt.website ? `<a class="pj-site" href="${projekt.website}" target="_blank" rel="noopener">${new URL(projekt.website).hostname.replace(/^www\./, '')} ↗</a>` : ''}
      <p class="tagline">${projekt.tagline}</p>
      <p class="desc">${projekt.beschreibung}</p>
      ${projekt.stack.length ? `<div class="stack">${projekt.stack.map((t) => `<span class="tag">${t}</span>`).join('')}</div>` : ''}`

    if (projekt.module?.length) {
      moduleEl.innerHTML = `
        <h2>Die Module.</h2>
        <div class="mod-grid">
          ${projekt.module
            .map(
              (m) => `<div class="mod"><h3>${m.t}${m.soon ? '<span class="soon">in Vorbereitung</span>' : ''}</h3><p>${m.d}</p></div>`
            )
            .join('')}
        </div>`
    }

    if (projekt.bilder?.length) {
      galerie.innerHTML = `
        <h2>Einblicke ins System.</h2>
        <div class="shots">
          ${projekt.bilder
            .map((b, i) => `<a href="${b}" data-i="${i}"><img src="${b}" alt="${projekt.name} — Screenshot ${i + 1}" loading="${i === 0 ? 'eager' : 'lazy'}"></a>`)
            .join('')}
        </div>`

      // --- Lightbox: Bilder auf der Seite ansehen (←/→/ESC, Klick daneben schließt)
      const lb = document.getElementById('lb')
      const lbImg = document.getElementById('lb-img')
      const lbCount = document.getElementById('lb-count')
      let lbIdx = 0
      const show = (i) => {
        lbIdx = (i + projekt.bilder.length) % projekt.bilder.length
        lbImg.src = projekt.bilder[lbIdx]
        lbCount.textContent = `${lbIdx + 1} / ${projekt.bilder.length}`
      }
      const open = (i) => {
        show(i)
        lb.hidden = false
        document.documentElement.style.overflow = 'hidden'
      }
      const close = () => {
        lb.hidden = true
        document.documentElement.style.overflow = ''
      }
      galerie.addEventListener('click', (e) => {
        const a = e.target.closest('a[data-i]')
        if (!a) return
        e.preventDefault()
        open(Number(a.dataset.i))
      })
      lb.addEventListener('click', (e) => {
        if (e.target.closest('.lb-prev')) show(lbIdx - 1)
        else if (e.target.closest('.lb-next')) show(lbIdx + 1)
        else if (e.target === lbImg) show(lbIdx + 1)
        else close() // Klick auf Hintergrund oder ×
      })
      addEventListener('keydown', (e) => {
        if (lb.hidden) return
        if (e.key === 'Escape') close()
        else if (e.key === 'ArrowLeft') show(lbIdx - 1)
        else if (e.key === 'ArrowRight') show(lbIdx + 1)
      })
    }

    cta.innerHTML = `
      ${projekt.website ? `<a class="btn-ghost" href="${projekt.website}" target="_blank" rel="noopener">Live ansehen →</a>` : ''}
      ${projekt.caseStudy ? `<a class="btn-ghost" href="${projekt.caseStudy}">Ausführliche Case Study lesen</a>` : ''}
      <a class="btn-${projekt.website ? 'plain' : 'ghost'}" href="kontakt">Ähnliches Projekt anfragen</a>
      <a class="btn-plain" href="test-zeitstrahl">← Zurück zum Zeitstrahl</a>`
  } else {
    document.getElementById('pj-glas').hidden = true
    content.innerHTML = `
      <h1>Projekt wählen.</h1>
      <ul class="pj-list">
        ${sortiereProjekte()
          .map(
            (p) => `<li><a href="test-projekt?p=${encodeURIComponent(p.id)}">${p.name} <span class="dim">— ${p.kunde} · ${p.laufend ? 'in Arbeit' : formatDatum(p.datum)}</span></a></li>`
          )
          .join('')}
      </ul>`
  }

  initDetailStream({ mount: document.getElementById('particles-bg') })
</script>
</body>
</html>
