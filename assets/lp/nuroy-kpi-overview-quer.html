<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Alle KPIs. Ein Blick. – Querformat</title><style>
:root{--bg:#F7F4EE;--card:#FFFFFF;--line:#E6E1D6;--ink:#141414;--old:#6E695E;--gray:#8B8678;--stale:#B9791B;--pink:#F0366E;--green:#2FA36B;--head:'Avenir Next','Segoe UI Variable Display','Segoe UI',system-ui,sans-serif;--body:system-ui,'Segoe UI',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%;background:var(--bg);overflow:hidden}body{font-family:var(--body);color:var(--ink)}
.stage{position:absolute;top:50%;left:50%;width:1920px;height:1080px;transform-origin:center center;background:radial-gradient(1100px 750px at 50% 50%,rgba(240,54,110,.04),transparent 62%),var(--bg)}
.win{position:absolute;width:440px;transform:translate(-50%,-50%) rotate(var(--r)) scale(var(--s,1));transition:transform .7s cubic-bezier(.5,0,.75,.35),opacity .45s ease;z-index:2}
.win.front{z-index:60;--s:1.05}.win.gone{opacity:0}
.win-box{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 16px 40px rgba(60,52,30,.13);overflow:hidden;transition:box-shadow .25s}
.win.front .win-box{box-shadow:0 26px 60px rgba(60,52,30,.22)}
.bar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:#FBF9F4}
.lights{display:flex;gap:6px}.lights i{width:11px;height:11px;border-radius:50%;display:block}
.lights i:nth-child(1){background:#F26D5F}.lights i:nth-child(2){background:#F5BE4F}.lights i:nth-child(3){background:#61C554}
.bar .app{font-size:14.5px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .old{margin-left:auto;font-size:12.5px;font-weight:600;color:var(--stale);white-space:nowrap}
.win-body{padding:0}
.app-stat{display:flex;align-items:baseline;justify-content:space-between;padding:11px 18px 9px;border-bottom:1px solid #F0EBDF}
.app-stat span{font-size:13.5px;color:var(--gray);font-weight:500}
.app-stat b{font-family:var(--head);font-size:23px;font-weight:700;color:var(--old);font-variant-numeric:tabular-nums}
.list{padding:4px 18px 12px}
.li{display:flex;align-items:center;gap:10px;padding:7.5px 0;border-bottom:1px solid #F2EDE2;font-size:13.5px;color:var(--old)}
.list .li:last-child{border-bottom:none;padding-bottom:2px}
.li .id{color:var(--gray);font-weight:600;flex:0 0 auto;font-variant-numeric:tabular-nums}
.li .nm{font-weight:600;color:var(--ink);opacity:.72;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .amt{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;flex:0 0 auto}
.li .amt.plus{color:var(--green)}
.li i{font-style:normal;color:var(--gray);font-size:12.5px;flex:0 0 auto}
.pill{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;flex:0 0 auto}
.pill.g{background:rgba(47,163,107,.12);color:var(--green)}
.pill.a{background:rgba(185,121,27,.13);color:var(--stale)}
.pill.r{background:rgba(214,69,69,.12);color:#D64545}
.kan{display:flex;gap:9px;padding:10px 18px 13px}
.kcol{flex:1;background:#F5F1E8;border-radius:9px;padding:7px}
.kh{font-size:11px;font-weight:700;color:var(--gray);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em}
.kc{background:#fff;border:1px solid var(--line);border-radius:6px;font-size:11.5px;font-weight:600;color:var(--old);padding:5px 7px;margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kcol .kc:last-child{margin-bottom:0}
.xl-fx{font-size:12.5px;color:var(--gray);padding:8px 18px;border-bottom:1px solid #F0EBDF;font-family:ui-monospace,Consolas,monospace}
table.xl{width:100%;border-collapse:collapse;font-size:13px;color:var(--old)}
.xl th{background:#F5F1E8;color:var(--gray);font-weight:600;font-size:11.5px}
.xl th,.xl td{border:1px solid #EFE9DC;padding:4.5px 10px;text-align:left}
.xl td.num{text-align:right;font-variant-numeric:tabular-nums}
.xl td.sel{outline:2.5px solid var(--green);outline-offset:-2.5px;font-weight:700;background:#fff}
.mails{padding:2px 0 8px}
.mi{display:flex;align-items:center;gap:10px;padding:8.5px 18px;border-bottom:1px solid #F2EDE2;font-size:13px}
.mails .mi:last-child{border-bottom:none}
.mi b{color:var(--ink);opacity:.78;font-weight:700;flex:0 0 auto}
.mi span{color:var(--gray);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi i{font-style:normal;color:var(--gray);margin-left:auto;font-size:12px;flex:0 0 auto}
.mi.unread::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--pink);flex:0 0 auto}
.cal{padding:8px 18px 13px}
.crow{display:flex;align-items:center;gap:12px;padding:4.5px 0}
.ct{font-size:12px;color:var(--gray);font-variant-numeric:tabular-nums;flex:0 0 44px}
.cev{flex:1;font-size:12.5px;font-weight:600;padding:6px 10px;border-radius:6px;border-left:3px solid;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cev.p{background:rgba(240,54,110,.08);border-color:var(--pink);color:#A2264E}
.cev.b{background:rgba(77,120,220,.10);border-color:#4D78DC;color:#3A5AA8}
.cev.gr{background:rgba(47,163,107,.10);border-color:var(--green);color:#22754D}
.an{display:flex;align-items:flex-end;gap:8px;height:72px;padding:10px 18px 13px}
.an i{flex:1;background:#DCD5C4;border-radius:4px 4px 0 0;display:block}
.an i.hot{background:var(--pink);opacity:.7}
.cursor{position:absolute;z-index:120;width:30px;height:30px;transition:left .38s cubic-bezier(.3,.7,.4,1),top .38s cubic-bezier(.3,.7,.4,1),opacity .3s;filter:drop-shadow(0 3px 6px rgba(0,0,0,.25));pointer-events:none}
.cursor.hidden{opacity:0}
.cursor.click{animation:click .18s ease-out}
@keyframes click{50%{transform:scale(.82)}}
.dash{position:absolute;left:50%;top:50%;width:1200px;transform:translate(-50%,-50%) scale(.93);opacity:0;z-index:80;pointer-events:none;transition:opacity .55s ease,transform .55s cubic-bezier(.2,.9,.3,1.1)}
.dash.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.dash-box{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:0 40px 90px rgba(60,52,30,.18);overflow:hidden}
.dash .bar{padding:14px 22px}
.dash .bar .app{font-family:var(--head);font-size:19px;font-weight:700}
.badge{display:inline-flex;align-items:center;gap:8px;margin-left:14px;background:rgba(240,54,110,.10);color:var(--pink);font-size:14px;font-weight:700;padding:5px 13px;border-radius:999px}
.badge .dot{width:9px;height:9px;border-radius:50%;background:var(--pink);animation:blink 1.2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.dash .bar .clock{margin-left:auto;font-family:var(--head);font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.dash .bar .upd{font-size:13px;color:var(--gray);font-weight:500;margin-left:14px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:20px 22px 22px}
.tile{background:#FBF9F4;border:1px solid var(--line);border-radius:14px;padding:16px 18px;transition:background .3s,border-color .3s}
.tile.flash{background:rgba(47,163,107,.10);border-color:rgba(47,163,107,.4)}
.tile .tl{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--gray);font-weight:600;margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .tl svg{width:16px;height:16px;color:var(--pink);flex:0 0 auto}
.tile .tv{font-family:var(--head);font-size:31px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.tile .ld{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-size:12.5px;font-weight:600;color:var(--green)}
.tile .ld i{width:7px;height:7px;border-radius:50%;background:var(--green);display:block}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none !important;transition:none !important}}
</style></head><body><div class="stage" id="stage">
<div id="winLayer"></div>
<svg class="cursor hidden" id="cursor" viewBox="0 0 24 24"><path d="M5 3l14 8.5-6.2 1.4L15 20l-3-1.2-2.2-6.6L5 15V3z" fill="#141414" stroke="#fff" stroke-width="1.4"/></svg>
<div class="dash" id="dash"><div class="dash-box">
<div class="bar"><span class="lights"><i></i><i></i><i></i></span><span class="app">Dashboard</span><span class="badge"><span class="dot"></span>Live</span><span class="clock" id="clock">--:--:--</span><span class="upd" id="upd">aktualisiert gerade eben</span></div>
<div class="tiles" id="tiles"></div>
</div></div>
</div>
<script>
function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080);document.getElementById('stage').style.transform=`translate(-50%,-50%) scale(${s})`;}
addEventListener('resize',fit);fit();
/* Sichtbarkeits-Gate: Loop + Intervals pausieren, wenn Sektion nicht im Viewport */
let inView=true,waiters=[];
const active=()=>inView&&!document.hidden;
const wake=()=>{if(active())waiters.splice(0).forEach(r=>r());};
if('IntersectionObserver' in window){inView=false;new IntersectionObserver(es=>{inView=es[0].isIntersecting;wake();}).observe(document.body);}
document.addEventListener('visibilitychange',wake);
const waitVisible=()=>active()?Promise.resolve():new Promise(r=>waiters.push(r));
const sleep=ms=>new Promise(r=>setTimeout(r,ms)).then(waitVisible);
const fmtEur=v=>'€ '+v.toLocaleString('de-DE');
const fmtNum=v=>v.toLocaleString('de-DE');
const IC={
db:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.7 4 3 9 3s9-1.3 9-3V5"/><path d="M3 12c0 1.7 4 3 9 3s9-1.3 9-3"/></svg>',
bag:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>',
grid:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg>',
doc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>',
mail:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>',
cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',
card:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>',
chart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="m7 15 4-6 3 4 5-8"/></svg>'};
const KPIS=[
{ic:'bag',kind:'shop',app:'Shop-System',label:'Umsatz heute',val:4320,eur:true,old:'Stand: Fr, 17:42',x:360,y:300,r:'-2deg'},
{ic:'db',kind:'crm',app:'CRM',label:'Neue Leads',val:18,eur:false,old:'vor 3 Tagen',x:850,y:250,r:'1.5deg'},
{ic:'grid',kind:'xl',app:'umsatz_v3.xlsx',label:'Umsatz gesamt',val:39410,eur:true,old:'vor 6 Tagen',x:1330,y:310,r:'-1deg'},
{ic:'doc',kind:'buch',app:'Buchhaltung',label:'Offene Rechnungen',val:12400,eur:true,old:'Stand: 30.06.',x:1600,y:590,r:'2deg'},
{ic:'mail',kind:'mail',app:'E-Mail-Tool',label:'Antworten',val:32,eur:false,old:'Mo, 09:14',x:520,y:650,r:'1deg'},
{ic:'cal',kind:'cal',app:'Kalender',label:'Termine heute',val:6,eur:false,old:'gestern',x:990,y:620,r:'-1.5deg'},
{ic:'card',kind:'pay',app:'Zahlungen',label:'Eingänge heute',val:9870,eur:true,old:'vor 2 Tagen',x:1420,y:850,r:'1deg'},
{ic:'chart',kind:'ana',app:'Analytics',label:'Besucher heute',val:1243,eur:false,old:'Stand: Fr, 16:05',x:700,y:880,r:'-2deg'}];
const stat=k=>`<div class="app-stat"><span>${k.label}</span><b>${k.eur?fmtEur(k.val):fmtNum(k.val)}</b></div>`;
const BODIES={
shop:k=>stat(k)+`<div class="list"><div class="li"><span class="id">#1049</span><span class="nm">Weber GmbH</span><span class="amt">€ 249</span><span class="pill g">bezahlt</span></div><div class="li"><span class="id">#1048</span><span class="nm">Schmid AG</span><span class="amt">€ 1.120</span><span class="pill a">offen</span></div><div class="li"><span class="id">#1047</span><span class="nm">Koch KG</span><span class="amt">€ 89</span><span class="pill g">bezahlt</span></div></div>`,
crm:k=>stat(k)+`<div class="kan"><div class="kcol"><div class="kh">Lead</div><div class="kc">Weber GmbH</div><div class="kc">Braun e.K.</div><div class="kc">Vogel &amp; Co.</div></div><div class="kcol"><div class="kh">Angebot</div><div class="kc">Schmid AG</div><div class="kc">Koch KG</div></div><div class="kcol"><div class="kh">Gewonnen</div><div class="kc">Lang GmbH</div></div></div>`,
xl:k=>`<div class="xl-fx">fx&nbsp;&nbsp;=SUMME(B2:B13)</div><table class="xl"><tr><th></th><th>A</th><th>B</th><th>C</th></tr><tr><th>1</th><td>Monat</td><td>Umsatz</td><td>Kosten</td></tr><tr><th>2</th><td>Mai</td><td class="num">13.720</td><td class="num">7.890</td></tr><tr><th>3</th><td>Juni</td><td class="num">14.560</td><td class="num">8.240</td></tr><tr><th>4</th><td>Gesamt</td><td class="num sel">${fmtNum(k.val)}</td><td class="num">24.370</td></tr></table>`,
buch:k=>stat(k)+`<div class="list"><div class="li"><span class="id">RE-0815</span><span class="nm">Müller GmbH</span><span class="amt">€ 4.200</span><span class="pill r">überfällig</span></div><div class="li"><span class="id">RE-0814</span><span class="nm">Schmid AG</span><span class="amt">€ 6.800</span><span class="pill a">offen</span></div><div class="li"><span class="id">RE-0813</span><span class="nm">Koch KG</span><span class="amt">€ 1.400</span><span class="pill a">offen</span></div></div>`,
mail:k=>stat(k)+`<div class="mails"><div class="mi unread"><b>Weber GmbH</b><span>AW: Angebot Q3 – passt so, eine Frage…</span><i>09:12</i></div><div class="mi"><b>Buchhaltung</b><span>Rechnungen Juni zur Freigabe</span><i>Fr</i></div><div class="mi unread"><b>Schmid AG</b><span>AW: Termin nächste Woche</span><i>Do</i></div></div>`,
cal:k=>stat(k)+`<div class="cal"><div class="crow"><span class="ct">09:00</span><span class="cev p">Kundencall Weber GmbH</span></div><div class="crow"><span class="ct">11:30</span><span class="cev b">Team-Meeting</span></div><div class="crow"><span class="ct">14:00</span><span class="cev gr">Demo Schmid AG</span></div></div>`,
pay:k=>stat(k)+`<div class="list"><div class="li"><span class="nm">Müller GmbH</span><span class="amt plus">+ € 1.250</span><i>10:24</i></div><div class="li"><span class="nm">Lang GmbH</span><span class="amt plus">+ € 890</span><i>09:57</i></div><div class="li"><span class="nm">Koch KG</span><span class="amt plus">+ € 2.340</span><i>09:11</i></div></div>`,
ana:k=>stat(k)+`<div class="an"><i style="height:34%"></i><i style="height:52%"></i><i style="height:41%"></i><i style="height:63%"></i><i style="height:48%"></i><i style="height:72%"></i><i style="height:58%"></i><i class="hot" style="height:88%"></i></div>`};
const layer=document.getElementById('winLayer');
KPIS.forEach(k=>{const w=document.createElement('div');w.className='win';
w.style.left=k.x+'px';w.style.top=k.y+'px';w.style.setProperty('--r',k.r);
w.dataset.x=k.x;w.dataset.y=k.y;
w.innerHTML=`<div class="win-box"><div class="bar"><span class="lights"><i></i><i></i><i></i></span><span class="app">${k.app}</span><span class="old">${k.old}</span></div><div class="win-body">${BODIES[k.kind](k)}</div></div>`;
layer.appendChild(w);});
const wins=[...document.querySelectorAll('.win')];
const live=KPIS.map(k=>({...k,cur:k.val}));
const tilesEl=document.getElementById('tiles');
live.forEach((k,i)=>{const t=document.createElement('div');t.className='tile';t.id='tile'+i;
t.innerHTML=`<div class="tl">${IC[k.ic]}${k.label}</div><div class="tv" id="tv${i}">${k.eur?fmtEur(k.cur):fmtNum(k.cur)}</div><div class="ld"><i></i>live</div>`;
tilesEl.appendChild(t);});
let lastUpd=0;
setInterval(()=>{if(!active())return;const n=new Date(),p=x=>String(x).padStart(2,'0');
document.getElementById('clock').textContent=`${p(n.getHours())}:${p(n.getMinutes())}:${p(n.getSeconds())}`;},250);
setInterval(()=>{if(!active())return;lastUpd++;
document.getElementById('upd').textContent=lastUpd<2?'aktualisiert gerade eben':`aktualisiert vor ${lastUpd} Sek.`;},1000);
setInterval(()=>{if(!active())return;const i=Math.floor(Math.random()*live.length);const k=live[i];
k.cur+=k.eur?(20+Math.floor(Math.random()*160)):(Math.random()<.7?1:2);
document.getElementById('tv'+i).textContent=k.eur?fmtEur(k.cur):fmtNum(k.cur);
const t=document.getElementById('tile'+i);t.classList.add('flash');lastUpd=0;
setTimeout(()=>t.classList.remove('flash'),500);},1100);
const cursor=document.getElementById('cursor');
function cursorTo(x,y){cursor.style.left=x+'px';cursor.style.top=y+'px';
cursor.classList.remove('click');void cursor.offsetWidth;cursor.classList.add('click');}
const dash=document.getElementById('dash');
const CX=960,CY=540;
function resetWindows(){wins.forEach((w,i)=>{w.style.transition='none';w.style.transform='';
w.classList.remove('front');w.classList.add('gone');void w.offsetWidth;w.style.transition='';
setTimeout(()=>w.classList.remove('gone'),80*i);});}
async function run(){
while(true){
cursor.classList.remove('hidden');
const order=[0,3,1,5,2,7,4,6,1,3];
for(const idx of order){wins.forEach(w=>w.classList.remove('front'));
const w=wins[idx];w.classList.add('front');
cursorTo(+w.dataset.x+90,+w.dataset.y-118);await sleep(520);}
await sleep(200);
cursor.classList.add('hidden');
wins.forEach((w,i)=>{setTimeout(()=>{const dx=CX-+w.dataset.x,dy=CY-+w.dataset.y;
w.style.transform=`translate(-50%,-50%) translate(${dx}px,${dy}px) scale(.05)`;
w.classList.add('gone');},i*55);});
await sleep(950);
dash.classList.add('show');lastUpd=0;
await sleep(6800);
dash.classList.remove('show');
await sleep(550);
resetWindows();
await sleep(900);
}}
run();
</script>
</body></html>
