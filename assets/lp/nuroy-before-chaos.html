<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Before: Reporting-Chaos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&family=IBM+Plex+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f6f4ee;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:'Schibsted Grotesk',sans-serif;overflow:hidden}
.frame{width:100%;max-width:620px;aspect-ratio:4/3;container-type:size;container-name:c}
.scene{width:100%;height:100%;background:#fff;border-radius:3cqw;box-shadow:0 2cqw 8cqw rgba(0,0,0,.08);position:relative;overflow:hidden;padding:6cqw}
.title{position:absolute;top:5cqw;left:50%;transform:translateX(-50%);font-family:'Bricolage Grotesque',sans-serif;font-size:4cqw;font-weight:800;color:#1a1a22;letter-spacing:-.02em;text-align:center;white-space:nowrap}
.source-card{position:absolute;background:#fff;border:0.3cqw solid #e5484d;border-radius:2cqw;padding:2cqw 3cqw;font-size:2cqw;font-weight:600;color:#1a1a22;box-shadow:0 1cqw 4cqw rgba(229,72,77,.15)}
.source-card .label{font-size:1.6cqw;color:#666;margin-bottom:0.8cqw;font-family:'IBM Plex Mono',monospace;letter-spacing:.05em}
.source-card .value{font-size:3.2cqw;font-weight:800;font-family:'Bricolage Grotesque',sans-serif;color:#1a1a22}
.center-confusion{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:20cqw;height:20cqw;background:#fff;border:0.5cqw dashed #e5484d;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12cqw;color:#e5484d;font-weight:800;font-family:'Bricolage Grotesque',sans-serif;animation:wobble 1.2s ease-in-out infinite}
.timer{position:absolute;bottom:6cqw;left:50%;transform:translateX(-50%);background:#fff;border:0.3cqw solid #f5a623;border-radius:2cqw;padding:2cqw 4cqw;font-family:'IBM Plex Mono',monospace;font-size:1.8cqw;color:#1a1a22;box-shadow:0 1cqw 4cqw rgba(245,166,35,.15)}
.timer .label{color:#f5a623;margin-bottom:0.5cqw;font-size:1.4cqw;letter-spacing:.05em}
.timer .time{font-size:3cqw;font-weight:800;color:#1a1a22}
.connector{position:absolute;border-top:0.3cqw dashed rgba(229,72,77,.3);transform-origin:left center}
@keyframes bob1{0%,100%{transform:translate(0,0) rotate(-5deg)}50%{transform:translate(0,-2cqw) rotate(-5deg)}}
@keyframes bob2{0%,100%{transform:translate(0,0) rotate(4deg)}50%{transform:translate(0,1.5cqw) rotate(4deg)}}
@keyframes bob3{0%,100%{transform:translate(0,0) rotate(-3deg)}50%{transform:translate(0,-1cqw) rotate(-3deg)}}
@keyframes bob4{0%,100%{transform:translate(0,0) rotate(2deg)}50%{transform:translate(0,1cqw) rotate(2deg)}}
@keyframes wobble{0%,100%{transform:translate(-50%,-50%) scale(1)}25%{transform:translate(-50%,-50%) scale(1.05) rotate(2deg)}75%{transform:translate(-50%,-50%) scale(0.98) rotate(-2deg)}}
.card1{top:15cqw;left:8cqw;animation:bob1 5s ease-in-out infinite}
.card2{top:15cqw;right:8cqw;animation:bob2 5.5s ease-in-out infinite}
.card3{bottom:18cqw;left:8cqw;animation:bob3 6s ease-in-out infinite}
.card4{bottom:18cqw;right:8cqw;animation:bob4 6.5s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="frame">
<div class="scene">
<div class="title">Reporting ohne Dashboard</div>
<div class="source-card card1">
<div class="label">Excel</div>
<div class="value" id="val1">€127.450</div>
</div>
<div class="source-card card2">
<div class="label">CRM</div>
<div class="value" id="val2">€142.300</div>
</div>
<div class="source-card card3">
<div class="label">Sales</div>
<div class="value" id="val3">€138.920</div>
</div>
<div class="source-card card4">
<div class="label">Buchhaltung</div>
<div class="value" id="val4">€141.050</div>
</div>
<div class="center-confusion">?</div>
<svg style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none" xmlns="http://www.w3.org/2000/svg">
<line x1="20%" y1="30%" x2="50%" y2="50%" stroke="rgba(229,72,77,0.3)" stroke-width="0.3cqw" stroke-dasharray="2,2"/>
<line x1="80%" y1="30%" x2="50%" y2="50%" stroke="rgba(229,72,77,0.3)" stroke-width="0.3cqw" stroke-dasharray="2,2"/>
<line x1="20%" y1="70%" x2="50%" y2="50%" stroke="rgba(229,72,77,0.3)" stroke-width="0.3cqw" stroke-dasharray="2,2"/>
<line x1="80%" y1="70%" x2="50%" y2="50%" stroke="rgba(229,72,77,0.3)" stroke-width="0.3cqw" stroke-dasharray="2,2"/>
</svg>
<div class="timer">
<div class="label">Zeit verloren / Woche</div>
<div class="time" id="timer">06:12 h</div>
</div>
</div>
</div>
<script>
const vals=[
{el:document.getElementById('val1'),base:127450,range:3000},
{el:document.getElementById('val2'),base:142300,range:2500},
{el:document.getElementById('val3'),base:138920,range:4000},
{el:document.getElementById('val4'),base:141050,range:3500}
];
function flicker(){
vals.forEach(v=>{
const offset=Math.floor(Math.random()*v.range)-(v.range/2);
const val=v.base+offset;
v.el.textContent='€'+val.toLocaleString('de-DE');
});
}
setInterval(flicker,1400);
let mins=372;
function tick(){
mins++;
const h=Math.floor(mins/60);
const m=mins%60;
document.getElementById('timer').textContent=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')} h`;
}
setInterval(tick,900);
</script>
</body>
</html>
