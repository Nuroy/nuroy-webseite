<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Nuroy Live-Dashboard – Hochformat</title><style>
:root{--bg:#060D1F;--panel:#0C1730;--card:#12213F;--line:#1D2E52;--text:#F2F6FD;--muted:#8296BC;--blue:#4D8DFF;--pink:#F0366E;--pink-soft:rgba(240,54,110,.12);--head:'Avenir Next','Segoe UI Variable Display','Segoe UI',system-ui,sans-serif;--body:system-ui,'Segoe UI',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%;background:var(--bg);overflow:hidden}body{font-family:var(--body);color:var(--text)}
.stage{position:absolute;top:50%;left:50%;width:1080px;height:1920px;transform-origin:center center;background:radial-gradient(1000px 1100px at 50% 72%,rgba(77,141,255,.10),transparent 62%),radial-gradient(700px 550px at 50% 15%,rgba(240,54,110,.06),transparent 60%),var(--bg)}
.node{position:absolute;width:430px;height:100px;display:flex;align-items:center;gap:20px;padding:0 24px;background:var(--panel);border:1px solid var(--line);border-radius:22px;font-family:var(--head);font-size:28px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.node .ic{width:52px;height:52px;border-radius:14px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;background:rgba(77,141,255,.14);color:var(--blue)}
.node .ic svg{width:28px;height:28px}
.node .st{margin-left:auto;display:flex;align-items:center;gap:9px;font-family:var(--body);font-size:16px;font-weight:600;color:var(--muted)}
.node .st .d{width:11px;height:11px;border-radius:50%;background:#35D08E}
.node.pulse{animation:nodepulse 2.4s ease-out infinite}
@keyframes nodepulse{0%,72%{border-color:var(--line);transform:none}78%{border-color:rgba(240,54,110,.7);transform:translateY(4px)}100%{border-color:var(--line);transform:none}}
.paused .node.pulse,.paused .badge .dot{animation-play-state:paused}
.col-l{left:60px}.col-r{left:590px}
svg.wires{position:absolute;inset:0;width:1080px;height:1920px;pointer-events:none}
.wire{fill:none;stroke:#22355E;stroke-width:2.5}.packet{fill:var(--pink)}.packet-halo{fill:rgba(240,54,110,.25)}
.dash{position:absolute;left:60px;top:760px;width:960px;height:1060px;background:var(--panel);border:1px solid var(--line);border-radius:30px;box-shadow:0 40px 100px rgba(0,0,0,.55);display:flex;flex-direction:column;overflow:hidden}
.dash-head{display:flex;align-items:center;gap:18px;padding:28px 34px;border-bottom:1px solid var(--line)}
.dash-title{font-family:var(--head);font-size:29px;font-weight:800}
.badge{display:inline-flex;align-items:center;gap:10px;background:var(--pink-soft);color:var(--pink);font-size:19px;font-weight:700;padding:9px 18px;border-radius:999px}
.badge .dot{width:11px;height:11px;border-radius:50%;background:var(--pink);animation:blink 1.2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.clock{margin-left:auto;text-align:right}.clock .t{font-family:var(--head);font-size:36px;font-weight:800;font-variant-numeric:tabular-nums}.clock .d{font-size:16px;color:var(--muted);font-weight:500}
.kpis{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px;padding:26px 34px 6px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px 24px}
.kpi .l{font-size:17px;color:var(--muted);font-weight:500;margin-bottom:12px}
.kpi .v{font-family:var(--head);font-size:42px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi .v.up{color:var(--pink)}
.kpi .s{display:inline-flex;align-items:center;gap:6px;margin-top:12px;font-size:15px;font-weight:600;color:#35D08E;background:rgba(53,208,142,.1);padding:5px 12px;border-radius:999px}
.chartwrap{padding:24px 34px 6px}
.chartwrap .l{font-size:17px;color:var(--muted);font-weight:500;margin-bottom:14px;display:flex;align-items:center}
.chartwrap .l b{color:var(--text);font-weight:600;margin-right:14px}
.chartwrap .l .upd{margin-left:auto;color:var(--pink);font-weight:600;font-size:16px}
svg.chart{width:100%;height:280px;display:block}
.chart-line{fill:none;stroke:var(--pink);stroke-width:4.5;stroke-linejoin:round;stroke-linecap:round}
.chart-fill{fill:url(#gradA)}.chart-grid{stroke:var(--line);stroke-width:1;stroke-dasharray:3 6}
.chart-dot{fill:var(--pink)}.chart-dot-halo{fill:rgba(240,54,110,.22)}
.feed{flex:1;padding:18px 34px 28px;overflow:hidden}
.feed .l{font-size:17px;color:var(--muted);font-weight:500;margin-bottom:14px}
.feeditem{display:flex;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid rgba(29,46,82,.6);font-size:21px;color:var(--text);font-weight:500}
.feeditem .chip{font-size:15px;font-weight:700;padding:5px 14px;border-radius:999px;background:rgba(77,141,255,.15);color:var(--blue);flex:0 0 auto;min-width:118px;text-align:center}
.feeditem .ts{margin-left:auto;color:var(--muted);font-size:17px;font-weight:500;font-variant-numeric:tabular-nums}
.feeditem.new{animation:slidein .35s ease-out}
@keyframes slidein{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none !important}}
</style></head><body><div class="stage" id="stage">
<svg class="wires" id="wires" viewBox="0 0 1080 1920" aria-hidden="true">
<defs><linearGradient id="gradA" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="rgba(240,54,110,.25)"/><stop offset="100%" stop-color="rgba(240,54,110,0)"/></linearGradient></defs>
<g>
<path id="q1" class="wire" d="M 275 250 C 275 480, 400 560, 400 760"/>
<path id="q2" class="wire" d="M 275 380 C 275 540, 460 610, 460 760"/>
<path id="q3" class="wire" d="M 275 510 C 275 620, 510 650, 510 760"/>
<path id="q4" class="wire" d="M 805 250 C 805 480, 680 560, 680 760"/>
<path id="q5" class="wire" d="M 805 380 C 805 540, 620 610, 620 760"/>
<path id="q6" class="wire" d="M 805 510 C 805 620, 570 650, 570 760"/>
</g>
<g>
<g><circle class="packet-halo" r="14"><animateMotion dur="2.4s" begin="0s" repeatCount="indefinite"><mpath href="#q1"/></animateMotion></circle><circle class="packet" r="7"><animateMotion dur="2.4s" begin="0s" repeatCount="indefinite"><mpath href="#q1"/></animateMotion></circle></g>
<g><circle class="packet-halo" r="14"><animateMotion dur="2.4s" begin="0.4s" repeatCount="indefinite"><mpath href="#q2"/></animateMotion></circle><circle class="packet" r="7"><animateMotion dur="2.4s" begin="0.4s" repeatCount="indefinite"><mpath href="#q2"/></animateMotion></circle></g>
<g><circle class="packet-halo" r="14"><animateMotion dur="2.4s" begin="0.8s" repeatCount="indefinite"><mpath href="#q3"/></animateMotion></circle><circle class="packet" r="7"><animateMotion dur="2.4s" begin="0.8s" repeatCount="indefinite"><mpath href="#q3"/></animateMotion></circle></g>
<g><circle class="packet-halo" r="14"><animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite"><mpath href="#q4"/></animateMotion></circle><circle class="packet" r="7"><animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite"><mpath href="#q4"/></animateMotion></circle></g>
<g><circle class="packet-halo" r="14"><animateMotion dur="2.4s" begin="1.6s" repeatCount="indefinite"><mpath href="#q5"/></animateMotion></circle><circle class="packet" r="7"><animateMotion dur="2.4s" begin="1.6s" repeatCount="indefinite"><mpath href="#q5"/></animateMotion></circle></g>
<g><circle class="packet-halo" r="14"><animateMotion dur="2.4s" begin="2.0s" repeatCount="indefinite"><mpath href="#q6"/></animateMotion></circle><circle class="packet" r="7"><animateMotion dur="2.4s" begin="2.0s" repeatCount="indefinite"><mpath href="#q6"/></animateMotion></circle></g>
<circle class="packet" r="5" opacity=".65"><animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite"><mpath href="#q1"/></animateMotion></circle>
<circle class="packet" r="5" opacity=".65"><animateMotion dur="2.4s" begin="1.6s" repeatCount="indefinite"><mpath href="#q4"/></animateMotion></circle>
<circle class="packet" r="5" opacity=".65"><animateMotion dur="2.4s" begin="2.0s" repeatCount="indefinite"><mpath href="#q2"/></animateMotion></circle>
</g>
</svg>
<div class="node pulse col-l" style="top:150px;animation-delay:0s"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>CRM<span class="st"><span class="d"></span></span></div>
<div class="node pulse col-l" style="top:280px;animation-delay:.4s"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg></span>Shop<span class="st"><span class="d"></span></span></div>
<div class="node pulse col-l" style="top:410px;animation-delay:.8s"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8"/><path d="M8 17h5"/></svg></span>Buchhaltung<span class="st"><span class="d"></span></span></div>
<div class="node pulse col-r" style="top:150px;animation-delay:1.2s"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg></span>E-Mail<span class="st"><span class="d"></span></span></div>
<div class="node pulse col-r" style="top:280px;animation-delay:1.6s"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/></svg></span>Kalender<span class="st"><span class="d"></span></span></div>
<div class="node pulse col-r" style="top:410px;animation-delay:2s"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="5" rx="2"/><path d="M2 10h20"/></svg></span>Zahlungen<span class="st"><span class="d"></span></span></div>
<div class="dash">
<div class="dash-head"><div class="dash-title">Dashboard</div><div class="badge"><span class="dot"></span>Live</div><div class="clock"><div class="t" id="clock">--:--:--</div><div class="d" id="date">—</div></div></div>
<div class="kpis">
<div class="kpi"><div class="l">Umsatz heute</div><div class="v up" id="kpiRev">€ 0</div><div class="s">▲ live</div></div>
<div class="kpi"><div class="l">Neue Leads</div><div class="v" id="kpiLeads">0</div><div class="s">▲ heute</div></div>
<div class="kpi"><div class="l">Syncs</div><div class="v" id="kpiSync">0</div><div class="s">24/7</div></div>
</div>
<div class="chartwrap"><div class="l"><b>Umsatzverlauf</b> <span class="upd" id="upd">aktualisiert: gerade eben</span></div>
<svg class="chart" viewBox="0 0 890 280" preserveAspectRatio="none">
<line class="chart-grid" x1="0" y1="70" x2="890" y2="70"/><line class="chart-grid" x1="0" y1="140" x2="890" y2="140"/><line class="chart-grid" x1="0" y1="210" x2="890" y2="210"/>
<path class="chart-fill" id="chartFill" d=""/><path class="chart-line" id="chartLine" d=""/>
<circle class="chart-dot-halo" id="chartDotH" r="15" cx="0" cy="0"/><circle class="chart-dot" id="chartDot" r="7" cx="0" cy="0"/>
</svg></div>
<div class="feed"><div class="l">Aktivität</div><div id="loglines"></div></div>
</div>
</div>
<script>
function fit(){var s=Math.min(innerWidth/1080,innerHeight/1920);document.getElementById('stage').style.transform='translate(-50%,-50%) scale('+s+')';}
addEventListener('resize',fit);fit();
var p=function(x){return String(x).padStart(2,'0');};
function tick(){var n=new Date();document.getElementById('clock').textContent=p(n.getHours())+':'+p(n.getMinutes())+':'+p(n.getSeconds());document.getElementById('date').textContent=n.toLocaleDateString('de-DE',{day:'numeric',month:'long'});}
var rev=18420,leads=12,sync=1348,lastUpd=0;
var eur=function(v){return '€ '+v.toLocaleString('de-DE');};
function bump(){rev+=40+Math.floor(Math.random()*260);sync+=1+Math.floor(Math.random()*3);if(Math.random()<.3)leads+=1;
document.getElementById('kpiRev').textContent=eur(rev);document.getElementById('kpiLeads').textContent=leads;document.getElementById('kpiSync').textContent=sync.toLocaleString('de-DE');lastUpd=0;}
function updTick(){lastUpd++;document.getElementById('upd').textContent=lastUpd<2?'aktualisiert: gerade eben':'aktualisiert: vor '+lastUpd+' Sek.';}
var N=24,W=890,H=280;
var data=Array.from({length:N},function(_,i){return 120+Math.sin(i/2.4)*44+Math.random()*24;});
function drawChart(){data.shift();var last=data[data.length-1];data.push(Math.min(252,Math.max(34,last+(Math.random()*56-26))));
var step=W/(N-1);var pts=data.map(function(v,i){return [i*step,H-v];});
var d='M '+pts.map(function(q){return q[0].toFixed(1)+' '+q[1].toFixed(1);}).join(' L ');
document.getElementById('chartLine').setAttribute('d',d);document.getElementById('chartFill').setAttribute('d',d+' L '+W+' '+H+' L 0 '+H+' Z');
var lp=pts[pts.length-1];['chartDot','chartDotH'].forEach(function(id){var dot=document.getElementById(id);dot.setAttribute('cx',lp[0]);dot.setAttribute('cy',lp[1]);});}
var sources=[['CRM','Deal aktualisiert'],['CRM','Neuer Lead erfasst'],['Shop','Bestellung synchronisiert'],['Buchhaltung','Rechnung abgeglichen'],['E-Mail','Neue Antwort'],['Kalender','Termin bestätigt'],['Zahlungen','Eingang verbucht']];
function addLog(){var n=new Date();var sm=sources[Math.floor(Math.random()*sources.length)];
var el=document.createElement('div');el.className='feeditem new';
el.innerHTML='<span class="chip">'+sm[0]+'</span>'+sm[1]+'<span class="ts">'+p(n.getHours())+':'+p(n.getMinutes())+':'+p(n.getSeconds())+'</span>';
var box=document.getElementById('loglines');box.prepend(el);while(box.children.length>5)box.removeChild(box.lastChild);}
tick();drawChart();addLog();addLog();addLog();
/* Timer nur laufen lassen, wenn sichtbar (spart CPU, wenn Sektion nicht im Viewport) */
var timers=null,wires=document.getElementById('wires');
function start(){if(timers)return;document.body.classList.remove('paused');if(wires.unpauseAnimations)wires.unpauseAnimations();
timers=[setInterval(tick,250),setInterval(bump,1400),setInterval(updTick,1000),setInterval(drawChart,1400),setInterval(addLog,1600)];}
function stop(){if(!timers)return;timers.forEach(clearInterval);timers=null;document.body.classList.add('paused');if(wires.pauseAnimations)wires.pauseAnimations();}
var inView=true;
if('IntersectionObserver' in window){inView=false;new IntersectionObserver(function(es){inView=es[0].isIntersecting;(inView&&!document.hidden)?start():stop();}).observe(document.body);}else{start();}
document.addEventListener('visibilitychange',function(){document.hidden?stop():(inView&&start());});
</script>
</body></html>
