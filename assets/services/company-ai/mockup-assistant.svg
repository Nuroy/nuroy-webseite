  <rect x="80" y="240" width="480" height="70" rx="4" fill="rgba(255,45,122,0.08)" stroke="rgba(255,45,122,0.2)" stroke-width="1"/>
  <rect x="90" y="250" width="4" height="50" rx="2" fill="#FF2D7A"/>
  <text x="105" y="263" fill="#9A968C" font-size="9">9:00 AM - 10:00 AM</text>
  <text x="105" y="280" fill="#F5F2EC" font-size="12" font-weight="bold">Team Standup</text>
  <text x="105" y="296" fill="#9A968C" font-size="9">📍 Conference Room A • 8 attendees</text>

  <rect x="80" y="320" width="480" height="70" rx="4" fill="rgba(143,163,115,0.08)" stroke="rgba(143,163,115,0.2)" stroke-width="1"/>
  <rect x="90" y="330" width="4" height="50" rx="2" fill="#8FA373"/>
  <text x="105" y="343" fill="#9A968C" font-size="9">11:30 AM - 12:30 PM</text>
  <text x="105" y="360" fill="#F5F2EC" font-size="12" font-weight="bold">Client Call: TechCorp</text>
  <text x="105" y="376" fill="#9A968C" font-size="9">📞 Video • AI Prep: Review contract details</text>

  <rect x="80" y="400" width="480" height="70" rx="4" fill="rgba(245,242,236,0.04)" stroke="rgba(245,242,236,0.08)" stroke-width="1"/>
  <rect x="90" y="410" width="4" height="50" rx="2" fill="#9A968C"/>
  <text x="105" y="423" fill="#9A968C" font-size="9">2:00 PM - 3:00 PM</text>
  <text x="105" y="440" fill="#F5F2EC" font-size="12" font-weight="bold">Budget Review Meeting</text>
  <text x="105" y="456" fill="#9A968C" font-size="9">📍 Office • Documents ready to present</text>

