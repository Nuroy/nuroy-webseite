  <text x="665" y="278" fill="#F5F2EC" font-size="9">I've prepared a summary for your 11:30 AM call with TechCorp:</text>
  <text x="665" y="293" fill="#F5F2EC" font-size="9">• Last interaction: May 10 (contract discussion)</text>
  <text x="665" y="308" fill="#F5F2EC" font-size="9">• Open items: Pricing tier, implementation timeline</text>
  <rect x="665" y="318" width="100" height="18" rx="3" fill="rgba(255,45,122,0.15)"/>
  <text x="672" y="329" fill="#FF2D7A" font-size="8">VIEW BRIEF</text>

  <!-- Suggestion 2 -->
  <rect x="620" y="355" width="500" height="85" rx="4" fill="rgba(143,163,115,0.08)" stroke="rgba(143,163,115,0.2)" stroke-width="1"/>
  <circle cx="640" cy="378" r="10" fill="#8FA373"/>
  <text x="637" y="383" fill="#0A0A0C" font-size="11" font-weight="bold">✓</text>
  <text x="665" y="373" fill="#8FA373" font-size="11" font-weight="bold">Time Block Recommendation</text>
  <text x="665" y="391" fill="#F5F2EC" font-size="9">You have 2 hours of free time this afternoon. Suggested focus:</text>
  <text x="665" y="406" fill="#F5F2EC" font-size="9">• Deep work on Q3 planning (blocked in your calendar)</text>
  <text x="665" y="421" fill="#F5F2EC" font-size="9">• No meetings scheduled - ideal for concentrated work</text>

  <!-- Suggestion 3 -->
  <rect x="620" y="455" width="500" height="70" rx="4" fill="rgba(209,168,92,0.08)" stroke="rgba(209,168,92,0.2)" stroke-width="1"/>
  <circle cx="640" cy="475" r="10" fill="#D1A85C"/>
  <text x="637" y="481" fill="#0A0A0C" font-size="12" font-weight="bold">📧</text>
  <text x="665" y="470" fill="#D1A85C" font-size="11" font-weight="bold">Priority Emails</text>
  <text x="665" y="488" fill="#F5F2EC" font-size="9">3 emails need your attention before EOD:</text>
  <text x="665" y="503" fill="#F5F2EC" font-size="9">• Budget approval from CFO • Vendor contract • Team update</text>

  <!-- Suggestion 4 -->
  <rect x="620" y="540" width="500" height="50" rx="4" fill="rgba(245,242,236,0.04)"/>
  <circle cx="640" cy="560" r="10" fill="#9A968C"/>
  <text x="636" y="566" fill="#F5F2EC" font-size="11" font-weight="bold">📊</text>
  <text x="665" y="555" fill="#F5F2EC" font-size="11" font-weight="bold">Weekly Report Ready</text>
  <text x="665" y="573" fill="#9A968C" font-size="9">Your team performance report for this week has been generated</text>

  <!-- Footer -->
