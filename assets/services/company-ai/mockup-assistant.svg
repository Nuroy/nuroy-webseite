  <rect x="60" y="100" width="1080" height="80" rx="6" fill="rgba(255,45,122,0.08)" stroke="rgba(255,45,122,0.2)" stroke-width="1"/>
  <text x="80" y="125" fill="#FF2D7A" font-size="14" font-weight="bold">Good morning, Anna!</text>
  <text x="80" y="145" fill="#F5F2EC" font-size="11">Here's your day at a glance:</text>
  <text x="80" y="165" fill="#9A968C" font-size="10">5 meetings • 12 pending tasks • 3 urgent emails • Budget review due Friday</text>

