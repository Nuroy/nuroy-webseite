  <rect x="80" y="510" width="480" height="35" rx="4" fill="rgba(245,242,236,0.04)"/>
  <circle cx="100" cy="527" r="6" fill="rgba(245,242,236,0.2)"/>
  <text x="120" y="523" fill="#F5F2EC" font-size="10">Approve expense reports (3 pending)</text>
  <rect x="490" y="518" width="60" height="18" rx="3" fill="rgba(209,168,92,0.12)"/>
  <text x="497" y="529" fill="#D1A85C" font-size="8">DUE TODAY</text>

  <rect x="80" y="553" width="480" height="35" rx="4" fill="rgba(245,242,236,0.04)"/>
