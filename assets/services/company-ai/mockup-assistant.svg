  <text x="60" y="647" fill="#9A968C" font-size="11">AI Features:</text>
  <text x="210" y="647" fill="#F5F2EC" font-size="11">Smart Scheduling</text>
  <text x="400" y="647" fill="#F5F2EC" font-size="11">Meeting Prep</text>
  <text x="590" y="647" fill="#F5F2EC" font-size="11">Task Prioritization</text>
  <text x="780" y="647" fill="#F5F2EC" font-size="11">Proactive Suggestions</text>
</svg>
