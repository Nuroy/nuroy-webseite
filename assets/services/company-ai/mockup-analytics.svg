<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0A0C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#121216;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#grad1)"/>

  <!-- Title Badge -->
  <text x="40" y="35" fill="#FF2D7A" font-size="12" font-family="monospace" letter-spacing="2">BI DASHBOARD WITH AI INSIGHTS</text>

  <!-- Dashboard Interface -->
  <rect x="40" y="70" width="1120" height="540" rx="8" fill="#1C1C22" stroke="rgba(245,242,236,0.08)" stroke-width="1"/>
  <text x="60" y="100" fill="#9A968C" font-size="11" font-family="monospace" letter-spacing="1">SALES PERFORMANCE • Q2 2024</text>

  <!-- Metric Cards -->
  <rect x="60" y="120" width="340" height="110" rx="6" fill="rgba(255,45,122,0.08)" stroke="rgba(255,45,122,0.2)" stroke-width="1"/>
  <text x="80" y="145" fill="#9A968C" font-size="10">Total Revenue</text>
  <text x="80" y="173" fill="#FF2D7A" font-size="28" font-weight="bold">€847k</text>
  <text x="80" y="195" fill="#8FA373" font-size="11">↑ 24% vs Q1</text>
  <text x="80" y="215" fill="#9A968C" font-size="9">AI Insight: On track to exceed Q2 goal</text>

  <rect x="420" y="120" width="340" height="110" rx="6" fill="rgba(143,163,115,0.08)" stroke="rgba(143,163,115,0.2)" stroke-width="1"/>
  <text x="440" y="145" fill="#9A968C" font-size="10">New Customers</text>
  <text x="440" y="173" fill="#8FA373" font-size="28" font-weight="bold">127</text>
  <text x="440" y="195" fill="#8FA373" font-size="11">↑ 18% vs Q1</text>
  <text x="440" y="215" fill="#9A968C" font-size="9">AI Insight: Strong growth in enterprise segment</text>

  <rect x="780" y="120" width="360" height="110" rx="6" fill="rgba(209,168,92,0.08)" stroke="rgba(209,168,92,0.2)" stroke-width="1"/>
  <text x="800" y="145" fill="#9A968C" font-size="10">Churn Rate</text>
  <text x="800" y="173" fill="#D1A85C" font-size="28" font-weight="bold">3.2%</text>
  <text x="800" y="195" fill="#D1A85C" font-size="11">↑ 0.8% vs Q1</text>
  <text x="800" y="215" fill="#9A968C" font-size="9">AI Alert: Investigate cause - price sensitivity detected</text>

  <!-- Chart Area -->
  <rect x="60" y="250" width="540" height="280" rx="6" fill="rgba(245,242,236,0.02)" stroke="rgba(245,242,236,0.08)" stroke-width="1"/>
  <text x="80" y="275" fill="#F5F2EC" font-size="12" font-weight="bold">Revenue Trend</text>

  <!-- Simple Bar Chart -->
  <rect x="90" y="440" width="60" height="60" rx="3" fill="rgba(143,163,115,0.3)"/>
  <rect x="170" y="420" width="60" height="80" rx="3" fill="rgba(143,163,115,0.4)"/>
  <rect x="250" y="390" width="60" height="110" rx="3" fill="rgba(143,163,115,0.5)"/>
  <rect x="330" y="350" width="60" height="150" rx="3" fill="rgba(255,45,122,0.5)"/>
  <rect x="410" y="320" width="60" height="180" rx="3" fill="rgba(255,45,122,0.6)"/>
  <rect x="490" y="290" width="60" height="210" rx="3" fill="rgba(255,45,122,0.7)"/>

  <!-- X Labels -->
  <text x="110" y="518" fill="#9A968C" font-size="9" text-anchor="middle">Jan</text>
  <text x="190" y="518" fill="#9A968C" font-size="9" text-anchor="middle">Feb</text>
  <text x="270" y="518" fill="#9A968C" font-size="9" text-anchor="middle">Mar</text>
  <text x="350" y="518" fill="#9A968C" font-size="9" text-anchor="middle">Apr</text>
  <text x="430" y="518" fill="#9A968C" font-size="9" text-anchor="middle">May</text>
  <text x="510" y="518" fill="#FF2D7A" font-size="9" text-anchor="middle">Jun</text>

  <!-- AI Insights Panel -->
  <rect x="620" y="250" width="520" height="280" rx="6" fill="rgba(245,242,236,0.02)" stroke="rgba(245,242,236,0.08)" stroke-width="1"/>
  <text x="640" y="275" fill="#F5F2EC" font-size="12" font-weight="bold">AI-Generated Insights</text>

  <rect x="640" y="290" width="480" height="70" rx="4" fill="rgba(255,45,122,0.08)" stroke="rgba(255,45,122,0.2)" stroke-width="1"/>
  <circle cx="660" cy="315" r="8" fill="#FF2D7A"/>
  <text x="655" y="320" fill="#0A0A0C" font-size="11" font-weight="bold">1</text>
  <text x="680" y="310" fill="#FF2D7A" font-size="11" font-weight="bold">Revenue Growth Accelerating</text>
  <text x="680" y="328" fill="#F5F2EC" font-size="9">June revenue up 35% MoM. Enterprise deals driving growth.</text>
  <text x="680" y="343" fill="#9A968C" font-size="8">Recommendation: Increase sales team capacity</text>
  <text x="680" y="355" fill="#8FA373" font-size="8">✓ High confidence (94%)</text>

  <rect x="640" y="370" width="480" height="70" rx="4" fill="rgba(209,168,92,0.08)" stroke="rgba(209,168,92,0.2)" stroke-width="1"/>
  <circle cx="660" cy="395" r="8" fill="#D1A85C"/>
  <text x="655" y="400" fill="#0A0A0C" font-size="11" font-weight="bold">2</text>
  <text x="680" y="390" fill="#D1A85C" font-size="11" font-weight="bold">Churn Risk Detected</text>
  <text x="680" y="408" fill="#F5F2EC" font-size="9">12 customers at risk due to recent pricing changes.</text>
  <text x="680" y="423" fill="#9A968C" font-size="8">Recommendation: Launch retention campaign</text>
  <text x="680" y="435" fill="#D1A85C" font-size="8">⚠ Medium confidence (78%)</text>

  <rect x="640" y="450" width="480" height="70" rx="4" fill="rgba(143,163,115,0.08)" stroke="rgba(143,163,115,0.2)" stroke-width="1"/>
  <circle cx="660" cy="475" r="8" fill="#8FA373"/>
  <text x="655" y="480" fill="#0A0A0C" font-size="11" font-weight="bold">3</text>
  <text x="680" y="470" fill="#8FA373" font-size="11" font-weight="bold">Product Mix Optimizing</text>
  <text x="680" y="488" fill="#F5F2EC" font-size="9">Premium tier adoption increased 22% this quarter.</text>
  <text x="680" y="503" fill="#9A968C" font-size="8">Recommendation: Upsell to existing customers</text>
  <text x="680" y="515" fill="#8FA373" font-size="8">✓ High confidence (91%)</text>

  <!-- Action Panel -->
  <rect x="60" y="550" width="1080" height="40" rx="6" fill="rgba(255,45,122,0.06)" stroke="rgba(255,45,122,0.2)" stroke-width="1"/>
  <text x="80" y="573" fill="#9A968C" font-size="10">Suggested Actions:</text>
  <rect x="230" y="560" width="140" height="22" rx="4" fill="rgba(255,45,122,0.12)"/>
  <text x="240" y="575" fill="#FF2D7A" font-size="9">Schedule Team Meeting</text>
  <rect x="385" y="560" width="140" height="22" rx="4" fill="rgba(143,163,115,0.12)"/>
  <text x="395" y="575" fill="#8FA373" font-size="9">Export Full Report</text>
  <rect x="540" y="560" width="140" height="22" rx="4" fill="rgba(209,168,92,0.12)"/>
  <text x="550" y="575" fill="#D1A85C" font-size="9">Review Churn List</text>

  <!-- Footer -->
  <rect x="40" y="625" width="1120" height="35" rx="6" fill="rgba(255,45,122,0.06)" stroke="rgba(255,45,122,0.2)" stroke-width="1"/>
  <text x="60" y="647" fill="#9A968C" font-size="11">AI Features:</text>
  <text x="210" y="647" fill="#F5F2EC" font-size="11">Automated Insights</text>
  <text x="400" y="647" fill="#F5F2EC" font-size="11">Anomaly Detection</text>
  <text x="590" y="647" fill="#F5F2EC" font-size="11">Recommendations</text>
  <text x="780" y="647" fill="#F5F2EC" font-size="11">Predictive Alerts</text>
</svg>
