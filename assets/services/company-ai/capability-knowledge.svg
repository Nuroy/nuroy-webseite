<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#0d0d0d"/>

  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="20" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="40" y="40" width="1120" height="720" rx="18" fill="#1a1a1a" stroke="rgba(255, 45, 135, 0.3)" stroke-width="1" filter="url(#glow)"/>

  <text x="80" y="90" font-family="monospace" font-size="10" fill="#ff2d87" letter-spacing="0.08em">KNOWLEDGE BASE • RAG SYSTEM</text>

  <rect x="80" y="120" width="680" height="560" rx="12" fill="#0d0d0d" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>

  <!-- Search Bar -->
  <rect x="100" y="140" width="640" height="50" rx="8" fill="rgba(255, 255, 255, 0.05)"/>
  <text x="120" y="171" font-family="sans-serif" font-size="13" fill="rgba(245, 241, 232, 0.4)">Frage stellen oder Dokument suchen...</text>
  <rect x="670" y="150" width="50" height="30" rx="6" fill="rgba(255, 45, 135, 0.2)"/>
  <text x="695" y="172" font-family="sans-serif" font-size="16" fill="#ff2d87" text-anchor="middle">🔍</text>

  <!-- Example Query -->
  <text x="100" y="220" font-family="sans-serif" font-size="13" fill="#f5f1e8" font-weight="600">Query: "Wie funktioniert unser Onboarding-Prozess?"</text>

  <rect x="580" y="205" width="140" height="24" rx="6" fill="rgba(184, 209, 138, 0.15)"/>
  <text x="650" y="221" font-family="monospace" font-size="10" fill="#b8d18a" text-anchor="middle">3 Treffer • 0.8s</text>

  <!-- Search Results -->
  <text x="100" y="255" font-family="sans-serif" font-size="12" fill="rgba(245, 241, 232, 0.7)">Relevante Dokumente</text>

  <!-- Result 1 -->
  <rect x="100" y="270" width="640" height="90" rx="8" fill="rgba(184, 209, 138, 0.08)" stroke="rgba(184, 209, 138, 0.2)" stroke-width="1"/>
  <rect x="115" y="285" width="60" height="18" rx="4" fill="rgba(184, 209, 138, 0.3)"/>
  <text x="145" y="298" font-family="monospace" font-size="9" fill="black" text-anchor="middle" font-weight="700">95% Match</text>
  <text x="185" y="300" font-family="sans-serif" font-size="13" fill="#f5f1e8" font-weight="600">Onboarding_Guide_2026.pdf</text>
  <text x="115" y="325" font-family="sans-serif" font-size="11" fill="rgba(245, 241, 232, 0.7)">...Der Onboarding-Prozess beginnt mit der Vertragsunterzeichnung.</text>
  <text x="115" y="342" font-family="sans-serif" font-size="11" fill="rgba(245, 241, 232, 0.7)">Neue Mitarbeiter erhalten Zugang zu unserem HR-Portal...</text>
  <text x="710" y="300" font-family="monospace" font-size="9" fill="rgba(245, 241, 232, 0.4)" text-anchor="end">Aktualisiert: 12.05.2026</text>

  <!-- Result 2 -->
  <rect x="100" y="370" width="640" height="90" rx="8" fill="rgba(255, 45, 135, 0.08)" stroke="rgba(255, 45, 135, 0.2)" stroke-width="1"/>
  <rect x="115" y="385" width="60" height="18" rx="4" fill="rgba(255, 45, 135, 0.3)"/>
  <text x="145" y="398" font-family="monospace" font-size="9" fill="white" text-anchor="middle" font-weight="700">88% Match</text>
  <text x="185" y="400" font-family="sans-serif" font-size="13" fill="#f5f1e8" font-weight="600">HR_Handbook_Employees.docx</text>
  <text x="115" y="425" font-family="sans-serif" font-size="11" fill="rgba(245, 241, 232, 0.7)">...Das Onboarding dauert in der Regel 2 Wochen. In dieser Zeit</text>
  <text x="115" y="442" font-family="sans-serif" font-size="11" fill="rgba(245, 241, 232, 0.7)">werden alle wichtigen Tools und Prozesse erklärt...</text>
  <text x="710" y="400" font-family="monospace" font-size="9" fill="rgba(245, 241, 232, 0.4)" text-anchor="end">Aktualisiert: 08.04.2026</text>

  <!-- Result 3 -->
  <rect x="100" y="470" width="640" height="90" rx="8" fill="rgba(245, 193, 78, 0.08)" stroke="rgba(245, 193, 78, 0.2)" stroke-width="1"/>
  <rect x="115" y="485" width="60" height="18" rx="4" fill="rgba(245, 193, 78, 0.3)"/>
  <text x="145" y="498" font-family="monospace" font-size="9" fill="black" text-anchor="middle" font-weight="700">72% Match</text>
  <text x="185" y="500" font-family="sans-serif" font-size="13" fill="#f5f1e8" font-weight="600">IT_Setup_Checklist.pdf</text>
  <text x="115" y="525" font-family="sans-serif" font-size="11" fill="rgba(245, 241, 232, 0.7)">...Am ersten Tag erhalten neue Mitarbeiter ihren Laptop,</text>
  <text x="115" y="542" font-family="sans-serif" font-size="11" fill="rgba(245, 241, 232, 0.7)">E-Mail-Zugang und alle benötigten Software-Lizenzen...</text>
  <text x="710" y="500" font-family="monospace" font-size="9" fill="rgba(245, 241, 232, 0.4)" text-anchor="end">Aktualisiert: 20.03.2026</text>

  <!-- Generated Answer -->
  <text x="100" y="590" font-family="sans-serif" font-size="13" fill="#f5f1e8" font-weight="600">KI-Generierte Antwort</text>

  <rect x="100" y="605" width="640" height="65" rx="8" fill="rgba(255, 255, 255, 0.03)"/>
  <text x="120" y="630" font-family="sans-serif" font-size="12" fill="rgba(245, 241, 232, 0.8)">Der Onboarding-Prozess dauert 2 Wochen und beginnt mit der</text>
  <text x="120" y="648" font-family="sans-serif" font-size="12" fill="rgba(245, 241, 232, 0.8)">Vertragsunterzeichnung. Neue Mitarbeiter erhalten Zugang zum</text>
  <text x="120" y="666" font-family="sans-serif" font-size="12" fill="rgba(245, 241, 232, 0.8)">HR-Portal, Laptop-Setup und alle Tools werden erklärt.</text>

