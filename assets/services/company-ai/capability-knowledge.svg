  <rect x="780" y="540" width="340" height="140" rx="12" fill="#0d0d0d" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
  <text x="800" y="565" font-family="monospace" font-size="9" fill="rgba(245, 241, 232, 0.5)">RAG CONFIGURATION</text>

  <text x="800" y="595" font-family="monospace" font-size="10" fill="rgba(245, 241, 232, 0.5)">Embedding Model</text>
  <text x="1100" y="595" font-family="monospace" font-size="12" fill="#f5f1e8" text-anchor="end">text-embed-3</text>

  <text x="800" y="625" font-family="monospace" font-size="10" fill="rgba(245, 241, 232, 0.5)">Vector Database</text>
  <text x="1100" y="625" font-family="monospace" font-size="12" fill="#f5f1e8" text-anchor="end">Pinecone</text>

  <text x="800" y="655" font-family="monospace" font-size="10" fill="rgba(245, 241, 232, 0.5)">LLM</text>
  <text x="1100" y="655" font-family="monospace" font-size="12" fill="#f5f1e8" text-anchor="end">GPT-4 Turbo</text>

  <rect x="80" y="700" width="340" height="50" rx="8" fill="rgba(184, 209, 138, 0.1)" stroke="rgba(184, 209, 138, 0.3)" stroke-width="1"/>
  <text x="100" y="730" font-family="sans-serif" font-size="12" fill="#b8d18a">↑ 842 Dokumente durchsuchbar</text>

  <rect x="440" y="700" width="340" height="50" rx="8" fill="rgba(255, 45, 135, 0.1)" stroke="rgba(255, 45, 135, 0.3)" stroke-width="1"/>
  <text x="460" y="730" font-family="sans-serif" font-size="12" fill="#ff2d87">⚡ 0.8s Search-Zeit — blitzschnell</text>

  <rect x="800" y="700" width="320" height="50" rx="8" fill="rgba(184, 209, 138, 0.1)" stroke="rgba(184, 209, 138, 0.3)" stroke-width="1"/>
  <text x="820" y="730" font-family="sans-serif" font-size="12" fill="#b8d18a">4.214 Queries diesen Monat</text>

  <text x="80" y="785" font-family="monospace" font-size="10" fill="rgba(245, 241, 232, 0.5)">Features:</text>
  <text x="145" y="785" font-family="monospace" font-size="10" fill="rgba(245, 241, 232, 0.7)">RAG · Vector Search · Pinecone · GPT-4 · Multi-Source · Semantic Search · Auto-Sync</text>
