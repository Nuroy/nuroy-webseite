  <text x="1100" y="205" font-family="monospace" font-size="14" fill="#ff2d87" text-anchor="end" font-weight="700">18.4k</text>

  <text x="800" y="235" font-family="monospace" font-size="10" fill="rgba(245, 241, 232, 0.5)">Queries (MTD)</text>
  <text x="1100" y="235" font-family="monospace" font-size="14" fill="#f5f1e8" text-anchor="end" font-weight="700">4.214</text>

  <text x="800" y="265" font-family="monospace" font-size="10" fill="rgba(245, 241, 232, 0.5)">Ø Search-Zeit</text>
  <text x="1100" y="265" font-family="monospace" font-size="14" fill="#b8d18a" text-anchor="end" font-weight="700">0.8s</text>

  <text x="800" y="295" font-family="monospace" font-size="10" fill="rgba(245, 241, 232, 0.5)">Relevanz-Score (Ø)</text>
  <rect x="800" y="302" width="300" height="8" rx="4" fill="rgba(255, 255, 255, 0.05)"/>
  <rect x="800" y="302" width="264" height="8" rx="4" fill="#b8d18a"/>

  <rect x="780" y="340" width="340" height="180" rx="12" fill="#0d0d0d" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
