<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#0d0d0d"/>

  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="20" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#ff2d87"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="1120" height="720" rx="18" fill="#1a1a1a" stroke="rgba(255, 45, 135, 0.3)" stroke-width="1" filter="url(#glow)"/>

  <text x="80" y="90" font-family="monospace" font-size="10" fill="#ff2d87" letter-spacing="0.08em">INTELLIGENT AUTOMATION • EMAIL-TO-TASK WORKFLOW</text>

  <rect x="80" y="120" width="680" height="560" rx="12" fill="#0d0d0d" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>

  <!-- Workflow Title -->
  <text x="100" y="150" font-family="sans-serif" font-size="14" fill="#f5f1e8" font-weight="600">Automatischer Email-Processing-Flow</text>

  <rect x="580" y="135" width="140" height="24" rx="6" fill="rgba(184, 209, 138, 0.15)"/>
  <circle cx="595" cy="147" r="3" fill="#b8d18a"/>
  <text x="605" y="151" font-family="monospace" font-size="10" fill="#b8d18a">Live • Aktiv</text>

  <!-- Step 1: Email Trigger -->
  <rect x="140" y="190" width="140" height="70" rx="8" fill="rgba(255, 45, 135, 0.1)" stroke="#ff2d87" stroke-width="2"/>
  <text x="210" y="215" font-family="monospace" font-size="9" fill="#ff2d87" font-weight="600" text-anchor="middle">TRIGGER</text>
  <text x="210" y="235" font-family="sans-serif" font-size="12" fill="#f5f1e8" text-anchor="middle">Neue Email von</text>
  <text x="210" y="250" font-family="sans-serif" font-size="12" fill="#f5f1e8" text-anchor="middle">Kunde erhalten</text>

  <!-- Arrow 1 -->
  <line x1="210" y1="260" x2="210" y2="300" stroke="#ff2d87" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Step 2: KI-Classification -->
  <rect x="140" y="300" width="140" height="70" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
  <text x="210" y="325" font-family="monospace" font-size="9" fill="rgba(245, 241, 232, 0.5)" font-weight="600" text-anchor="middle">KI-ANALYSE</text>
  <text x="210" y="345" font-family="sans-serif" font-size="12" fill="#f5f1e8" text-anchor="middle">Email-Inhalt</text>
  <text x="210" y="360" font-family="sans-serif" font-size="12" fill="#f5f1e8" text-anchor="middle">klassifizieren</text>

  <!-- Arrow 2 -->
  <line x1="210" y1="370" x2="210" y2="410" stroke="#ff2d87" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Step 3: Decision Point -->
  <rect x="140" y="410" width="140" height="70" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
  <text x="210" y="435" font-family="monospace" font-size="9" fill="rgba(245, 241, 232, 0.5)" font-weight="600" text-anchor="middle">ENTSCHEIDUNG</text>
  <text x="210" y="455" font-family="sans-serif" font-size="12" fill="#f5f1e8" text-anchor="middle">Kategorie:</text>
  <text x="210" y="470" font-family="sans-serif" font-size="12" fill="#ff2d87" text-anchor="middle" font-weight="700">Support-Anfrage</text>

  <!-- Branch Lines -->
  <line x1="210" y1="480" x2="210" y2="520" stroke="#ff2d87" stroke-width="2"/>
  <line x1="210" y1="520" x2="380" y2="520" stroke="#ff2d87" stroke-width="2"/>
  <line x1="380" y1="520" x2="380" y2="540" stroke="#ff2d87" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="210" y1="520" x2="550" y2="520" stroke="#ff2d87" stroke-width="2"/>
  <line x1="550" y1="520" x2="550" y2="540" stroke="#ff2d87" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Decision Label -->
  <rect x="180" y="505" width="60" height="30" rx="4" fill="rgba(245, 193, 78, 0.15)"/>
  <text x="210" y="525" font-family="monospace" font-size="9" fill="#f5c14e" text-anchor="middle">ROUTING</text>

  <!-- Branch 1: Create Ticket -->
  <rect x="310" y="540" width="140" height="70" rx="8" fill="rgba(184, 209, 138, 0.1)" stroke="#b8d18a" stroke-width="2"/>
  <text x="380" y="565" font-family="monospace" font-size="9" fill="#b8d18a" font-weight="600" text-anchor="middle">ACTION 1</text>
  <text x="380" y="585" font-family="sans-serif" font-size="12" fill="#f5f1e8" text-anchor="middle">Ticket erstellen</text>
  <text x="380" y="600" font-family="sans-serif" font-size="12" fill="#f5f1e8" text-anchor="middle">in Zendesk</text>

  <!-- Branch 2: Notify Team -->
  <rect x="480" y="540" width="140" height="70" rx="8" fill="rgba(184, 209, 138, 0.1)" stroke="#b8d18a" stroke-width="2"/>
  <text x="550" y="565" font-family="monospace" font-size="9" fill="#b8d18a" font-weight="600" text-anchor="middle">ACTION 2</text>
  <text x="550" y="585" font-family="sans-serif" font-size="12" fill="#f5f1e8" text-anchor="middle">Team in Slack</text>
  <text x="550" y="600" font-family="sans-serif" font-size="12" fill="#f5f1e8" text-anchor="middle">benachrichtigen</text>

  <!-- Final Step: Complete -->
  <line x1="380" y1="610" x2="380" y2="630" stroke="#b8d18a" stroke-width="2"/>
  <line x1="380" y1="630" x2="465" y2="630" stroke="#b8d18a" stroke-width="2"/>
  <line x1="550" y1="610" x2="550" y2="630" stroke="#b8d18a" stroke-width="2"/>
  <line x1="465" y1="630" x2="550" y2="630" stroke="#b8d18a" stroke-width="2"/>
  <line x1="465" y1="630" x2="465" y2="650" stroke="#ff2d87" stroke-width="2" marker-end="url(#arrowhead)"/>

  <rect x="395" y="650" width="140" height="50" rx="8" fill="rgba(184, 209, 138, 0.1)" stroke="#b8d18a" stroke-width="2"/>
  <text x="465" y="680" font-family="sans-serif" font-size="13" fill="#b8d18a" font-weight="600" text-anchor="middle">✓ Workflow</text>
  <text x="465" y="695" font-family="sans-serif" font-size="13" fill="#b8d18a" font-weight="600" text-anchor="middle">abgeschlossen</text>

  <!-- Stats Overlay -->
  <rect x="100" y="610" width="200" height="60" rx="8" fill="rgba(0, 0, 0, 0.7)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
  <text x="115" y="630" font-family="monospace" font-size="9" fill="rgba(245, 241, 232, 0.5)">Heute ausgeführt:</text>
  <text x="115" y="650" font-family="monospace" font-size="16" fill="#ff2d87" font-weight="700">47×</text>
  <text x="115" y="665" font-family="monospace" font-size="9" fill="rgba(245, 241, 232, 0.5)">Ø Dauer: 3.2s</text>

  <!-- Right Column -->
  <rect x="780" y="120" width="340" height="200" rx="12" fill="#0d0d0d" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
  <text x="800" y="145" font-family="monospace" font-size="9" fill="rgba(245, 241, 232, 0.5)">AUTOMATION STATS</text>

  <text x="800" y="175" font-family="monospace" font-size="10" fill="rgba(245, 241, 232, 0.5)">Workflows ausgeführt (MTD)</text>
  <text x="1100" y="175" font-family="monospace" font-size="14" fill="#b8d18a" text-anchor="end" font-weight="700">1,842</text>

  <text x="800" y="205" font-family="monospace" font-size="10" fill="rgba(245, 241, 232, 0.5)">Erfolgsrate</text>
  <rect x="800" y="212" width="300" height="8" rx="4" fill="rgba(255, 255, 255, 0.05)"/>
  <rect x="800" y="212" width="291" height="8" rx="4" fill="#b8d18a"/>
  <text x="1100" y="230" font-family="monospace" font-size="11" fill="#b8d18a" text-anchor="end" font-weight="700">97%</text>

  <text x="800" y="260" font-family="monospace" font-size="10" fill="rgba(245, 241, 232, 0.5)">Ø Verarbeitungszeit</text>
  <text x="1100" y="260" font-family="monospace" font-size="14" fill="#ff2d87" text-anchor="end" font-weight="700">3.2s</text>

  <text x="800" y="290" font-family="monospace" font-size="10" fill="rgba(245, 241, 232, 0.5)">Zeit gespart (MTD)</text>
  <text x="1100" y="290" font-family="monospace" font-size="14" fill="#b8d18a" text-anchor="end" font-weight="700">~42h</text>

  <rect x="780" y="340" width="340" height="180" rx="12" fill="#0d0d0d" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
  <text x="800" y="365" font-family="monospace" font-size="9" fill="rgba(245, 241, 232, 0.5)">AKTIVE WORKFLOWS</text>

  <rect x="800" y="380" width="300" height="35" rx="6" fill="rgba(184, 209, 138, 0.08)"/>
  <circle cx="815" cy="397" r="4" fill="#b8d18a"/>
  <text x="830" y="394" font-family="sans-serif" font-size="11" fill="#f5f1e8" font-weight="600">Email-to-Ticket</text>
  <text x="830" y="407" font-family="monospace" font-size="9" fill="rgba(245, 241, 232, 0.5)">47 heute • 97% Erfolg</text>

  <rect x="800" y="425" width="300" height="35" rx="6" fill="rgba(184, 209, 138, 0.08)"/>
  <circle cx="815" cy="442" r="4" fill="#b8d18a"/>
  <text x="830" y="439" font-family="sans-serif" font-size="11" fill="#f5f1e8" font-weight="600">Invoice-Processing</text>
  <text x="830" y="452" font-family="monospace" font-size="9" fill="rgba(245, 241, 232, 0.5)">23 heute • 100% Erfolg</text>

  <rect x="800" y="470" width="300" height="35" rx="6" fill="rgba(184, 209, 138, 0.08)"/>
  <circle cx="815" cy="487" r="4" fill="#b8d18a"/>
  <text x="830" y="484" font-family="sans-serif" font-size="11" fill="#f5f1e8" font-weight="600">Lead-Enrichment</text>
  <text x="830" y="497" font-family="monospace" font-size="9" fill="rgba(245, 241, 232, 0.5)">18 heute • 94% Erfolg</text>

  <rect x="780" y="540" width="340" height="140" rx="12" fill="#0d0d0d" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
  <text x="800" y="565" font-family="monospace" font-size="9" fill="rgba(245, 241, 232, 0.5)">KI-CAPABILITIES</text>

  <rect x="800" y="580" width="300" height="30" rx="6" fill="rgba(184, 209, 138, 0.08)"/>
  <circle cx="815" cy="595" r="4" fill="#b8d18a"/>
  <text x="830" y="599" font-family="sans-serif" font-size="11" fill="#f5f1e8">Email Classification (NLP)</text>

  <rect x="800" y="620" width="300" height="30" rx="6" fill="rgba(184, 209, 138, 0.08)"/>
  <circle cx="815" cy="635" r="4" fill="#b8d18a"/>
  <text x="830" y="639" font-family="sans-serif" font-size="11" fill="#f5f1e8">Smart Routing &amp; Prioritization</text>

  <rect x="80" y="700" width="340" height="50" rx="8" fill="rgba(184, 209, 138, 0.1)" stroke="rgba(184, 209, 138, 0.3)" stroke-width="1"/>
  <text x="100" y="730" font-family="sans-serif" font-size="12" fill="#b8d18a">↑ 1.842 Workflows automatisch ausgeführt</text>

  <rect x="440" y="700" width="340" height="50" rx="8" fill="rgba(255, 45, 135, 0.1)" stroke="rgba(255, 45, 135, 0.3)" stroke-width="1"/>
  <text x="460" y="730" font-family="sans-serif" font-size="12" fill="#ff2d87">⚡ 3.2s Verarbeitungszeit — blitzschnell</text>

  <rect x="800" y="700" width="320" height="50" rx="8" fill="rgba(184, 209, 138, 0.1)" stroke="rgba(184, 209, 138, 0.3)" stroke-width="1"/>
  <text x="820" y="730" font-family="sans-serif" font-size="12" fill="#b8d18a">~42h gespart diesen Monat!</text>

  <text x="80" y="785" font-family="monospace" font-size="10" fill="rgba(245, 241, 232, 0.5)">Features:</text>
  <text x="145" y="785" font-family="monospace" font-size="10" fill="rgba(245, 241, 232, 0.7)">Email-Processing · NLP Classification · Smart Routing · Multi-Platform · Error Handling · Analytics</text>
</svg>
