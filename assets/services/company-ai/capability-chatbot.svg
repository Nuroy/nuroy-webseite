  <rect x="110" y="365" width="480" height="130" rx="8" fill="rgba(184, 209, 138, 0.05)" stroke="rgba(184, 209, 138, 0.2)" stroke-width="1"/>
  <circle cx="125" cy="385" r="10" fill="rgba(184, 209, 138, 0.2)"/>
  <text x="125" y="390" font-family="sans-serif" font-size="10" fill="#b8d18a" text-anchor="middle" font-weight="700">AI</text>
  <text x="145" y="390" font-family="sans-serif" font-size="12" fill="#f5f1e8">Dein Urlaubskontingent für 2026:</text>

  <rect x="165" y="405" width="400" height="70" rx="6" fill="rgba(255, 255, 255, 0.03)"/>
  <text x="185" y="425" font-family="monospace" font-size="11" fill="rgba(245, 241, 232, 0.6)">• Gesamtanspruch: 30 Tage</text>
  <text x="185" y="445" font-family="monospace" font-size="11" fill="rgba(245, 241, 232, 0.6)">• Bereits genommen: 12 Tage</text>
  <text x="185" y="465" font-family="monospace" font-size="11" fill="#b8d18a" font-weight="700">• Verbleibend: 18 Tage</text>

  <text x="145" y="490" font-family="monospace" font-size="9" fill="rgba(245, 241, 232, 0.4)">09:43</text>

