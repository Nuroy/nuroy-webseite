  <text x="800" y="175" font-family="monospace" font-size="10" fill="rgba(245, 241, 232, 0.5)">Gespräche (MTD)</text>
  <text x="1100" y="175" font-family="monospace" font-size="14" fill="#b8d18a" text-anchor="end" font-weight="700">2,142</text>

  <text x="800" y="205" font-family="monospace" font-size="10" fill="rgba(245, 241, 232, 0.5)">Gelöste Anfragen</text>
  <rect x="800" y="212" width="300" height="8" rx="4" fill="rgba(255, 255, 255, 0.05)"/>
  <rect x="800" y="212" width="261" height="8" rx="4" fill="#b8d18a"/>
  <text x="1100" y="230" font-family="monospace" font-size="11" fill="#b8d18a" text-anchor="end" font-weight="700">87%</text>

  <text x="800" y="260" font-family="monospace" font-size="10" fill="rgba(245, 241, 232, 0.5)">Ø Antwortzeit</text>
  <text x="1100" y="260" font-family="monospace" font-size="14" fill="#ff2d87" text-anchor="end" font-weight="700">0.9s</text>

  <text x="800" y="290" font-family="monospace" font-size="10" fill="rgba(245, 241, 232, 0.5)">User Satisfaction</text>
  <text x="1100" y="290" font-family="monospace" font-size="14" fill="#b8d18a" text-anchor="end" font-weight="700">4.7/5</text>

  <rect x="780" y="340" width="340" height="180" rx="12" fill="#0d0d0d" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
  <text x="800" y="365" font-family="monospace" font-size="9" fill="rgba(245, 241, 232, 0.5)">TOP ANFRAGEN</text>

  <rect x="800" y="380" width="300" height="30" rx="6" fill="rgba(184, 209, 138, 0.08)"/>
  <text x="820" y="399" font-family="sans-serif" font-size="11" fill="#f5f1e8">🏖️ Urlaubsanfragen (342)</text>

  <rect x="800" y="420" width="300" height="30" rx="6" fill="rgba(255, 45, 135, 0.08)"/>
  <text x="820" y="439" font-family="sans-serif" font-size="11" fill="#f5f1e8">💰 Gehaltsabrechnungen (218)</text>

  <rect x="800" y="460" width="300" height="30" rx="6" fill="rgba(245, 193, 78, 0.08)"/>
  <text x="820" y="479" font-family="sans-serif" font-size="11" fill="#f5f1e8">🏥 Krankmeldungen (142)</text>

  <rect x="780" y="540" width="340" height="140" rx="12" fill="#0d0d0d" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
  <text x="800" y="565" font-family="monospace" font-size="9" fill="rgba(245, 241, 232, 0.5)">INTEGRATIONS</text>

  <rect x="800" y="580" width="300" height="30" rx="6" fill="rgba(184, 209, 138, 0.08)"/>
  <circle cx="815" cy="595" r="4" fill="#b8d18a"/>
  <text x="830" y="599" font-family="sans-serif" font-size="11" fill="#b8d18a">✓ HR-System (Personio)</text>

  <rect x="800" y="620" width="300" height="30" rx="6" fill="rgba(184, 209, 138, 0.08)"/>
  <circle cx="815" cy="635" r="4" fill="#b8d18a"/>
  <text x="830" y="639" font-family="sans-serif" font-size="11" fill="#b8d18a">✓ Kalender (Google Calendar)</text>

  <rect x="80" y="700" width="340" height="50" rx="8" fill="rgba(184, 209, 138, 0.1)" stroke="rgba(184, 209, 138, 0.3)" stroke-width="1"/>
  <text x="100" y="730" font-family="sans-serif" font-size="12" fill="#b8d18a">↑ 2.142 Gespräche mit 87% Lösungsrate</text>

  <rect x="440" y="700" width="340" height="50" rx="8" fill="rgba(255, 45, 135, 0.1)" stroke="rgba(255, 45, 135, 0.3)" stroke-width="1"/>
  <text x="460" y="730" font-family="sans-serif" font-size="12" fill="#ff2d87">⚡ 0.9s Antwortzeit — sofort verfügbar</text>

  <rect x="800" y="700" width="320" height="50" rx="8" fill="rgba(184, 209, 138, 0.1)" stroke="rgba(184, 209, 138, 0.3)" stroke-width="1"/>
  <text x="820" y="730" font-family="sans-serif" font-size="12" fill="#b8d18a">4.7/5 Satisfaction — Mitarbeiter lieben es</text>

  <text x="80" y="785" font-family="monospace" font-size="10" fill="rgba(245, 241, 232, 0.5)">Features:</text>
  <text x="145" y="785" font-family="monospace" font-size="10" fill="rgba(245, 241, 232, 0.7)">HR Integration · Natural Language · 24/7 Verfügbar · Personalisiert · Multi-Topic · Auto-Actions</text>
</svg>
