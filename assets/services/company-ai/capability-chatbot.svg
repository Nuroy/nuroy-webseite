  <text x="145" y="535" font-family="sans-serif" font-size="12" fill="#f5f1e8">Möchtest du Urlaub beantragen?</text>

  <rect x="165" y="550" width="150" height="35" rx="6" fill="rgba(184, 209, 138, 0.1)" stroke="rgba(184, 209, 138, 0.3)" stroke-width="1"/>
  <text x="240" y="573" font-family="sans-serif" font-size="11" fill="#b8d18a" text-anchor="middle">✓ Urlaub beantragen</text>

  <rect x="330" y="550" width="150" height="35" rx="6" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
  <text x="405" y="573" font-family="sans-serif" font-size="11" fill="#f5f1e8" text-anchor="middle">📅 Urlaubs-Historie</text>

  <text x="145" y="600" font-family="monospace" font-size="9" fill="rgba(245, 241, 232, 0.4)">09:43</text>

  <!-- Input Field -->
  <rect x="100" y="625" width="640" height="45" rx="8" fill="rgba(255, 255, 255, 0.05)"/>
  <text x="120" y="653" font-family="sans-serif" font-size="12" fill="rgba(245, 241, 232, 0.4)">Nachricht eingeben...</text>
  <rect x="670" y="635" width="50" height="25" rx="6" fill="rgba(255, 45, 135, 0.2)"/>
  <text x="695" y="653" font-family="sans-serif" font-size="16" fill="#ff2d87" text-anchor="middle">→</text>

