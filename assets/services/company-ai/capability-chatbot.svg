<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#0d0d0d"/>

  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="20" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="40" y="40" width="1120" height="720" rx="18" fill="#1a1a1a" stroke="rgba(255, 45, 135, 0.3)" stroke-width="1" filter="url(#glow)"/>

  <text x="80" y="90" font-family="monospace" font-size="10" fill="#ff2d87" letter-spacing="0.08em">COMPANY CHATBOT • INTERNAL SUPPORT AI</text>

  <rect x="80" y="120" width="680" height="560" rx="12" fill="#0d0d0d" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>

  <!-- Chat Header -->
  <rect x="100" y="140" width="640" height="50" rx="8" fill="rgba(255, 45, 135, 0.08)"/>
  <circle cx="120" cy="165" r="12" fill="rgba(184, 209, 138, 0.3)"/>
  <text x="120" y="171" font-family="sans-serif" font-size="12" fill="#b8d18a" text-anchor="middle" font-weight="700">AI</text>
  <text x="145" y="170" font-family="sans-serif" font-size="14" fill="#f5f1e8" font-weight="600">Nuroy HR-Assistent</text>
  <rect x="620" y="152" width="100" height="26" rx="6" fill="rgba(184, 209, 138, 0.15)"/>
  <circle cx="635" cy="165" r="4" fill="#b8d18a"/>
  <text x="645" y="170" font-family="monospace" font-size="10" fill="#b8d18a">Verfügbar</text>

  <!-- Chat Messages -->
  <!-- Message 1 - Bot Welcome -->
  <rect x="110" y="210" width="480" height="70" rx="8" fill="rgba(255, 255, 255, 0.03)"/>
  <circle cx="125" cy="230" r="10" fill="rgba(184, 209, 138, 0.2)"/>
  <text x="125" y="235" font-family="sans-serif" font-size="10" fill="#b8d18a" text-anchor="middle" font-weight="700">AI</text>
  <text x="145" y="235" font-family="sans-serif" font-size="12" fill="#f5f1e8">Hallo! Ich kann dir helfen bei Fragen zu Urlaub, Gehalt,</text>
  <text x="145" y="253" font-family="sans-serif" font-size="12" fill="#f5f1e8">Benefits und HR-Prozessen. Was möchtest du wissen?</text>
  <text x="145" y="272" font-family="monospace" font-size="9" fill="rgba(245, 241, 232, 0.4)">09:42</text>

  <!-- Message 2 - User Query -->
  <rect x="250" y="295" width="480" height="55" rx="8" fill="rgba(255, 45, 135, 0.08)"/>
  <text x="270" y="320" font-family="sans-serif" font-size="12" fill="#f5f1e8">Wie viele Urlaubstage habe ich noch übrig?</text>
  <text x="700" y="340" font-family="monospace" font-size="9" fill="rgba(245, 241, 232, 0.4)" text-anchor="end">09:43</text>
  <circle cx="715" cy="315" r="10" fill="rgba(255, 45, 135, 0.2)"/>
  <text x="715" y="320" font-family="sans-serif" font-size="10" fill="#ff2d87" text-anchor="middle" font-weight="700">MS</text>

