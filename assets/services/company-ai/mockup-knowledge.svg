<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0A0C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#121216;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#grad1)"/>

  <!-- Title Badge -->
  <text x="40" y="35" fill="#FF2D7A" font-size="12" font-family="monospace" letter-spacing="2">KNOWLEDGE BASE SEARCH</text>

  <!-- Search Interface -->
  <rect x="40" y="70" width="1120" height="540" rx="8" fill="#1C1C22" stroke="rgba(245,242,236,0.08)" stroke-width="1"/>

  <!-- Search Bar -->
  <rect x="60" y="100" width="1080" height="70" rx="8" fill="rgba(255,45,122,0.08)" stroke="rgba(255,45,122,0.2)" stroke-width="1"/>
  <text x="90" y="125" fill="#9A968C" font-size="11" font-family="monospace">SEARCH QUERY</text>
  <text x="90" y="153" fill="#F5F2EC" font-size="16">"How do I submit a vacation request?"</text>

  <!-- Search Stats -->
  <text x="60" y="205" fill="#9A968C" font-size="11">Found 8 relevant results in 0.34s</text>
  <rect x="300" y="192" width="100" height="20" rx="4" fill="rgba(143,163,115,0.12)"/>
  <text x="310" y="205" fill="#8FA373" font-size="10" font-family="monospace">AI-Powered</text>

  <!-- Search Results -->
  <rect x="60" y="230" width="1080" height="120" rx="6" fill="rgba(255,45,122,0.08)" stroke="rgba(255,45,122,0.2)" stroke-width="1"/>
  <rect x="75" y="245" width="80" height="20" rx="3" fill="rgba(255,45,122,0.15)"/>
  <text x="82" y="258" fill="#FF2D7A" font-size="9" font-family="monospace">BEST MATCH</text>
  <text x="170" y="258" fill="#FF2D7A" font-size="9">98% relevance</text>

  <text x="75" y="280" fill="#F5F2EC" font-size="14" font-weight="bold">Vacation Request Process</text>
  <text x="75" y="300" fill="#9A968C" font-size="10">HR Guidelines • Last updated: May 15, 2024</text>
  <text x="75" y="320" fill="#F5F2EC" font-size="11">To submit a vacation request, log into the employee portal and navigate to</text>
  <text x="75" y="335" fill="#F5F2EC" font-size="11">Time Off → Request Vacation. Requests must be submitted at least 2 weeks in advance...</text>

  <rect x="60" y="365" width="1080" height="110" rx="6" fill="rgba(245,242,236,0.04)" stroke="rgba(245,242,236,0.08)" stroke-width="1"/>
  <text x="75" y="388" fill="#8FA373" font-size="9">92% relevance</text>
  <text x="75" y="408" fill="#F5F2EC" font-size="14" font-weight="bold">Employee Portal Guide</text>
  <text x="75" y="428" fill="#9A968C" font-size="10">IT Documentation • Last updated: April 22, 2024</text>
  <text x="75" y="448" fill="#F5F2EC" font-size="11">The employee portal provides access to HR tools including vacation requests,</text>
  <text x="75" y="463" fill="#F5F2EC" font-size="11">time tracking, benefits enrollment, and payroll information...</text>

  <rect x="60" y="490" width="1080" height="110" rx="6" fill="rgba(245,242,236,0.04)" stroke="rgba(245,242,236,0.08)" stroke-width="1"/>
  <text x="75" y="513" fill="#D1A85C" font-size="9">87% relevance</text>
  <text x="75" y="533" fill="#F5F2EC" font-size="14" font-weight="bold">Time Off Policy 2024</text>
  <text x="75" y="553" fill="#9A968C" font-size="10">Company Policies • Last updated: January 10, 2024</text>
  <text x="75" y="573" fill="#F5F2EC" font-size="11">Employees accrue 2.5 days of vacation per month. All vacation requests require</text>
  <text x="75" y="588" fill="#F5F2EC" font-size="11">manager approval. Peak season blackout dates apply...</text>

  <!-- Footer -->
  <rect x="40" y="625" width="1120" height="35" rx="6" fill="rgba(255,45,122,0.06)" stroke="rgba(255,45,122,0.2)" stroke-width="1"/>
  <text x="60" y="647" fill="#9A968C" font-size="11">AI Features:</text>
  <text x="210" y="647" fill="#F5F2EC" font-size="11">Semantic Search</text>
  <text x="400" y="647" fill="#F5F2EC" font-size="11">Relevance Ranking</text>
  <text x="590" y="647" fill="#F5F2EC" font-size="11">Natural Language</text>
  <text x="780" y="647" fill="#F5F2EC" font-size="11">Context Understanding</text>
</svg>
