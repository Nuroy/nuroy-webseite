<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0A0C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#121216;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#grad1)"/>
  <text x="40" y="35" fill="#FF2D7A" font-size="12" font-family="monospace" letter-spacing="2">CUSTOM API BUILDER INTERFACE</text>

  <rect x="40" y="70" width="1120" height="540" rx="8" fill="#1C1C22" stroke="rgba(245,242,236,0.08)" stroke-width="1"/>

  <!-- Endpoint Builder -->
  <text x="60" y="100" fill="#9A968C" font-size="11" font-family="monospace" letter-spacing="1">API ENDPOINT CONFIGURATION</text>

  <!-- Endpoint Details -->
  <rect x="60" y="120" width="540" height="460" rx="6" fill="rgba(245,242,236,0.02)" stroke="rgba(245,242,236,0.08)" stroke-width="1"/>

  <!-- Method &amp; Path -->
  <rect x="80" y="140" width="500" height="60" rx="4" fill="rgba(255,45,122,0.08)" stroke="rgba(255,45,122,0.2)" stroke-width="1"/>
  <rect x="95" y="155" width="60" height="30" rx="4" fill="rgba(143,163,115,0.12)"/>
  <text x="110" y="176" fill="#8FA373" font-size="12" font-weight="bold">GET</text>
  <text x="170" y="176" fill="#F5F2EC" font-size="13" font-family="monospace">/api/v1/customers/:id</text>

  <!-- Headers -->
  <text x="80" y="225" fill="#5E5A52" font-size="10" font-family="monospace">REQUEST HEADERS</text>
  <rect x="80" y="235" width="500" height="90" rx="4" fill="rgba(245,242,236,0.04)" stroke="rgba(245,242,236,0.08)" stroke-width="1"/>

  <text x="100" y="255" fill="#FF2D7A" font-size="10" font-family="monospace">Authorization:</text>
  <text x="250" y="255" fill="#F5F2EC" font-size="10" font-family="monospace">Bearer {token}</text>

  <text x="100" y="275" fill="#FF2D7A" font-size="10" font-family="monospace">Content-Type:</text>
  <text x="250" y="275" fill="#F5F2EC" font-size="10" font-family="monospace">application/json</text>

  <text x="100" y="295" fill="#FF2D7A" font-size="10" font-family="monospace">Accept:</text>
  <text x="250" y="295" fill="#F5F2EC" font-size="10" font-family="monospace">application/json</text>

  <!-- Parameters -->
  <text x="80" y="350" fill="#5E5A52" font-size="10" font-family="monospace">PARAMETERS</text>
  <rect x="80" y="360" width="500" height="110" rx="4" fill="rgba(245,242,236,0.04)" stroke="rgba(245,242,236,0.08)" stroke-width="1"/>

  <rect x="100" y="375" width="460" height="25" rx="3" fill="rgba(245,242,236,0.02)"/>
  <text x="115" y="392" fill="#FF2D7A" font-size="10" font-family="monospace">id</text>
  <text x="200" y="392" fill="#9A968C" font-size="9">string (path)</text>
  <text x="340" y="392" fill="#9A968C" font-size="9">required</text>
  <text x="450" y="392" fill="#F5F2EC" font-size="9">Customer ID</text>

  <rect x="100" y="405" width="460" height="25" rx="3" fill="rgba(245,242,236,0.02)"/>
  <text x="115" y="422" fill="#FF2D7A" font-size="10" font-family="monospace">include</text>
  <text x="200" y="422" fill="#9A968C" font-size="9">string (query)</text>
  <text x="340" y="422" fill="#9A968C" font-size="9">optional</text>
  <text x="450" y="422" fill="#F5F2EC" font-size="9">Related data</text>

  <rect x="100" y="435" width="460" height="25" rx="3" fill="rgba(245,242,236,0.02)"/>
  <text x="115" y="452" fill="#FF2D7A" font-size="10" font-family="monospace">fields</text>
  <text x="200" y="452" fill="#9A968C" font-size="9">array (query)</text>
  <text x="340" y="452" fill="#9A968C" font-size="9">optional</text>
  <text x="450" y="452" fill="#F5F2EC" font-size="9">Field filter</text>

  <!-- Response -->
  <text x="80" y="495" fill="#5E5A52" font-size="10" font-family="monospace">RESPONSE BODY</text>
  <rect x="80" y="505" width="500" height="65" rx="4" fill="#0A0A0C" stroke="rgba(245,242,236,0.08)" stroke-width="1"/>
  <text x="100" y="525" fill="#9A968C" font-size="9" font-family="monospace">{</text>
  <text x="120" y="540" fill="#D1A85C" font-size="9" font-family="monospace">"id"</text>
  <text x="160" y="540" fill="#9A968C" font-size="9" font-family="monospace">:</text>
  <text x="175" y="540" fill="#8FA373" font-size="9" font-family="monospace">"12345"</text>
  <text x="230" y="540" fill="#9A968C" font-size="9" font-family="monospace">,</text>
  <text x="120" y="555" fill="#D1A85C" font-size="9" font-family="monospace">"name"</text>
  <text x="170" y="555" fill="#9A968C" font-size="9" font-family="monospace">:</text>
  <text x="185" y="555" fill="#8FA373" font-size="9" font-family="monospace">"TechCorp GmbH"</text>
  <text x="100" y="565" fill="#9A968C" font-size="9" font-family="monospace">}</text>

  <!-- Testing Panel -->
  <rect x="620" y="120" width="520" height="460" rx="6" fill="rgba(245,242,236,0.02)" stroke="rgba(245,242,236,0.08)" stroke-width="1"/>
  <text x="640" y="150" fill="#F5F2EC" font-size="12" font-weight="bold">API Testing</text>

  <!-- Test Request -->
  <text x="640" y="180" fill="#5E5A52" font-size="10" font-family="monospace">TEST REQUEST</text>
  <rect x="640" y="190" width="480" height="100" rx="4" fill="rgba(255,45,122,0.08)" stroke="rgba(255,45,122,0.2)" stroke-width="1"/>
  <text x="660" y="210" fill="#8FA373" font-size="10" font-family="monospace">GET</text>
  <text x="700" y="210" fill="#F5F2EC" font-size="10" font-family="monospace">https://api.yourcompany.com</text>
  <text x="700" y="228" fill="#F5F2EC" font-size="10" font-family="monospace">/v1/customers/12345</text>
  <text x="660" y="250" fill="#9A968C" font-size="9">Headers: 3 • Params: 1</text>
  <rect x="660" y="260" width="100" height="22" rx="4" fill="rgba(255,45,122,0.15)"/>
  <text x="680" y="275" fill="#FF2D7A" font-size="10" font-weight="bold">SEND REQUEST</text>

  <!-- Test Response -->
  <text x="640" y="315" fill="#5E5A52" font-size="10" font-family="monospace">RESPONSE</text>
  <rect x="640" y="325" width="480" height="45" rx="4" fill="rgba(143,163,115,0.08)" stroke="rgba(143,163,115,0.2)" stroke-width="1"/>
  <rect x="655" y="338" width="80" height="20" rx="3" fill="rgba(143,163,115,0.15)"/>
  <text x="665" y="352" fill="#8FA373" font-size="10" font-family="monospace">200 OK</text>
  <text x="750" y="352" fill="#9A968C" font-size="9">Response time: 124ms</text>

  <!-- Response Body -->
  <rect x="640" y="380" width="480" height="190" rx="4" fill="#0A0A0C" stroke="rgba(245,242,236,0.08)" stroke-width="1"/>
  <text x="660" y="400" fill="#9A968C" font-size="9" font-family="monospace">{</text>
  <text x="680" y="418" fill="#D1A85C" font-size="9" font-family="monospace">"id"</text>
  <text x="720" y="418" fill="#9A968C" font-size="9" font-family="monospace">:</text>
  <text x="740" y="418" fill="#8FA373" font-size="9" font-family="monospace">"12345"</text>
  <text x="800" y="418" fill="#9A968C" font-size="9" font-family="monospace">,</text>

  <text x="680" y="436" fill="#D1A85C" font-size="9" font-family="monospace">"name"</text>
  <text x="730" y="436" fill="#9A968C" font-size="9" font-family="monospace">:</text>
  <text x="750" y="436" fill="#8FA373" font-size="9" font-family="monospace">"TechCorp GmbH"</text>
  <text x="880" y="436" fill="#9A968C" font-size="9" font-family="monospace">,</text>

  <text x="680" y="454" fill="#D1A85C" font-size="9" font-family="monospace">"email"</text>
  <text x="735" y="454" fill="#9A968C" font-size="9" font-family="monospace">:</text>
  <text x="755" y="454" fill="#8FA373" font-size="9" font-family="monospace">"info@techcorp.com"</text>
  <text x="900" y="454" fill="#9A968C" font-size="9" font-family="monospace">,</text>

  <text x="680" y="472" fill="#D1A85C" font-size="9" font-family="monospace">"status"</text>
  <text x="740" y="472" fill="#9A968C" font-size="9" font-family="monospace">:</text>
  <text x="760" y="472" fill="#8FA373" font-size="9" font-family="monospace">"active"</text>
  <text x="830" y="472" fill="#9A968C" font-size="9" font-family="monospace">,</text>

  <text x="680" y="490" fill="#D1A85C" font-size="9" font-family="monospace">"created_at"</text>
  <text x="765" y="490" fill="#9A968C" font-size="9" font-family="monospace">:</text>
  <text x="785" y="490" fill="#8FA373" font-size="9" font-family="monospace">"2024-01-15T10:30:00Z"</text>

  <text x="680" y="508" fill="#D1A85C" font-size="9" font-family="monospace">"orders_count"</text>
  <text x="785" y="508" fill="#9A968C" font-size="9" font-family="monospace">:</text>
  <text x="805" y="508" fill="#FF2D7A" font-size="9" font-family="monospace">42</text>

  <text x="680" y="526" fill="#D1A85C" font-size="9" font-family="monospace">"total_value"</text>
  <text x="775" y="526" fill="#9A968C" font-size="9" font-family="monospace">:</text>
  <text x="795" y="526" fill="#FF2D7A" font-size="9" font-family="monospace">24750.50</text>

  <text x="660" y="544" fill="#9A968C" font-size="9" font-family="monospace">}</text>

  <text x="660" y="562" fill="#8FA373" font-size="8">✓ Valid JSON • 7 fields returned</text>

  <rect x="40" y="625" width="1120" height="35" rx="6" fill="rgba(255,45,122,0.06)" stroke="rgba(255,45,122,0.2)" stroke-width="1"/>
  <text x="60" y="647" fill="#9A968C" font-size="11">API Features:</text>
  <text x="210" y="647" fill="#F5F2EC" font-size="11">RESTful Endpoints</text>
  <text x="400" y="647" fill="#F5F2EC" font-size="11">Interactive Testing</text>
  <text x="600" y="647" fill="#F5F2EC" font-size="11">Auto Documentation</text>
  <text x="820" y="647" fill="#F5F2EC" font-size="11">Custom Parameters</text>
</svg>
