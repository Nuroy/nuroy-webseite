<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0A0C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#121216;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#grad1)"/>
  <text x="40" y="35" fill="#FF2D7A" font-size="12" font-family="monospace" letter-spacing="2">E-COMMERCE PLATFORM SYNC</text>

  <rect x="40" y="70" width="1120" height="540" rx="8" fill="#1C1C22" stroke="rgba(245,242,236,0.08)" stroke-width="1"/>
  <text x="60" y="100" fill="#9A968C" font-size="11" font-family="monospace" letter-spacing="1">SHOPIFY → WAREHOUSE MANAGEMENT • REAL-TIME INVENTORY</text>

  <!-- Shopify Store -->
  <rect x="80" y="140" width="340" height="440" rx="8" fill="rgba(245,242,236,0.02)" stroke="rgba(245,242,236,0.08)" stroke-width="1"/>
  <text x="100" y="170" fill="#F5F2EC" font-size="14" font-weight="bold">Shopify Store</text>

  <!-- Order Flow -->
  <rect x="100" y="195" width="300" height="100" rx="6" fill="rgba(255,45,122,0.08)" stroke="rgba(255,45,122,0.2)" stroke-width="1"/>
  <text x="120" y="218" fill="#FF2D7A" font-size="12" font-weight="bold">New Order #8472</text>
  <text x="120" y="238" fill="#F5F2EC" font-size="10">Customer: Anna Schmidt</text>
  <text x="120" y="255" fill="#9A968C" font-size="9">3x Product A (€129 ea)</text>
  <text x="120" y="270" fill="#9A968C" font-size="9">1x Product B (€249)</text>
  <text x="120" y="287" fill="#8FA373" font-size="10">Total: €636</text>

  <rect x="100" y="310" width="300" height="90" rx="6" fill="rgba(245,242,236,0.04)" stroke="rgba(245,242,236,0.08)" stroke-width="1"/>
  <text x="120" y="333" fill="#F5F2EC" font-size="11" font-weight="bold">Products (2,847)</text>
  <text x="120" y="353" fill="#9A968C" font-size="9">Stock levels synced</text>
  <text x="120" y="370" fill="#9A968C" font-size="9">Prices updated</text>
  <text x="120" y="387" fill="#8FA373" font-size="8">✓ Last sync: 30s ago</text>

  <rect x="100" y="415" width="300" height="90" rx="6" fill="rgba(245,242,236,0.04)" stroke="rgba(245,242,236,0.08)" stroke-width="1"/>
  <text x="120" y="438" fill="#F5F2EC" font-size="11" font-weight="bold">Customers (12,847)</text>
  <text x="120" y="458" fill="#9A968C" font-size="9">Profiles synced</text>
  <text x="120" y="475" fill="#9A968C" font-size="9">Order history tracked</text>
  <text x="120" y="492" fill="#8FA373" font-size="8">✓ Active</text>

  <rect x="100" y="520" width="300" height="50" rx="6" fill="rgba(143,163,115,0.08)" stroke="rgba(143,163,115,0.2)" stroke-width="1"/>
  <circle cx="120" cy="545" r="10" fill="#8FA373"/>
  <text x="116" y="551" fill="#0A0A0C" font-size="11" font-weight="bold">✓</text>
  <text x="145" y="542" fill="#8FA373" font-size="11" font-weight="bold">Connected</text>
  <text x="145" y="558" fill="#9A968C" font-size="9">Real-time webhook sync</text>

  <!-- Sync Flow -->
  <path d="M 420 245 L 660 245" stroke="#FF2D7A" stroke-width="3"/>
  <polygon points="660,245 650,240 650,250" fill="#FF2D7A"/>
  <text x="510" y="235" fill="#FF2D7A" font-size="10">Order received</text>
  <text x="510" y="260" fill="#9A968C" font-size="8">Instant trigger</text>

  <!-- Processing -->
  <rect x="470" y="320" width="180" height="120" rx="6" fill="rgba(255,45,122,0.12)" stroke="rgba(255,45,122,0.3)" stroke-width="2"/>
  <text x="490" y="345" fill="#FF2D7A" font-size="11" font-weight="bold">Processing</text>
  <text x="490" y="367" fill="#F5F2EC" font-size="9">✓ Validate order</text>
  <text x="490" y="384" fill="#F5F2EC" font-size="9">✓ Check inventory</text>
  <text x="490" y="401" fill="#F5F2EC" font-size="9">✓ Create shipment</text>
  <text x="490" y="418" fill="#F5F2EC" font-size="9">✓ Update stock</text>
  <text x="490" y="433" fill="#9A968C" font-size="8">Processing time: 1.2s</text>

  <!-- Warehouse System -->
  <rect x="680" y="140" width="340" height="440" rx="8" fill="rgba(245,242,236,0.02)" stroke="rgba(245,242,236,0.08)" stroke-width="1"/>
  <text x="700" y="170" fill="#F5F2EC" font-size="14" font-weight="bold">Warehouse System</text>

  <!-- Order Created -->
  <rect x="700" y="195" width="300" height="100" rx="6" fill="rgba(143,163,115,0.08)" stroke="rgba(143,163,115,0.2)" stroke-width="1"/>
  <text x="720" y="218" fill="#8FA373" font-size="12" font-weight="bold">Shipment Created</text>
  <text x="720" y="238" fill="#F5F2EC" font-size="10">Order #8472</text>
  <text x="720" y="255" fill="#9A968C" font-size="9">Picking list generated</text>
  <text x="720" y="270" fill="#9A968C" font-size="9">Warehouse: Location A-24</text>
  <rect x="720" y="277" width="80" height="16" rx="3" fill="rgba(143,163,115,0.15)"/>
  <text x="726" y="288" fill="#8FA373" font-size="8" font-family="monospace">READY TO PICK</text>

  <!-- Inventory Updated -->
  <rect x="700" y="310" width="300" height="90" rx="6" fill="rgba(245,242,236,0.04)" stroke="rgba(245,242,236,0.08)" stroke-width="1"/>
  <text x="720" y="333" fill="#F5F2EC" font-size="11" font-weight="bold">Inventory Adjusted</text>
  <text x="720" y="353" fill="#9A968C" font-size="9">Product A: 247 → 244 (-3)</text>
  <text x="720" y="370" fill="#9A968C" font-size="9">Product B: 89 → 88 (-1)</text>
  <text x="720" y="387" fill="#8FA373" font-size="8">✓ Stock levels updated</text>

  <!-- Reverse Sync -->
  <rect x="700" y="415" width="300" height="90" rx="6" fill="rgba(209,168,92,0.08)" stroke="rgba(209,168,92,0.2)" stroke-width="1"/>
  <text x="720" y="438" fill="#D1A85C" font-size="11" font-weight="bold">Sync Back to Shopify</text>
  <text x="720" y="458" fill="#9A968C" font-size="9">Update stock levels</text>
  <text x="720" y="475" fill="#9A968C" font-size="9">Update order status</text>
  <text x="720" y="492" fill="#8FA373" font-size="8">✓ Synced in 0.8s</text>

  <rect x="700" y="520" width="300" height="50" rx="6" fill="rgba(143,163,115,0.08)" stroke="rgba(143,163,115,0.2)" stroke-width="1"/>
  <circle cx="720" cy="545" r="10" fill="#8FA373"/>
  <text x="745" y="548" fill="#8FA373" font-size="11" font-weight="bold">Status: Processing</text>
  <text x="745" y="563" fill="#9A968C" font-size="9">Next: Ship within 24h</text>

  <!-- Reverse arrow -->
  <path d="M 660 460 L 420 460" stroke="#D1A85C" stroke-width="2" stroke-dasharray="6,4"/>
  <polygon points="420,460 427,455 427,465" fill="#D1A85C"/>
  <text x="510" y="478" fill="#D1A85C" font-size="8">Stock update</text>

  <!-- Stats -->
  <rect x="1030" y="140" width="110" height="120" rx="6" fill="rgba(255,45,122,0.08)" stroke="rgba(255,45,122,0.2)" stroke-width="1"/>
  <text x="1045" y="165" fill="#9A968C" font-size="9">Today</text>
  <text x="1045" y="190" fill="#FF2D7A" font-size="20" font-weight="bold">247</text>
  <text x="1045" y="210" fill="#9A968C" font-size="9">orders</text>
  <text x="1045" y="230" fill="#8FA373" font-size="9">↑ +24%</text>
  <text x="1045" y="248" fill="#9A968C" font-size="8">vs yesterday</text>

  <rect x="1030" y="275" width="110" height="100" rx="6" fill="rgba(143,163,115,0.08)" stroke="rgba(143,163,115,0.2)" stroke-width="1"/>
  <text x="1045" y="300" fill="#9A968C" font-size="9">Sync</text>
  <text x="1045" y="325" fill="#8FA373" font-size="18" font-weight="bold">&lt; 2s</text>
  <text x="1045" y="345" fill="#9A968C" font-size="9">avg time</text>
  <text x="1045" y="363" fill="#8FA373" font-size="8">Fast</text>

  <rect x="40" y="625" width="1120" height="35" rx="6" fill="rgba(255,45,122,0.06)" stroke="rgba(255,45,122,0.2)" stroke-width="1"/>
  <text x="60" y="647" fill="#9A968C" font-size="11">Integration Features:</text>
  <text x="240" y="647" fill="#F5F2EC" font-size="11">Webhook Triggers</text>
  <text x="430" y="647" fill="#F5F2EC" font-size="11">Inventory Sync</text>
  <text x="610" y="647" fill="#F5F2EC" font-size="11">Order Management</text>
  <text x="830" y="647" fill="#F5F2EC" font-size="11">Real-time Updates</text>
</svg>
