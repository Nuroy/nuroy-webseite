<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <style>
      /* Modules: dim by default, animate to bright */
      .module-bg {
        fill: #0d0d0d;
        stroke: rgba(255, 45, 135, 0.25);
        stroke-width: 1.5;
      }
      .module-fill {
        fill: rgba(255, 45, 135, 0.12);
        stroke: #ff2d87;
        stroke-width: 1.5;
        opacity: 0;
        filter: drop-shadow(0 0 8px rgba(255, 45, 135, 0.5));
      }

      /* Connection lines: dim base, animated bright trace */
      .conn-base {
        fill: none;
        stroke: rgba(255, 45, 135, 0.15);
        stroke-width: 1.5;
        stroke-dasharray: 4 4;
      }
      .conn-trace {
        fill: none;
        stroke: #ff2d87;
        stroke-width: 2;
        stroke-linecap: round;
        filter: drop-shadow(0 0 4px rgba(255, 45, 135, 0.8));
        opacity: 0;
      }

      /* Sequential "build" animation — modules light up one after another, looping */
      .m1 .module-fill { animation: activate 8s ease-in-out infinite; animation-delay: 0.0s; }
      .m2 .module-fill { animation: activate 8s ease-in-out infinite; animation-delay: 0.5s; }
      .m3 .module-fill { animation: activate 8s ease-in-out infinite; animation-delay: 1.0s; }
      .m4 .module-fill { animation: activate 8s ease-in-out infinite; animation-delay: 1.5s; }
      .m5 .module-fill { animation: activate 8s ease-in-out infinite; animation-delay: 2.0s; }
      .m6 .module-fill { animation: activate 8s ease-in-out infinite; animation-delay: 2.5s; }
      .m7 .module-fill { animation: activate 8s ease-in-out infinite; animation-delay: 3.0s; }
      .m8 .module-fill { animation: activate 8s ease-in-out infinite; animation-delay: 3.5s; }

      .c1 { animation: connect 8s ease-in-out infinite; animation-delay: 0.3s; }
      .c2 { animation: connect 8s ease-in-out infinite; animation-delay: 0.8s; }
      .c3 { animation: connect 8s ease-in-out infinite; animation-delay: 1.3s; }
      .c4 { animation: connect 8s ease-in-out infinite; animation-delay: 1.8s; }
      .c5 { animation: connect 8s ease-in-out infinite; animation-delay: 2.3s; }
      .c6 { animation: connect 8s ease-in-out infinite; animation-delay: 2.8s; }
      .c7 { animation: connect 8s ease-in-out infinite; animation-delay: 3.3s; }
      .c8 { animation: connect 8s ease-in-out infinite; animation-delay: 3.8s; }

      @keyframes activate {
        0%   { opacity: 0; }
        8%   { opacity: 1; }
        50%  { opacity: 1; }
        58%  { opacity: 0.3; }
        100% { opacity: 0.3; }
      }

      @keyframes connect {
        0%   { opacity: 0; stroke-dashoffset: 100; stroke-dasharray: 100 100; }
        10%  { opacity: 1; stroke-dashoffset: 0;   stroke-dasharray: 100 0; }
        50%  { opacity: 1; }
        60%  { opacity: 0.2; }
        100% { opacity: 0.2; }
      }
    </style>
  </defs>

  <!-- ============ CONNECTION LINES (dim base + animated bright) ============
       Lines go from each module toward the center label area -->

  <!-- Top row connections -->
  <line x1="230" y1="195" x2="700" y2="420" class="conn-base" />
  <line x1="230" y1="195" x2="700" y2="420" class="conn-trace c1" />

  <line x1="630" y1="155" x2="760" y2="400" class="conn-base" />
  <line x1="630" y1="155" x2="760" y2="400" class="conn-trace c2" />

  <line x1="1050" y1="155" x2="900" y2="400" class="conn-base" />
  <line x1="1050" y1="155" x2="900" y2="400" class="conn-trace c3" />

  <line x1="1450" y1="195" x2="940" y2="420" class="conn-base" />
  <line x1="1450" y1="195" x2="940" y2="420" class="conn-trace c4" />

  <!-- Bottom row connections -->
  <line x1="230" y1="705" x2="700" y2="500" class="conn-base" />
  <line x1="230" y1="705" x2="700" y2="500" class="conn-trace c5" />

  <line x1="630" y1="745" x2="760" y2="520" class="conn-base" />
  <line x1="630" y1="745" x2="760" y2="520" class="conn-trace c6" />

  <line x1="1050" y1="745" x2="900" y2="520" class="conn-base" />
  <line x1="1050" y1="745" x2="900" y2="520" class="conn-trace c7" />

  <line x1="1450" y1="705" x2="940" y2="500" class="conn-base" />
  <line x1="1450" y1="705" x2="940" y2="500" class="conn-trace c8" />

  <!-- ============ MODULES — rounded rectangles in a loose grid around center ============ -->

  <!-- m1: top-left -->
  <g class="m1">
    <rect x="130"  y="155" width="200" height="80" rx="8" class="module-bg" />
    <rect x="130"  y="155" width="200" height="80" rx="8" class="module-fill" />
  </g>

  <!-- m2: top-mid-left -->
  <g class="m2">
    <rect x="500"  y="115" width="260" height="80" rx="8" class="module-bg" />
    <rect x="500"  y="115" width="260" height="80" rx="8" class="module-fill" />
  </g>

  <!-- m3: top-mid-right -->
  <g class="m3">
    <rect x="920"  y="115" width="260" height="80" rx="8" class="module-bg" />
    <rect x="920"  y="115" width="260" height="80" rx="8" class="module-fill" />
  </g>

  <!-- m4: top-right -->
  <g class="m4">
    <rect x="1350" y="155" width="200" height="80" rx="8" class="module-bg" />
    <rect x="1350" y="155" width="200" height="80" rx="8" class="module-fill" />
  </g>

  <!-- m5: bottom-left -->
  <g class="m5">
    <rect x="130"  y="665" width="200" height="80" rx="8" class="module-bg" />
    <rect x="130"  y="665" width="200" height="80" rx="8" class="module-fill" />
  </g>

  <!-- m6: bottom-mid-left -->
  <g class="m6">
    <rect x="500"  y="705" width="260" height="80" rx="8" class="module-bg" />
    <rect x="500"  y="705" width="260" height="80" rx="8" class="module-fill" />
  </g>

  <!-- m7: bottom-mid-right -->
  <g class="m7">
    <rect x="920"  y="705" width="260" height="80" rx="8" class="module-bg" />
    <rect x="920"  y="705" width="260" height="80" rx="8" class="module-fill" />
  </g>

  <!-- m8: bottom-right -->
  <g class="m8">
    <rect x="1350" y="665" width="200" height="80" rx="8" class="module-bg" />
    <rect x="1350" y="665" width="200" height="80" rx="8" class="module-fill" />
  </g>

  <!-- Center label -->
  <g>
    <rect x="640" y="400" width="320" height="100" rx="10" fill="#1a1a1a" stroke="#ff2d87" stroke-width="1.5" filter="drop-shadow(0 0 20px rgba(255, 45, 135, 0.4))">
      <animate attributeName="opacity" values="1;0.85;1" dur="3s" repeatCount="indefinite"/>
    </rect>
    <text x="800" y="460" text-anchor="middle" fill="#f5f1e8" font-family="Arial, sans-serif" font-size="32" font-weight="500" letter-spacing="-0.01em">
      Custom Software
    </text>
  </g>

</svg>
