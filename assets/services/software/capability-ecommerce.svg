  <rect x="780" y="580" width="340" height="100" rx="12" fill="#0d0d0d" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>

  <rect x="800" y="600" width="300" height="45" rx="6" fill="rgba(255, 45, 135, 0.2)" stroke="rgba(255, 45, 135, 0.4)" stroke-width="2"/>
  <text x="950" y="628" font-family="sans-serif" font-size="14" fill="#ff2d87" text-anchor="middle" font-weight="700">Jetzt kaufen • €1.472</text>

