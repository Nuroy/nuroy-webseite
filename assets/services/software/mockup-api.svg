<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0A0C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#121216;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#grad1)"/>

  <!-- Title Badge -->
  <text x="40" y="35" fill="#FF2D7A" font-size="12" font-family="monospace" letter-spacing="2">API DOCUMENTATION INTERFACE</text>

  <!-- Sidebar -->
  <rect x="40" y="70" width="260" height="540" rx="8" fill="#1C1C22" stroke="rgba(245,242,236,0.08)" stroke-width="1"/>

  <!-- Logo -->
  <text x="70" y="105" fill="#FF2D7A" font-size="16" font-weight="bold">API Docs</text>
  <text x="70" y="122" fill="#9A968C" font-size="10">v2.1.0</text>

  <!-- Search -->
  <rect x="60" y="140" width="220" height="32" rx="6" fill="rgba(245,242,236,0.06)"/>
  <text x="75" y="162" fill="#9A968C" font-size="10">🔍 Suche...</text>

  <!-- Navigation -->
  <text x="70" y="200" fill="#5E5A52" font-size="10" font-family="monospace">GETTING STARTED</text>
  <text x="70" y="225" fill="#9A968C" font-size="11">Introduction</text>
  <text x="70" y="245" fill="#9A968C" font-size="11">Authentication</text>
  <text x="70" y="265" fill="#9A968C" font-size="11">Rate Limits</text>

  <text x="70" y="300" fill="#5E5A52" font-size="10" font-family="monospace">ENDPOINTS</text>
  <text x="70" y="325" fill="#FF2D7A" font-size="11" font-weight="bold">Users</text>
  <text x="90" y="345" fill="#FF2D7A" font-size="10">GET /users</text>
  <text x="90" y="363" fill="#9A968C" font-size="10">POST /users</text>
  <text x="90" y="381" fill="#9A968C" font-size="10">GET /users/:id</text>
  <text x="90" y="399" fill="#9A968C" font-size="10">PUT /users/:id</text>

  <text x="70" y="425" fill="#9A968C" font-size="11">Products</text>
  <text x="70" y="445" fill="#9A968C" font-size="11">Orders</text>
  <text x="70" y="465" fill="#9A968C" font-size="11">Webhooks</text>

  <text x="70" y="500" fill="#5E5A52" font-size="10" font-family="monospace">RESOURCES</text>
  <text x="70" y="525" fill="#9A968C" font-size="11">Code Examples</text>
  <text x="70" y="545" fill="#9A968C" font-size="11">Changelog</text>
  <text x="70" y="565" fill="#9A968C" font-size="11">Support</text>

  <!-- Main Content -->
  <rect x="320" y="70" width="840" height="540" rx="8" fill="#1C1C22" stroke="rgba(245,242,236,0.08)" stroke-width="1"/>

  <!-- Header -->
  <text x="350" y="110" fill="#F5F2EC" font-size="18" font-weight="bold">GET /api/v2/users</text>
  <text x="350" y="135" fill="#9A968C" font-size="12">Retrieve a list of users from your organization</text>

  <!-- Method Badge -->
  <rect x="650" y="95" width="50" height="22" rx="4" fill="rgba(143,163,115,0.12)"/>
  <text x="660" y="110" fill="#8FA373" font-size="10" font-family="monospace">GET</text>

  <!-- Endpoint -->
  <rect x="350" y="160" width="780" height="50" rx="6" fill="rgba(245,242,236,0.04)" stroke="rgba(245,242,236,0.08)" stroke-width="1"/>
  <text x="370" y="190" fill="#FF2D7A" font-size="12" font-family="monospace">https://api.yourcompany.com/v2/users</text>

  <!-- Parameters -->
  <text x="350" y="240" fill="#F5F2EC" font-size="14" font-weight="bold">Parameters</text>

  <rect x="350" y="255" width="780" height="100" rx="6" fill="rgba(245,242,236,0.02)" stroke="rgba(245,242,236,0.08)" stroke-width="1"/>

  <!-- Table Header -->
  <text x="370" y="280" fill="#5E5A52" font-size="10" font-family="monospace">NAME</text>
  <text x="520" y="280" fill="#5E5A52" font-size="10" font-family="monospace">TYPE</text>
  <text x="650" y="280" fill="#5E5A52" font-size="10" font-family="monospace">REQUIRED</text>
  <text x="800" y="280" fill="#5E5A52" font-size="10" font-family="monospace">DESCRIPTION</text>

  <!-- Params -->
  <text x="370" y="305" fill="#FF2D7A" font-size="10" font-family="monospace">page</text>
  <text x="520" y="305" fill="#9A968C" font-size="10">integer</text>
  <text x="650" y="305" fill="#9A968C" font-size="10">No</text>
  <text x="800" y="305" fill="#9A968C" font-size="10">Page number (default: 1)</text>

  <text x="370" y="330" fill="#FF2D7A" font-size="10" font-family="monospace">limit</text>
  <text x="520" y="330" fill="#9A968C" font-size="10">integer</text>
  <text x="650" y="330" fill="#9A968C" font-size="10">No</text>
  <text x="800" y="330" fill="#9A968C" font-size="10">Results per page (max: 100)</text>

  <!-- Response -->
  <text x="350" y="385" fill="#F5F2EC" font-size="14" font-weight="bold">Response</text>
  <rect x="1020" y="367" width="100" height="24" rx="4" fill="rgba(143,163,115,0.12)"/>
  <text x="1040" y="384" fill="#8FA373" font-size="10" font-family="monospace">200 OK</text>

  <!-- Code Block -->
  <rect x="350" y="400" width="780" height="190" rx="6" fill="#0A0A0C" stroke="rgba(245,242,236,0.08)" stroke-width="1"/>

  <text x="370" y="425" fill="#9A968C" font-size="10" font-family="monospace">{</text>
  <text x="390" y="445" fill="#D1A85C" font-size="10" font-family="monospace">"status"</text>
  <text x="470" y="445" fill="#9A968C" font-size="10" font-family="monospace">:</text>
  <text x="490" y="445" fill="#8FA373" font-size="10" font-family="monospace">"success"</text>
  <text x="570" y="445" fill="#9A968C" font-size="10" font-family="monospace">,</text>

  <text x="390" y="465" fill="#D1A85C" font-size="10" font-family="monospace">"data"</text>
  <text x="440" y="465" fill="#9A968C" font-size="10" font-family="monospace">: [</text>

  <text x="410" y="485" fill="#9A968C" font-size="10" font-family="monospace">{</text>
  <text x="430" y="505" fill="#D1A85C" font-size="10" font-family="monospace">"id"</text>
  <text x="470" y="505" fill="#9A968C" font-size="10" font-family="monospace">:</text>
  <text x="490" y="505" fill="#FF2D7A" font-size="10" font-family="monospace">1</text>
  <text x="510" y="505" fill="#9A968C" font-size="10" font-family="monospace">,</text>

  <text x="430" y="525" fill="#D1A85C" font-size="10" font-family="monospace">"name"</text>
  <text x="485" y="525" fill="#9A968C" font-size="10" font-family="monospace">:</text>
  <text x="505" y="525" fill="#8FA373" font-size="10" font-family="monospace">"Anna Schmidt"</text>
  <text x="620" y="525" fill="#9A968C" font-size="10" font-family="monospace">,</text>

  <text x="430" y="545" fill="#D1A85C" font-size="10" font-family="monospace">"email"</text>
  <text x="490" y="545" fill="#9A968C" font-size="10" font-family="monospace">:</text>
  <text x="510" y="545" fill="#8FA373" font-size="10" font-family="monospace">"anna@company.com"</text>

  <text x="410" y="565" fill="#9A968C" font-size="10" font-family="monospace">}</text>
  <text x="390" y="580" fill="#9A968C" font-size="10" font-family="monospace">]</text>
  <text x="370" y="580" fill="#9A968C" font-size="10" font-family="monospace">}</text>

  <!-- Code Examples -->
  <rect x="40" y="625" width="1120" height="35" rx="6" fill="rgba(255,45,122,0.06)" stroke="rgba(255,45,122,0.2)" stroke-width="1"/>
  <text x="60" y="647" fill="#9A968C" font-size="11">API Features:</text>
  <text x="210" y="647" fill="#F5F2EC" font-size="11">RESTful Endpoints</text>
  <text x="400" y="647" fill="#F5F2EC" font-size="11">Code Examples</text>
  <text x="590" y="647" fill="#F5F2EC" font-size="11">Interactive Testing</text>
  <text x="800" y="647" fill="#F5F2EC" font-size="11">Authentication Guides</text>
</svg>
