<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#0d0d0d"/>

  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="20" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="40" y="40" width="1120" height="720" rx="18" fill="#1a1a1a" stroke="rgba(255, 45, 135, 0.3)" stroke-width="1" filter="url(#glow)"/>

  <text x="80" y="90" font-family="monospace" font-size="10" fill="#ff2d87" letter-spacing="0.08em">REST API DOCUMENTATION</text>

  <rect x="80" y="120" width="680" height="560" rx="12" fill="#0d0d0d" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>

  <!-- API Endpoint -->
  <text x="100" y="150" font-family="sans-serif" font-size="14" fill="#f5f1e8" font-weight="600">GET /api/v1/users</text>

  <rect x="280" y="135" width="60" height="22" rx="6" fill="rgba(184, 209, 138, 0.2)"/>
  <text x="310" y="151" font-family="monospace" font-size="10" fill="#b8d18a" text-anchor="middle" font-weight="700">GET</text>

  <rect x="350" y="135" width="120" height="22" rx="6" fill="rgba(255, 45, 135, 0.15)"/>
  <text x="410" y="151" font-family="monospace" font-size="10" fill="#ff2d87" text-anchor="middle" font-weight="700">AUTH REQUIRED</text>

  <!-- Description -->
  <text x="100" y="182" font-family="sans-serif" font-size="12" fill="rgba(245, 241, 232, 0.7)">Ruft eine Liste aller Benutzer ab. Unterstützt Pagination und Filtering.</text>

  <!-- Request Parameters -->
  <text x="100" y="215" font-family="sans-serif" font-size="13" fill="#f5f1e8" font-weight="600">Request Parameters</text>

  <rect x="100" y="225" width="640" height="90" rx="8" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>

  <!-- Param 1 -->
  <text x="120" y="250" font-family="monospace" font-size="11" fill="#ff2d87">page</text>
  <rect x="200" y="237" width="60" height="18" rx="4" fill="rgba(245, 193, 78, 0.15)"/>
  <text x="230" y="250" font-family="monospace" font-size="9" fill="#f5c14e" text-anchor="middle">integer</text>
  <text x="280" y="250" font-family="sans-serif" font-size="11" fill="rgba(245, 241, 232, 0.6)">Seiten-Nummer (default: 1)</text>

  <!-- Param 2 -->
  <text x="120" y="275" font-family="monospace" font-size="11" fill="#ff2d87">limit</text>
  <rect x="200" y="262" width="60" height="18" rx="4" fill="rgba(245, 193, 78, 0.15)"/>
  <text x="230" y="275" font-family="monospace" font-size="9" fill="#f5c14e" text-anchor="middle">integer</text>
  <text x="280" y="275" font-family="sans-serif" font-size="11" fill="rgba(245, 241, 232, 0.6)">Items pro Seite (max: 100, default: 20)</text>

  <!-- Param 3 -->
  <text x="120" y="300" font-family="monospace" font-size="11" fill="#ff2d87">role</text>
  <rect x="200" y="287" width="60" height="18" rx="4" fill="rgba(184, 209, 138, 0.15)"/>
  <text x="230" y="300" font-family="monospace" font-size="9" fill="#b8d18a" text-anchor="middle">string</text>
  <text x="280" y="300" font-family="sans-serif" font-size="11" fill="rgba(245, 241, 232, 0.6)">Filter nach Rolle (admin, user, guest)</text>

  <!-- Example Request -->
  <text x="100" y="340" font-family="sans-serif" font-size="13" fill="#f5f1e8" font-weight="600">Example Request</text>

  <rect x="100" y="350" width="640" height="80" rx="8" fill="rgba(0, 0, 0, 0.5)"/>
  <text x="120" y="372" font-family="monospace" font-size="11" fill="#b8d18a">curl</text>
  <text x="160" y="372" font-family="monospace" font-size="11" fill="rgba(245, 241, 232, 0.7)">-X</text>
  <text x="190" y="372" font-family="monospace" font-size="11" fill="#f5c14e">GET</text>
  <text x="120" y="392" font-family="monospace" font-size="11" fill="rgba(245, 241, 232, 0.7)">  "https://api.example.com/v1/users?page=1&amp;limit=10"</text>
  <text x="120" y="412" font-family="monospace" font-size="11" fill="rgba(245, 241, 232, 0.7)">  -H</text>
  <text x="160" y="412" font-family="monospace" font-size="11" fill="#ff2d87">"Authorization: Bearer YOUR_TOKEN"</text>

  <!-- Example Response -->
  <text x="100" y="455" font-family="sans-serif" font-size="13" fill="#f5f1e8" font-weight="600">Example Response</text>

  <rect x="550" y="442" width="70" height="20" rx="6" fill="rgba(184, 209, 138, 0.2)"/>
  <text x="585" y="457" font-family="monospace" font-size="10" fill="#b8d18a" text-anchor="middle" font-weight="700">200 OK</text>

  <rect x="100" y="465" width="640" height="200" rx="8" fill="rgba(0, 0, 0, 0.5)"/>
  <text x="120" y="485" font-family="monospace" font-size="11" fill="rgba(245, 241, 232, 0.5)">{</text>
  <text x="140" y="505" font-family="monospace" font-size="11" fill="#ff2d87">"data"</text>
  <text x="195" y="505" font-family="monospace" font-size="11" fill="rgba(245, 241, 232, 0.5)">: [</text>

  <text x="160" y="525" font-family="monospace" font-size="11" fill="rgba(245, 241, 232, 0.5)">{</text>
  <text x="180" y="545" font-family="monospace" font-size="11" fill="#b8d18a">"id"</text>
  <text x="220" y="545" font-family="monospace" font-size="11" fill="rgba(245, 241, 232, 0.5)">:</text>
  <text x="235" y="545" font-family="monospace" font-size="11" fill="#f5c14e">1</text>
  <text x="245" y="545" font-family="monospace" font-size="11" fill="rgba(245, 241, 232, 0.5)">,</text>

  <text x="180" y="565" font-family="monospace" font-size="11" fill="#b8d18a">"name"</text>
  <text x="235" y="565" font-family="monospace" font-size="11" fill="rgba(245, 241, 232, 0.5)">:</text>
  <text x="250" y="565" font-family="monospace" font-size="11" fill="#f5c14e">"Julia Decker"</text>
  <text x="380" y="565" font-family="monospace" font-size="11" fill="rgba(245, 241, 232, 0.5)">,</text>

  <text x="180" y="585" font-family="monospace" font-size="11" fill="#b8d18a">"email"</text>
  <text x="235" y="585" font-family="monospace" font-size="11" fill="rgba(245, 241, 232, 0.5)">:</text>
  <text x="250" y="585" font-family="monospace" font-size="11" fill="#f5c14e">"julia@example.com"</text>

  <text x="160" y="605" font-family="monospace" font-size="11" fill="rgba(245, 241, 232, 0.5)">}</text>
  <text x="140" y="625" font-family="monospace" font-size="11" fill="rgba(245, 241, 232, 0.5)">],</text>
  <text x="140" y="645" font-family="monospace" font-size="11" fill="#ff2d87">"meta"</text>
  <text x="190" y="645" font-family="monospace" font-size="11" fill="rgba(245, 241, 232, 0.5)">: {</text>
  <text x="220" y="645" font-family="monospace" font-size="11" fill="#b8d18a">"total"</text>
  <text x="280" y="645" font-family="monospace" font-size="11" fill="rgba(245, 241, 232, 0.5)">:</text>
  <text x="295" y="645" font-family="monospace" font-size="11" fill="#f5c14e">1247</text>
  <text x="330" y="645" font-family="monospace" font-size="11" fill="rgba(245, 241, 232, 0.5)">}</text>
  <text x="120" y="665" font-family="monospace" font-size="11" fill="rgba(245, 241, 232, 0.5)">}</text>

  <!-- Right Column -->
  <rect x="780" y="120" width="340" height="200" rx="12" fill="#0d0d0d" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
  <text x="800" y="145" font-family="monospace" font-size="9" fill="rgba(245, 241, 232, 0.5)">API ENDPOINTS</text>

  <rect x="800" y="160" width="300" height="35" rx="6" fill="rgba(184, 209, 138, 0.08)"/>
  <rect x="815" y="172" width="40" height="12" rx="3" fill="rgba(184, 209, 138, 0.3)"/>
  <text x="835" y="180" font-family="monospace" font-size="8" fill="#b8d18a" text-anchor="middle" font-weight="700">GET</text>
  <text x="865" y="181" font-family="monospace" font-size="10" fill="#f5f1e8">/api/v1/users</text>

  <rect x="800" y="205" width="300" height="35" rx="6" fill="rgba(255, 45, 135, 0.08)"/>
  <rect x="815" y="217" width="40" height="12" rx="3" fill="rgba(255, 45, 135, 0.3)"/>
  <text x="835" y="225" font-family="monospace" font-size="8" fill="#ff2d87" text-anchor="middle" font-weight="700">POST</text>
  <text x="865" y="226" font-family="monospace" font-size="10" fill="#f5f1e8">/api/v1/users</text>

  <rect x="800" y="250" width="300" height="35" rx="6" fill="rgba(245, 193, 78, 0.08)"/>
  <rect x="815" y="262" width="40" height="12" rx="3" fill="rgba(245, 193, 78, 0.3)"/>
  <text x="835" y="270" font-family="monospace" font-size="8" fill="#f5c14e" text-anchor="middle" font-weight="700">PUT</text>
  <text x="865" y="271" font-family="monospace" font-size="10" fill="#f5f1e8">/api/v1/users/:id</text>

  <rect x="800" y="295" width="300" height="35" rx="6" fill="rgba(255, 255, 255, 0.03)"/>
  <rect x="815" y="307" width="50" height="12" rx="3" fill="rgba(255, 255, 255, 0.1)"/>
  <text x="840" y="315" font-family="monospace" font-size="8" fill="rgba(245, 241, 232, 0.7)" text-anchor="middle" font-weight="700">DELETE</text>
  <text x="875" y="316" font-family="monospace" font-size="10" fill="#f5f1e8">/api/v1/users/:id</text>

  <rect x="780" y="340" width="340" height="180" rx="12" fill="#0d0d0d" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
  <text x="800" y="365" font-family="monospace" font-size="9" fill="rgba(245, 241, 232, 0.5)">RESPONSE CODES</text>

  <text x="800" y="395" font-family="monospace" font-size="10" fill="rgba(245, 241, 232, 0.5)">200 OK</text>
  <text x="900" y="395" font-family="sans-serif" font-size="11" fill="#b8d18a">Erfolg</text>

  <text x="800" y="425" font-family="monospace" font-size="10" fill="rgba(245, 241, 232, 0.5)">201 Created</text>
  <text x="900" y="425" font-family="sans-serif" font-size="11" fill="#b8d18a">Erstellt</text>

  <text x="800" y="455" font-family="monospace" font-size="10" fill="rgba(245, 241, 232, 0.5)">400 Bad Request</text>
  <text x="920" y="455" font-family="sans-serif" font-size="11" fill="#ff2d87">Fehlerhafte Anfrage</text>

  <text x="800" y="485" font-family="monospace" font-size="10" fill="rgba(245, 241, 232, 0.5)">401 Unauthorized</text>
  <text x="920" y="485" font-family="sans-serif" font-size="11" fill="#ff2d87">Nicht authentifiziert</text>

  <rect x="780" y="540" width="340" height="140" rx="12" fill="#0d0d0d" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
  <text x="800" y="565" font-family="monospace" font-size="9" fill="rgba(245, 241, 232, 0.5)">RATE LIMITING</text>

  <text x="800" y="595" font-family="monospace" font-size="10" fill="rgba(245, 241, 232, 0.5)">Requests/Minute</text>
  <text x="1100" y="595" font-family="monospace" font-size="14" fill="#ff2d87" text-anchor="end" font-weight="700">60</text>

  <text x="800" y="625" font-family="monospace" font-size="10" fill="rgba(245, 241, 232, 0.5)">Requests/Hour</text>
  <text x="1100" y="625" font-family="monospace" font-size="14" fill="#b8d18a" text-anchor="end" font-weight="700">1,000</text>

  <text x="800" y="655" font-family="monospace" font-size="10" fill="rgba(245, 241, 232, 0.5)">Burst Limit</text>
  <text x="1100" y="655" font-family="monospace" font-size="14" fill="#f5c14e" text-anchor="end" font-weight="700">100</text>

  <rect x="80" y="700" width="340" height="50" rx="8" fill="rgba(184, 209, 138, 0.1)" stroke="rgba(184, 209, 138, 0.3)" stroke-width="1"/>
  <text x="100" y="730" font-family="sans-serif" font-size="12" fill="#b8d18a">✓ RESTful API mit vollständiger Doku</text>

  <rect x="440" y="700" width="340" height="50" rx="8" fill="rgba(255, 45, 135, 0.1)" stroke="rgba(255, 45, 135, 0.3)" stroke-width="1"/>
  <text x="460" y="730" font-family="sans-serif" font-size="12" fill="#ff2d87">🔒 OAuth 2.0 &amp; JWT Authentication</text>

  <rect x="800" y="700" width="320" height="50" rx="8" fill="rgba(245, 193, 78, 0.1)" stroke="rgba(245, 193, 78, 0.3)" stroke-width="1"/>
  <text x="820" y="730" font-family="sans-serif" font-size="12" fill="#f5c14e">⚡ Rate Limiting: 1,000 req/hour</text>

  <text x="80" y="785" font-family="monospace" font-size="10" fill="rgba(245, 241, 232, 0.5)">Features:</text>
  <text x="145" y="785" font-family="monospace" font-size="10" fill="rgba(245, 241, 232, 0.7)">REST API · OpenAPI/Swagger · OAuth 2.0 · Rate Limiting · Webhooks · SDK Generation</text>
</svg>
