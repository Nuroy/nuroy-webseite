" fill="rgba(255, 255, 255, 0.03)" rx="6"/><rect width="50" height="12" x="815" y="307" fill="rgba(255, 255, 255, 0.1)" rx="3"/><text x="840" y="315" fill="rgba(245, 241, 232, 0.7)" font-family="monospace" font-size="8" font-weight="700" text-anchor="middle">DELETE</text><text x="875" y="316" fill="#f5f1e8" font-family="monospace" font-size="10">/api/v1/users/:id</text><rect width="340" height="180" x="780" y="340" fill="#0d0d0d" stroke="rgba(255, 255, 255, 0.06)" rx="12"/><text x="800" y="365" fill="rgba(245, 241, 232, 0.5)" font-family="monospace" font-size="9">RESPONSE CODES</text><text x="800" y="395" fill="rgba(245, 241, 232, 0.5)" font-family="monospace" font-size="10">200 OK</text><text x="900" y="395" fill="#b8d18a" font-family="sans-serif" font-size="11">Erfolg</text><text x="800" y="425" fill="rgba(245, 241, 232, 0.5)" font-family="monospace" font-size="10">201 Created</text><text x="900" y="425" fill="#b8d18a" font-family="sans-serif" font-size="11">Erstellt</text><text x="800" y="455" fill="rgba(245, 241, 232, 0.5)" font-family="monospace" font-size="10">400 Bad Request</text><text x="920" y="455" fill="#ff2d87" font-family="sans-serif" font-size="11">Fehlerhafte Anfrage</text><text x="800" y="485" fill="rgba(245, 241, 232, 0.5)" font-family="monospace" font-size="10">401 Unauthorized</text><text x="920" y="485" fill="#ff2d87" font-family="sans-serif" font-size="11">Nicht authentifiziert</text><rect width="340" height="140" x="780" y="540" fill="#0d0d0d" stroke="rgba(255, 255, 255, 0.06)" rx="12"/><text x="800" y="565" fill="rgba(245, 241, 232, 0.5)" font-family="monospace" font-size="9">RATE LIMITING</text><text x="800" y="595" fill="rgba(245, 241, 232, 0.5)" font-family="monospace" font-size="10">Requests/Minute</text><text x="1100" y="595" fill="#ff2d87" font-family="monospace" font-size="14" font-weight="700" text-anchor="end">60</text><text x="800" y="625" fill="rgba(245, 241, 232, 0.5)" font-family="monospace" font-size="10">Requests/Hour</text><text x="1100" y="625" fill="#b8d18a" font-family="monospace" font-size="14" font-weight="700" text-anchor="end">1,000</text><text x="800" y="655" fill="rgba(245, 241, 232, 0.5)" font-family="monospace" font-size="10">Burst Limit</text><text x="1100" y="655" fill="#f5c14e" font-family="monospace" font-size="14" font-weight="700" text-anchor="end">100</text><rect width="340" height="50" x="80" y="700" fill="rgba(184, 209, 138, 0.1)" stroke="rgba(184, 209, 138, 0.3)" rx="8"/><text x="100" y="730" fill="#b8d18a" font-family="sans-serif" font-size="12">✓ RESTful API mit vollständiger Doku</text><rect width="340" height="50" x="440" y="700" fill="rgba(255, 45, 135, 0.1)" stroke="rgba(255, 45, 135, 0.3)" rx="8"/><text x="460" y="730" fill="#ff2d87" font-family="sans-serif" font-size="12">🔒 OAuth 2.0 &amp; JWT Authentication</text><rect width="320" height="50" x="800" y="700" fill="rgba(245, 193, 78, 0.1)" stroke="rgba(245, 193, 78, 0.3)" rx="8"/><text x="820" y="730" fill="#f5c14e" font-family="sans-serif" font-size="12">⚡ Rate Limiting: 1,000 req/hour</text><text x="80" y="785" fill="rgba(245, 241, 232, 0.5)" font-family="monospace" font-size="10">Features:</text><text x="145" y="785" fill="rgba(245, 241, 232, 0.7)" font-family="monospace" font-size="10">REST API · OpenAPI/Swagger · OAuth 2.0 · Rate Limiting · Webhooks · SDK Generation</text></svg>