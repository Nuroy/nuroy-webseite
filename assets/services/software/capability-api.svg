<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><path fill="#0d0d0d" d="M0 0h1200v800H0z"/><defs><filter id="a"><feGaussianBlur result="coloredBlur" stdDeviation="20"/><feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1120" height="720" x="40" y="40" fill="#1a1a1a" stroke="rgba(255, 45, 135, 0.3)" filter="url(#a)" rx="18"/><text x="80" y="90" fill="#ff2d87" font-family="monospace" font-size="10" letter-spacing=".08em">REST API DOCUMENTATION</text><rect width="680" height="560" x="80" y="120" fill="#0d0d0d" stroke="rgba(255, 255, 255, 0.06)" rx="12"/><text x="100" y="150" fill="#f5f1e8" font-family="sans-serif" font-size="14" font-weight="600">GET /api/v1/users</text><rect width="60" height="22" x="280" y="135" fill="rgba(184, 209, 138, 0.2)" rx="6"/><text x="310" y="151" fill="#b8d18a" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">GET</text><rect width="120" height="22" x="350" y="135" fill="rgba(255, 45, 135, 0.15)" rx="6"/><text x="410" y="151" fill="#ff2d87" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">AUTH REQUIRED</text><text x="100" y="182" fill="rgba(245, 241, 232, 0.7)" font-family="sans-serif" font-size="12">Ruft eine Liste aller Benutzer ab. Unterstützt Pagination und Filtering.</text><text x="100" y="215" fill="#f5f1e8" font-family="sans-serif" font-size="13" font-weight="600">Request Parameters</text><rect width="640" height="90" x="100" y="225" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(255, 255, 255, 0.06)" rx="8"/><text x="120" y="250" fill="#ff2d87" font-family="monospace" font-size="11">page</text><rect width="60" height="18" x="200" y="237" fill="rgba(245, 193, 78, 0.15)" rx="4"/><text x="230" y="250" fill="#f5c14e" font-family="monospace" font-size="9" text-anchor="middle">integer</text><text x="280" y="250" fill="rgba(245, 241, 232, 0.6)" font-family="sans-serif" font-size="11">Seiten-Nummer (default: 1)</text><text x="120" y="275" fill="#ff2d87" font-family="monospace" font-size="11">limit</text><rect width="60" height="18" x="200" y="262" fill="rgba(245, 193, 78, 0.15)" rx="4"/><text x="230" y="275" fill="#f5c14e" font-family="monospace" font-size="9" text-anchor="middle">integer</text><text x="280" y="275" fill="rgba(245, 241, 232, 0.6)" font-family="sans-serif" font-size="11">Items pro Seite (max: 100, default: 20)</text><text x="120" y="300" fill="#ff2d87" font-family="monospace" font-size="11">role</text><rect width="60" height="18" x="200" y="287" fill="rgba(184, 209, 138, 0.15)" rx="4"/><text x="230" y="300" fill="#b8d18a" font-family="monospace" font-size="9" text-anchor="middle">string</text><text x="280" y="300" fill="rgba(245, 241, 232, 0.6)" font-family="sans-serif" font-size="11">Filter nach Rolle (admin, user, guest)</text><text x="100" y="340" fill="#f5f1e8" font-family="sans-serif" font-size="13" font-weight="600">Example Request</text><rect width="640" height="80" x="100" y="350" fill="rgba(0, 0, 0, 0.5)" rx="8"/><text x="120" y="372" fill="#b8d18a" font-family="monospace" font-size="11">curl</text><text x="160" y="372" fill="rgba(245, 241, 232, 0.7)" font-family="monospace" font-size="11">-X</text><text x="190" y="372" fill="#f5c14e" font-family="monospace" font-size="11">GET</text><text x="120" y="392" fill="rgba(245, 241, 232, 0.7)" font-family="monospace" font-size="11">  &quot;https://api.example.com/v1/users?page=1&amp;limit=10&quot;</text><text x="120" y="412" fill="rgba(245, 241, 232, 0.7)" font-family="monospace" font-size="11">  -H</text><text x="160" y="412" fill="#ff2d87" font-family="monospace" font-size="11">&quot;Authorization: Bearer YOUR_TOKEN&quot;</text><text x="100" y="455" fill="#f5f1e8" font-family="sans-serif" font-size="13" font-weight="600">Example Response</text><rect width="70" height="20" x="550" y="442" fill="rgba(184, 209, 138, 0.2)" rx="6"/><text x="585" y="457" fill="#b8d18a" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">200 OK</text><rect width="640" height="200" x="100" y="465" fill="rgba(0, 0, 0, 0.5)" rx="8"/><text x="120" y="485" fill="rgba(245, 241, 232, 0.5)" font-family="monospace" font-size="11">{</text><text x="140" y="505" fill="#ff2d87" font-family="monospace" font-size="11">&quot;data&quot;</text><text x="195" y="505" fill="rgba(245, 241, 232, 0.5)" font-family="monospace" font-size="11">: [</text><text x="160" y="525" fill="rgba(245, 241, 232, 0.5)" font-family="monospace" font-size="11">{</text><text x="180" y="545" fill="#b8d18a" font-family="monospace" font-size="11">&quot;id&quot;</text><text x="220" y="545" fill="rgba(245, 241, 232, 0.5)" font-family="monospace" font-size="11">:</text><text x="235" y="545" fill="#f5c14e" font-family="monospace" font-size="11">1</text><text x="245" y="545" fill="rgba(245, 241, 232, 0.5)" font-family="monospace" font-size="11">,</text><text x="180" y="565" fill="#b8d18a" font-family="monospace" font-size="11">&quot;name&quot;</text><text x="235" y="565" fill="rgba(245, 241, 232, 0.5)" font-family="monospace" font-size="11">:</text><text x="250" y="565" fill="#f5c14e" font-family="monospace" font-size="11">&quot;Julia Decker&quot;</text><text x="380" y="565" fill="rgba(245, 241, 232, 0.5)" font-family="monospace" font-size="11">,</text><text x="180" y="585" fill="#b8d18a" font-family="monospace" font-size="11">&quot;email&quot;</text><text x="235" y="585" fill="rgba(245, 241, 232, 0.5)" font-family="monospace" font-size="11">:</text><text x="250" y="585" fill="#f5c14e" font-family="monospace" font-size="11">&quot;julia@example.com&quot;</text><text x="160" y="605" fill="rgba(245, 241, 232, 0.5)" font-family="monospace" font-size="11">}</text><text x="140" y="625" fill="rgba(245, 241, 232, 0.5)" font-family="monospace" font-size="11">],</text><text x="140" y="645" fill="#ff2d87" font-family="monospace" font-size="11">&quot;meta&quot;</text><text x="190" y="645" fill="rgba