<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#0d0d0d"/>

  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="20" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="40" y="40" width="1120" height="720" rx="18" fill="#1a1a1a" stroke="rgba(255, 45, 135, 0.3)" stroke-width="1" filter="url(#glow)"/>

  <text x="80" y="90" font-family="monospace" font-size="10" fill="#ff2d87" letter-spacing="0.08em">CONVERSATIONAL AI • INTELLIGENTER CHATBOT</text>

  <rect x="80" y="120" width="680" height="560" rx="12" fill="#0d0d0d" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>

  <!-- Chat Header -->
  <rect x="100" y="140" width="640" height="50" rx="8" fill="rgba(255, 45, 135, 0.08)"/>
  <circle cx="120" cy="165" r="12" fill="rgba(184, 209, 138, 0.3)"/>
  <text x="120" y="171" font-family="sans-serif" font-size="12" fill="#b8d18a" text-anchor="middle" font-weight="700">AI</text>
  <text x="145" y="170" font-family="sans-serif" font-size="14" fill="#f5f1e8" font-weight="600">Nuroy Support Bot</text>
  <circle cx="710" cy="165" r="5" fill="#b8d18a"/>
  <text x="722" y="170" font-family="monospace" font-size="10" fill="#b8d18a">Online</text>

