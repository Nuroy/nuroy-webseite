  <rect x="800" y="212" width="300" height="8" rx="4" fill="rgba(255, 255, 255, 0.05)"/>
  <rect x="800" y="212" width="267" height="8" rx="4" fill="#b8d18a"/>
  <text x="1100" y="230" font-family="monospace" font-size="11" fill="#b8d18a" text-anchor="end" font-weight="700">89%</text>

  <text x="800" y="260" font-family="monospace" font-size="10" fill="rgba(245, 241, 232, 0.5)">Ø Antwortzeit</text>
  <text x="1100" y="260" font-family="monospace" font-size="14" fill="#ff2d87" text-anchor="end" font-weight="700">1.2s</text>

  <text x="800" y="290" font-family="monospace" font-size="10" fill="rgba(245, 241, 232, 0.5)">Customer Satisfaction</text>
  <text x="1100" y="290" font-family="monospace" font-size="14" fill="#b8d18a" text-anchor="end" font-weight="700">4.8/5</text>

  <rect x="780" y="340" width="340" height="180" rx="12" fill="#0d0d0d" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
  <text x="800" y="365" font-family="monospace" font-size="9" fill="rgba(245, 241, 232, 0.5)">BOT CAPABILITIES</text>

  <rect x="800" y="380" width="300" height="30" rx="6" fill="rgba(184, 209, 138, 0.08)"/>
  <circle cx="815" cy="395" r="4" fill="#b8d18a"/>
  <text x="830" y="399" font-family="sans-serif" font-size="11" fill="#f5f1e8">💬 Natural Language Understanding</text>

  <rect x="800" y="420" width="300" height="30" rx="6" fill="rgba(184, 209, 138, 0.08)"/>
  <circle cx="815" cy="435" r="4" fill="#b8d18a"/>
  <text x="830" y="439" font-family="sans-serif" font-size="11" fill="#f5f1e8">🔍 Knowledge Base Search</text>

  <rect x="800" y="460" width="300" height="30" rx="6" fill="rgba(184, 209, 138, 0.08)"/>
  <circle cx="815" cy="475" r="4" fill="#b8d18a"/>
  <text x="830" y="479" font-family="sans-serif" font-size="11" fill="#f5f1e8">🤝 Live Agent Handoff</text>

  <rect x="780" y="540" width="340" height="140" rx="12" fill="#0d0d0d" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
  <text x="800" y="565" font-family="monospace" font-size="9" fill="rgba(245, 241, 232, 0.5)">LLM CONFIGURATION</text>

  <text x="800" y="595" font-family="monospace" font-size="10" fill="rgba(245, 241, 232, 0.5)">Modell</text>
  <text x="1100" y="595" font-family="monospace" font-size="12" fill="#f5f1e8" text-anchor="end">GPT-4 Turbo</text>

  <text x="800" y="625" font-family="monospace" font-size="10" fill="rgba(245, 241, 232, 0.5)">Temperature</text>
  <text x="1100" y="625" font-family="monospace" font-size="12" fill="#f5f1e8" text-anchor="end">0.7</text>

  <text x="800" y="655" font-family="monospace" font-size="10" fill="rgba(245, 241, 232, 0.5)">Max Tokens</text>
  <text x="1100" y="655" font-family="monospace" font-size="12" fill="#f5f1e8" text-anchor="end">2048</text>

  <rect x="80" y="700" width="340" height="50" rx="8" fill="rgba(184, 209, 138, 0.1)" stroke="rgba(184, 209, 138, 0.3)" stroke-width="1"/>
  <text x="100" y="730" font-family="sans-serif" font-size="12" fill="#b8d18a">↑ 842 Gespräche mit 89% Lösungsrate</text>

  <rect x="440" y="700" width="340" height="50" rx="8" fill="rgba(255, 45, 135, 0.1)" stroke="rgba(255, 45, 135, 0.3)" stroke-width="1"/>
  <text x="460" y="730" font-family="sans-serif" font-size="12" fill="#ff2d87">⚡ Antwortzeit 1.2s — blitzschnell</text>

  <rect x="800" y="700" width="320" height="50" rx="8" fill="rgba(184, 209, 138, 0.1)" stroke="rgba(184, 209, 138, 0.3)" stroke-width="1"/>
  <text x="820" y="730" font-family="sans-serif" font-size="12" fill="#b8d18a">4.8/5 Customer Satisfaction — top!</text>

  <text x="80" y="785" font-family="monospace" font-size="10" fill="rgba(245, 241, 232, 0.5)">Features:</text>
  <text x="145" y="785" font-family="monospace" font-size="10" fill="rgba(245, 241, 232, 0.7)">GPT-4 Integration · NLU · Multi-Language · Context Memory · Live Handoff · Analytics</text>
</svg>
