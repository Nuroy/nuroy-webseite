  <!-- Message 1 - Bot -->
  <rect x="110" y="210" width="480" height="70" rx="8" fill="rgba(255, 255, 255, 0.03)"/>
  <circle cx="125" cy="230" r="10" fill="rgba(184, 209, 138, 0.2)"/>
  <text x="125" y="235" font-family="sans-serif" font-size="10" fill="#b8d18a" text-anchor="middle" font-weight="700">AI</text>
  <text x="145" y="235" font-family="sans-serif" font-size="12" fill="#f5f1e8">Hallo! Ich bin dein KI-Assistent. Wie kann ich dir heute helfen?</text>
  <text x="145" y="265" font-family="monospace" font-size="9" fill="rgba(245, 241, 232, 0.4)">14:32</text>

  <!-- Message 2 - User -->
  <rect x="250" y="295" width="480" height="55" rx="8" fill="rgba(255, 45, 135, 0.08)"/>
  <text x="270" y="320" font-family="sans-serif" font-size="12" fill="#f5f1e8">Ich habe eine Frage zu meiner letzten Rechnung #2024-042.</text>
  <text x="700" y="340" font-family="monospace" font-size="9" fill="rgba(245, 241, 232, 0.4)" text-anchor="end">14:33</text>
  <circle cx="715" cy="315" r="10" fill="rgba(255, 45, 135, 0.2)"/>
  <text x="715" y="320" font-family="sans-serif" font-size="10" fill="#ff2d87" text-anchor="middle" font-weight="700">JD</text>

  <!-- Message 3 - Bot (thinking) -->
  <rect x="110" y="365" width="480" height="120" rx="8" fill="rgba(184, 209, 138, 0.05)" stroke="rgba(184, 209, 138, 0.2)" stroke-width="1"/>
  <circle cx="125" cy="385" r="10" fill="rgba(184, 209, 138, 0.2)"/>
  <text x="125" y="390" font-family="sans-serif" font-size="10" fill="#b8d18a" text-anchor="middle" font-weight="700">AI</text>
  <text x="145" y="390" font-family="sans-serif" font-size="12" fill="#f5f1e8">Ich habe deine Rechnung #2024-042 gefunden:</text>

  <rect x="165" y="405" width="400" height="60" rx="6" fill="rgba(255, 255, 255, 0.03)"/>
  <text x="185" y="425" font-family="monospace" font-size="10" fill="rgba(245, 241, 232, 0.6)">• Betrag: €4.400,00</text>
  <text x="185" y="445" font-family="monospace" font-size="10" fill="rgba(245, 241, 232, 0.6)">• Datum: 15.05.2026</text>
  <text x="185" y="465" font-family="monospace" font-size="10" fill="#f5c14e">• Fällig: 30.05.2026 (in 7 Tagen)</text>

  <text x="145" y="490" font-family="monospace" font-size="9" fill="rgba(245, 241, 232, 0.4)">14:33</text>

