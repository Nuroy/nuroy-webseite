<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0A0C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#121216;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#grad1)"/>

  <!-- Title Badge -->
  <text x="40" y="35" fill="#FF2D7A" font-size="12" font-family="monospace" letter-spacing="2">COMPUTER VISION &amp; IMAGE DETECTION</text>

  <!-- Image Preview Area -->
  <rect x="40" y="70" width="700" height="540" rx="8" fill="#1C1C22" stroke="rgba(245,242,236,0.08)" stroke-width="1"/>
  <text x="60" y="100" fill="#9A968C" font-size="11" font-family="monospace" letter-spacing="1">IMAGE ANALYSIS</text>

  <!-- Main Image Placeholder -->
  <rect x="60" y="120" width="660" height="470" rx="6" fill="rgba(245,242,236,0.04)" stroke="rgba(245,242,236,0.08)" stroke-width="1"/>

  <!-- Simulated Image Content -->
  <rect x="80" y="140" width="620" height="300" rx="4" fill="rgba(154,150,140,0.1)"/>

  <!-- Bounding Boxes -->
  <rect x="120" y="180" width="180" height="120" rx="4" fill="none" stroke="#FF2D7A" stroke-width="3"/>
  <rect x="115" y="165" width="90" height="22" rx="3" fill="#FF2D7A"/>
  <text x="120" y="180" fill="#0A0A0C" font-size="10" font-weight="bold">Person (98%)</text>

  <rect x="350" y="220" width="140" height="90" rx="4" fill="none" stroke="#8FA373" stroke-width="3"/>
  <rect x="345" y="205" width="80" height="22" rx="3" fill="#8FA373"/>
  <text x="350" y="220" fill="#0A0A0C" font-size="10" font-weight="bold">Laptop (94%)</text>

  <rect x="540" y="250" width="120" height="80" rx="4" fill="none" stroke="#D1A85C" stroke-width="3"/>
  <rect x="535" y="235" width="70" height="22" rx="3" fill="#D1A85C"/>
  <text x="540" y="250" fill="#0A0A0C" font-size="10" font-weight="bold">Phone (87%)</text>

  <!-- Detection Points -->
  <circle cx="160" cy="460" r="6" fill="#FF2D7A"/>
  <circle cx="240" cy="480" r="6" fill="#8FA373"/>
  <circle cx="380" cy="470" r="6" fill="#FF2D7A"/>
  <circle cx="520" cy="485" r="6" fill="#D1A85C"/>
  <circle cx="600" cy="455" r="6" fill="#8FA373"/>

  <!-- Keypoints lines -->
  <path d="M 160 460 L 240 480" stroke="rgba(255,45,122,0.3)" stroke-width="2"/>
  <path d="M 240 480 L 380 470" stroke="rgba(255,45,122,0.3)" stroke-width="2"/>
  <path d="M 380 470 L 520 485" stroke="rgba(143,163,115,0.3)" stroke-width="2"/>

  <!-- Processing Stats -->
  <rect x="80" y="460" width="620" height="110" rx="6" fill="rgba(245,242,236,0.02)" stroke="rgba(245,242,236,0.08)" stroke-width="1"/>

  <text x="100" y="485" fill="#5E5A52" font-size="10" font-family="monospace">DETECTED OBJECTS</text>

  <rect x="100" y="495" width="180" height="35" rx="4" fill="rgba(255,45,122,0.08)"/>
  <text x="115" y="510" fill="#FF2D7A" font-size="11" font-weight="bold">2x Person</text>
  <text x="115" y="523" fill="#9A968C" font-size="9">Confidence: 98%, 96%</text>

  <rect x="295" y="495" width="180" height="35" rx="4" fill="rgba(143,163,115,0.08)"/>
  <text x="310" y="510" fill="#8FA373" font-size="11" font-weight="bold">1x Laptop</text>
  <text x="310" y="523" fill="#9A968C" font-size="9">Confidence: 94%</text>

  <rect x="490" y="495" width="180" height="35" rx="4" fill="rgba(209,168,92,0.08)"/>
  <text x="505" y="510" fill="#D1A85C" font-size="11" font-weight="bold">1x Phone</text>
  <text x="505" y="523" fill="#9A968C" font-size="9">Confidence: 87%</text>

  <text x="100" y="555" fill="#9A968C" font-size="10">Processing time: 124ms • Model: YOLOv8 • Image: 1920x1080px</text>

  <!-- Detection Results Panel -->
  <rect x="760" y="70" width="400" height="540" rx="8" fill="#1C1C22" stroke="rgba(245,242,236,0.08)" stroke-width="1"/>
  <text x="780" y="100" fill="#9A968C" font-size="11" font-family="monospace" letter-spacing="1">ANALYSIS RESULTS</text>

  <!-- Status -->
  <rect x="780" y="120" width="360" height="50" rx="6" fill="rgba(143,163,115,0.08)" stroke="rgba(143,163,115,0.2)" stroke-width="1"/>
  <circle cx="800" cy="145" r="8" fill="#8FA373"/>
  <text x="820" y="142" fill="#F5F2EC" font-size="12" font-weight="bold">Detection Complete</text>
  <text x="820" y="158" fill="#9A968C" font-size="10">4 objects detected • 92% avg confidence</text>

  <!-- Categories -->
  <text x="780" y="195" fill="#5E5A52" font-size="10" font-family="monospace">DETECTION BREAKDOWN</text>

  <rect x="780" y="205" width="360" height="45" rx="4" fill="rgba(245,242,236,0.04)"/>
  <rect x="795" y="215" width="8" height="25" rx="2" fill="#FF2D7A"/>
  <text x="815" y="227" fill="#F5F2EC" font-size="11" font-weight="bold">People</text>
  <text x="815" y="242" fill="#9A968C" font-size="9">2 detected • Avg confidence: 97%</text>
  <text x="1090" y="230" fill="#FF2D7A" font-size="12" font-weight="bold">2</text>

  <rect x="780" y="258" width="360" height="45" rx="4" fill="rgba(245,242,236,0.04)"/>
  <rect x="795" y="268" width="8" height="25" rx="2" fill="#8FA373"/>
  <text x="815" y="280" fill="#F5F2EC" font-size="11" font-weight="bold">Electronics</text>
  <text x="815" y="295" fill="#9A968C" font-size="9">2 detected • Avg confidence: 90%</text>
  <text x="1090" y="283" fill="#8FA373" font-size="12" font-weight="bold">2</text>

  <rect x="780" y="311" width="360" height="45" rx="4" fill="rgba(245,242,236,0.04)"/>
  <rect x="795" y="321" width="8" height="25" rx="2" fill="#9A968C"/>
  <text x="815" y="333" fill="#F5F2EC" font-size="11" font-weight="bold">Furniture</text>
  <text x="815" y="348" fill="#9A968C" font-size="9">Not detected</text>
  <text x="1090" y="336" fill="#9A968C" font-size="12">0</text>

  <!-- Detailed List -->
  <text x="780" y="385" fill="#5E5A52" font-size="10" font-family="monospace">DETAILED DETECTIONS</text>

  <rect x="780" y="395" width="360" height="60" rx="4" fill="rgba(255,45,122,0.06)" stroke="rgba(255,45,122,0.2)" stroke-width="1"/>
  <text x="800" y="413" fill="#FF2D7A" font-size="11" font-weight="bold">Person #1</text>
  <text x="800" y="428" fill="#9A968C" font-size="9">Position: (120, 180) • Size: 180x120px</text>
  <text x="800" y="443" fill="#9A968C" font-size="9">Attributes: Standing, Facing camera</text>

  <rect x="780" y="463" width="360" height="60" rx="4" fill="rgba(143,163,115,0.06)" stroke="rgba(143,163,115,0.2)" stroke-width="1"/>
  <text x="800" y="481" fill="#8FA373" font-size="11" font-weight="bold">Laptop</text>
  <text x="800" y="496" fill="#9A968C" font-size="9">Position: (350, 220) • Size: 140x90px</text>
  <text x="800" y="511" fill="#9A968C" font-size="9">Attributes: Open, MacBook detected</text>

  <rect x="780" y="531" width="360" height="60" rx="4" fill="rgba(209,168,92,0.06)" stroke="rgba(209,168,92,0.2)" stroke-width="1"/>
  <text x="800" y="549" fill="#D1A85C" font-size="11" font-weight="bold">Phone</text>
  <text x="800" y="564" fill="#9A968C" font-size="9">Position: (540, 250) • Size: 120x80px</text>
  <text x="800" y="579" fill="#9A968C" font-size="9">Attributes: Smartphone, Screen on</text>

  <!-- Footer -->
  <rect x="40" y="625" width="1120" height="35" rx="6" fill="rgba(255,45,122,0.06)" stroke="rgba(255,45,122,0.2)" stroke-width="1"/>
  <text x="60" y="647" fill="#9A968C" font-size="11">AI Features:</text>
  <text x="210" y="647" fill="#F5F2EC" font-size="11">Object Detection</text>
  <text x="400" y="647" fill="#F5F2EC" font-size="11">Bounding Boxes</text>
  <text x="590" y="647" fill="#F5F2EC" font-size="11">Attribute Recognition</text>
  <text x="810" y="647" fill="#F5F2EC" font-size="11">Real-time Processing</text>
</svg>
