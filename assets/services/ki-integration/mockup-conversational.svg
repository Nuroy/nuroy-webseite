<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0A0C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#121216;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#grad1)"/>

  <!-- Title Badge -->
  <text x="40" y="35" fill="#FF2D7A" font-size="12" font-family="monospace" letter-spacing="2">CHATBOT BUILDER &amp; TRAINING</text>

  <!-- Intent Flow Designer -->
  <rect x="40" y="70" width="720" height="540" rx="8" fill="#1C1C22" stroke="rgba(245,242,236,0.08)" stroke-width="1"/>
  <text x="60" y="100" fill="#9A968C" font-size="11" font-family="monospace" letter-spacing="1">CONVERSATION FLOW</text>

  <!-- Start Node -->
  <rect x="80" y="130" width="140" height="60" rx="8" fill="rgba(143,163,115,0.12)" stroke="rgba(143,163,115,0.4)" stroke-width="2"/>
  <text x="100" y="155" fill="#8FA373" font-size="10" font-weight="bold">START</text>
  <text x="100" y="172" fill="#9A968C" font-size="9">User initiates chat</text>

  <!-- Arrow Down -->
  <path d="M 150 190 L 150 230" stroke="#FF2D7A" stroke-width="2" fill="none"/>
  <polygon points="150,230 145,223 155,223" fill="#FF2D7A"/>

  <!-- Intent Recognition -->
  <rect x="80" y="230" width="140" height="80" rx="8" fill="rgba(255,45,122,0.12)" stroke="rgba(255,45,122,0.4)" stroke-width="2"/>
  <text x="100" y="255" fill="#FF2D7A" font-size="10" font-weight="bold">INTENT</text>
  <text x="100" y="270" fill="#FF2D7A" font-size="9">Greeting</text>
  <text x="100" y="288" fill="#9A968C" font-size="8">Training phrases:</text>
  <text x="100" y="300" fill="#9A968C" font-size="8">• "Hallo"</text>

  <!-- Branches -->
  <path d="M 220 270 L 280 230" stroke="#FF2D7A" stroke-width="2" fill="none"/>
  <polygon points="280,230 275,236 278,227" fill="#FF2D7A"/>
  <text x="235" y="245" fill="#9A968C" font-size="8">Question</text>

  <path d="M 220 270 L 280 310" stroke="#FF2D7A" stroke-width="2" fill="none"/>
  <polygon points="280,310 278,301 275,310" fill="#FF2D7A"/>
  <text x="235" y="295" fill="#9A968C" font-size="8">Support</text>

  <!-- Product Question Branch -->
  <rect x="280" y="190" width="140" height="80" rx="8" fill="rgba(255,45,122,0.12)" stroke="rgba(255,45,122,0.4)" stroke-width="2"/>
  <text x="300" y="215" fill="#FF2D7A" font-size="10" font-weight="bold">INTENT</text>
  <text x="300" y="230" fill="#FF2D7A" font-size="9">Product Question</text>
  <text x="300" y="248" fill="#9A968C" font-size="8">Phrases:</text>
  <text x="300" y="260" fill="#9A968C" font-size="8">• "Pricing?"</text>

  <!-- Support Request Branch -->
  <rect x="280" y="310" width="140" height="80" rx="8" fill="rgba(255,45,122,0.12)" stroke="rgba(255,45,122,0.4)" stroke-width="2"/>
  <text x="300" y="335" fill="#FF2D7A" font-size="10" font-weight="bold">INTENT</text>
  <text x="300" y="350" fill="#FF2D7A" font-size="9">Support Request</text>
  <text x="300" y="368" fill="#9A968C" font-size="8">Phrases:</text>
  <text x="300" y="380" fill="#9A968C" font-size="8">• "Help needed"</text>

  <!-- Response Nodes -->
  <path d="M 420 230 L 480 230" stroke="#8FA373" stroke-width="2" fill="none"/>
  <polygon points="480,230 473,225 473,235" fill="#8FA373"/>

  <rect x="480" y="195" width="160" height="70" rx="8" fill="rgba(143,163,115,0.12)" stroke="rgba(143,163,115,0.4)" stroke-width="2"/>
  <text x="500" y="220" fill="#8FA373" font-size="10" font-weight="bold">RESPONSE</text>
  <text x="500" y="237" fill="#9A968C" font-size="8">Show pricing page</text>
  <text x="500" y="250" fill="#9A968C" font-size="8">Offer demo booking</text>

  <path d="M 420 350 L 480 350" stroke="#8FA373" stroke-width="2" fill="none"/>
  <polygon points="480,350 473,345 473,355" fill="#8FA373"/>

  <rect x="480" y="315" width="160" height="70" rx="8" fill="rgba(143,163,115,0.12)" stroke="rgba(143,163,115,0.4)" stroke-width="2"/>
  <text x="500" y="340" fill="#8FA373" font-size="10" font-weight="bold">ACTION</text>
  <text x="500" y="357" fill="#9A968C" font-size="8">Create ticket</text>
  <text x="500" y="370" fill="#9A968C" font-size="8">Transfer to agent</text>

  <!-- Fallback -->
  <rect x="80" y="430" width="560" height="60" rx="8" fill="rgba(154,150,140,0.12)" stroke="rgba(154,150,140,0.4)" stroke-width="2"/>
  <text x="100" y="455" fill="#9A968C" font-size="10" font-weight="bold">FALLBACK</text>
  <text x="100" y="472" fill="#9A968C" font-size="9">No intent matched → Suggest help topics or connect to human agent</text>

  <!-- Training Panel -->
  <rect x="780" y="70" width="380" height="540" rx="8" fill="#1C1C22" stroke="rgba(245,242,236,0.08)" stroke-width="1"/>
  <text x="800" y="100" fill="#9A968C" font-size="11" font-family="monospace" letter-spacing="1">TRAINING DATA</text>

  <!-- Training Stats -->
  <rect x="800" y="120" width="340" height="70" rx="6" fill="rgba(255,45,122,0.08)" stroke="rgba(255,45,122,0.2)" stroke-width="1"/>
  <text x="820" y="142" fill="#F5F2EC" font-size="12" font-weight="bold">Model Performance</text>
  <text x="820" y="160" fill="#9A968C" font-size="10">Accuracy: 94.2%</text>
  <text x="820" y="177" fill="#9A968C" font-size="10">Training samples: 1,247</text>

  <!-- Intent List -->
  <text x="800" y="215" fill="#5E5A52" font-size="10" font-family="monospace">INTENTS (8)</text>

  <rect x="800" y="225" width="340" height="45" rx="4" fill="rgba(245,242,236,0.04)" stroke="rgba(245,242,236,0.08)" stroke-width="1"/>
  <text x="820" y="243" fill="#FF2D7A" font-size="11" font-weight="bold">greeting</text>
  <text x="820" y="260" fill="#9A968C" font-size="9">47 training phrases • 98% confidence</text>

  <rect x="800" y="278" width="340" height="45" rx="4" fill="rgba(245,242,236,0.04)" stroke="rgba(245,242,236,0.08)" stroke-width="1"/>
  <text x="820" y="296" fill="#F5F2EC" font-size="11" font-weight="bold">product.pricing</text>
  <text x="820" y="313" fill="#9A968C" font-size="9">32 training phrases • 95% confidence</text>

  <rect x="800" y="331" width="340" height="45" rx="4" fill="rgba(245,242,236,0.04)" stroke="rgba(245,242,236,0.08)" stroke-width="1"/>
  <text x="820" y="349" fill="#F5F2EC" font-size="11" font-weight="bold">support.request</text>
  <text x="820" y="366" fill="#9A968C" font-size="9">54 training phrases • 92% confidence</text>

  <rect x="800" y="384" width="340" height="45" rx="4" fill="rgba(245,242,236,0.04)" stroke="rgba(245,242,236,0.08)" stroke-width="1"/>
  <text x="820" y="402" fill="#F5F2EC" font-size="11" font-weight="bold">booking.demo</text>
  <text x="820" y="419" fill="#9A968C" font-size="9">28 training phrases • 89% confidence</text>

  <!-- Sample Conversation -->
  <text x="800" y="455" fill="#5E5A52" font-size="10" font-family="monospace">TEST CONVERSATION</text>

  <rect x="800" y="465" width="340" height="125" rx="6" fill="rgba(245,242,236,0.02)" stroke="rgba(245,242,236,0.08)" stroke-width="1"/>

  <!-- User Message -->
  <rect x="820" y="480" width="200" height="35" rx="4" fill="rgba(245,242,236,0.08)"/>
  <text x="830" y="495" fill="#9A968C" font-size="9">USER</text>
  <text x="830" y="508" fill="#F5F2EC" font-size="10">"What's the pricing?"</text>

  <!-- Bot Response -->
  <rect x="880" y="525" width="240" height="50" rx="4" fill="rgba(255,45,122,0.08)"/>
  <text x="890" y="540" fill="#FF2D7A" font-size="9">BOT • product.pricing (95%)</text>
  <text x="890" y="555" fill="#F5F2EC" font-size="9">"Our plans start at €99/month.</text>
  <text x="890" y="568" fill="#F5F2EC" font-size="9">Would you like to book a demo?"</text>

  <!-- Footer -->
  <rect x="40" y="625" width="1120" height="35" rx="6" fill="rgba(255,45,122,0.06)" stroke="rgba(255,45,122,0.2)" stroke-width="1"/>
  <text x="60" y="647" fill="#9A968C" font-size="11">AI Features:</text>
  <text x="210" y="647" fill="#F5F2EC" font-size="11">Intent Recognition</text>
  <text x="400" y="647" fill="#F5F2EC" font-size="11">Flow Builder</text>
  <text x="590" y="647" fill="#F5F2EC" font-size="11">Training Dashboard</text>
  <text x="780" y="647" fill="#F5F2EC" font-size="11">Multi-Language</text>
</svg>
