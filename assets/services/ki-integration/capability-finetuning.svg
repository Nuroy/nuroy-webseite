<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#0d0d0d"/>

  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="20" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="lossGradient" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#b8d18a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#b8d18a" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="40" y="40" width="1120" height="720" rx="18" fill="#1a1a1a" stroke="rgba(255, 45, 135, 0.3)" stroke-width="1" filter="url(#glow)"/>

  <text x="80" y="90" font-family="monospace" font-size="10" fill="#ff2d87" letter-spacing="0.08em">MODEL FINE-TUNING • GPT-4 CUSTOM TRAINING</text>

  <rect x="80" y="120" width="680" height="560" rx="12" fill="#0d0d0d" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>

  <!-- Training Header -->
  <text x="100" y="150" font-family="sans-serif" font-size="14" fill="#f5f1e8" font-weight="600">customer-support-model-v2</text>

  <rect x="540" y="135" width="180" height="24" rx="6" fill="rgba(184, 209, 138, 0.15)"/>
  <circle cx="555" cy="147" r="3" fill="#b8d18a"/>
  <text x="565" y="151" font-family="monospace" font-size="10" fill="#b8d18a">Training abgeschlossen</text>

  <!-- Training Stats -->
  <rect x="100" y="170" width="200" height="85" rx="8" fill="rgba(184, 209, 138, 0.08)"/>
  <text x="120" y="195" font-family="monospace" font-size="9" fill="rgba(245, 241, 232, 0.5)">TRAINING-DATEN</text>
  <text x="120" y="230" font-family="sans-serif" font-size="26" fill="#b8d18a" font-weight="700">1,247</text>
  <text x="120" y="248" font-family="monospace" font-size="11" fill="#b8d18a">Beispiele</text>

  <rect x="320" y="170" width="200" height="85" rx="8" fill="rgba(255, 45, 135, 0.08)"/>
  <text x="340" y="195" font-family="monospace" font-size="9" fill="rgba(245, 241, 232, 0.5)">FINAL LOSS</text>
  <text x="340" y="230" font-family="sans-serif" font-size="26" fill="#ff2d87" font-weight="700">0.08</text>
  <text x="340" y="248" font-family="monospace" font-size="11" fill="#ff2d87">↓ -92% vs. Start</text>

  <rect x="540" y="170" width="200" height="85" rx="8" fill="rgba(245, 193, 78, 0.08)"/>
  <text x="560" y="195" font-family="monospace" font-size="9" fill="rgba(245, 241, 232, 0.5)">ACCURACY</text>
  <text x="560" y="230" font-family="sans-serif" font-size="26" fill="#f5c14e" font-weight="700">96.4%</text>
  <text x="560" y="248" font-family="monospace" font-size="11" fill="#f5c14e">Validation Set</text>

  <!-- Training Loss Chart -->
  <text x="100" y="290" font-family="sans-serif" font-size="13" fill="#f5f1e8" font-weight="600">Training Loss über Epochen</text>

  <svg x="100" y="305" width="640" height="200" viewBox="0 0 640 200">
    <!-- Grid -->
    <line x1="0" y1="0" x2="640" y2="0" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
    <line x1="0" y1="50" x2="640" y2="50" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
    <line x1="0" y1="100" x2="640" y2="100" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
    <line x1="0" y1="150" x2="640" y2="150" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
    <line x1="0" y1="200" x2="640" y2="200" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>

    <!-- Y-Axis Labels -->
    <text x="5" y="8" font-family="monospace" font-size="9" fill="rgba(245, 241, 232, 0.4)">1.0</text>
    <text x="5" y="58" font-family="monospace" font-size="9" fill="rgba(245, 241, 232, 0.4)">0.75</text>
    <text x="5" y="108" font-family="monospace" font-size="9" fill="rgba(245, 241, 232, 0.4)">0.5</text>
    <text x="5" y="158" font-family="monospace" font-size="9" fill="rgba(245, 241, 232, 0.4)">0.25</text>

    <!-- Training Loss Line (decreasing) -->
    <path d="M 60 20 L 120 30 L 180 50 L 240 80 L 300 110 L 360 130 L 420 145 L 480 155 L 540 165 L 600 170
             L 600 200 L 60 200 Z"
          fill="url(#lossGradient)"/>
    <path d="M 60 20 L 120 30 L 180 50 L 240 80 L 300 110 L 360 130 L 420 145 L 480 155 L 540 165 L 600 170"
          stroke="#b8d18a" stroke-width="3" fill="none"/>

    <!-- Data Points -->
    <circle cx="60" cy="20" r="4" fill="#b8d18a"/>
    <circle cx="240" cy="80" r="4" fill="#b8d18a"/>
    <circle cx="420" cy="145" r="4" fill="#b8d18a"/>
    <circle cx="600" cy="170" r="4" fill="#b8d18a"/>

    <!-- X-Axis Labels -->
    <text x="60" y="215" font-family="monospace" font-size="9" fill="rgba(245, 241, 232, 0.4)" text-anchor="middle">0</text>
    <text x="180" y="215" font-family="monospace" font-size="9" fill="rgba(245, 241, 232, 0.4)" text-anchor="middle">50</text>
    <text x="300" y="215" font-family="monospace" font-size="9" fill="rgba(245, 241, 232, 0.4)" text-anchor="middle">100</text>
    <text x="420" y="215" font-family="monospace" font-size="9" fill="rgba(245, 241, 232, 0.4)" text-anchor="middle">150</text>
    <text x="540" y="215" font-family="monospace" font-size="9" fill="rgba(245, 241, 232, 0.4)" text-anchor="middle">200</text>
    <text x="600" y="215" font-family="monospace" font-size="9" fill="#b8d18a" text-anchor="middle">250</text>
  </svg>

  <!-- Model Comparison -->
  <text x="100" y="530" font-family="sans-serif" font-size="13" fill="#f5f1e8" font-weight="600">Model-Vergleich • Before/After</text>

  <rect x="100" y="545" width="310" height="55" rx="6" fill="rgba(255, 255, 255, 0.03)"/>
  <text x="120" y="565" font-family="monospace" font-size="10" fill="rgba(245, 241, 232, 0.5)">Base Model (GPT-4)</text>
  <text x="120" y="585" font-family="monospace" font-size="12" fill="rgba(245, 241, 232, 0.7)">Accuracy: 78.4% • Response-Zeit: 2.1s</text>

  <rect x="430" y="545" width="310" height="55" rx="6" fill="rgba(184, 209, 138, 0.08)" stroke="rgba(184, 209, 138, 0.3)" stroke-width="1"/>
  <text x="450" y="565" font-family="monospace" font-size="10" fill="#b8d18a">Fine-Tuned Model (v2)</text>
  <text x="450" y="585" font-family="monospace" font-size="12" fill="#b8d18a" font-weight="700">Accuracy: 96.4% • Response-Zeit: 1.8s</text>

  <!-- Actions -->
  <rect x="100" y="615" width="150" height="35" rx="6" fill="rgba(184, 209, 138, 0.15)" stroke="rgba(184, 209, 138, 0.3)" stroke-width="1"/>
  <text x="175" y="638" font-family="sans-serif" font-size="11" fill="#b8d18a" text-anchor="middle" font-weight="600">✓ Model deployen</text>

  <rect x="270" y="615" width="150" height="35" rx="6" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
  <text x="345" y="638" font-family="sans-serif" font-size="11" fill="#f5f1e8" text-anchor="middle" font-weight="600">📊 Details ansehen</text>

  <rect x="440" y="615" width="150" height="35" rx="6" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
  <text x="515" y="638" font-family="sans-serif" font-size="11" fill="#f5f1e8" text-anchor="middle" font-weight="600">🔄 Neu trainieren</text>

  <!-- Right Column -->
  <rect x="780" y="120" width="340" height="200" rx="12" fill="#0d0d0d" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
  <text x="800" y="145" font-family="monospace" font-size="9" fill="rgba(245, 241, 232, 0.5)">TRAINING CONFIG</text>

  <text x="800" y="175" font-family="monospace" font-size="10" fill="rgba(245, 241, 232, 0.5)">Base Model</text>
  <text x="1100" y="175" font-family="monospace" font-size="12" fill="#f5f1e8" text-anchor="end">GPT-4 Turbo</text>

  <text x="800" y="205" font-family="monospace" font-size="10" fill="rgba(245, 241, 232, 0.5)">Learning Rate</text>
  <text x="1100" y="205" font-family="monospace" font-size="12" fill="#f5f1e8" text-anchor="end">0.0001</text>

  <text x="800" y="235" font-family="monospace" font-size="10" fill="rgba(245, 241, 232, 0.5)">Batch Size</text>
  <text x="1100" y="235" font-family="monospace" font-size="12" fill="#f5f1e8" text-anchor="end">32</text>

  <text x="800" y="265" font-family="monospace" font-size="10" fill="rgba(245, 241, 232, 0.5)">Epochen</text>
  <text x="1100" y="265" font-family="monospace" font-size="12" fill="#b8d18a" text-anchor="end" font-weight="700">250</text>

  <text x="800" y="295" font-family="monospace" font-size="10" fill="rgba(245, 241, 232, 0.5)">Training-Zeit</text>
  <text x="1100" y="295" font-family="monospace" font-size="12" fill="#ff2d87" text-anchor="end" font-weight="700">4.2h</text>

  <rect x="780" y="340" width="340" height="180" rx="12" fill="#0d0d0d" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
  <text x="800" y="365" font-family="monospace" font-size="9" fill="rgba(245, 241, 232, 0.5)">PERFORMANCE IMPROVEMENT</text>

  <text x="800" y="395" font-family="monospace" font-size="10" fill="rgba(245, 241, 232, 0.5)">Accuracy</text>
  <text x="930" y="395" font-family="monospace" font-size="11" fill="rgba(245, 241, 232, 0.5)">78.4%</text>
  <text x="985" y="395" font-family="monospace" font-size="11" fill="#b8d18a">→ 96.4%</text>
  <text x="1100" y="395" font-family="monospace" font-size="12" fill="#b8d18a" text-anchor="end" font-weight="700">+18%</text>

  <text x="800" y="425" font-family="monospace" font-size="10" fill="rgba(245, 241, 232, 0.5)">Response-Zeit</text>
  <text x="930" y="425" font-family="monospace" font-size="11" fill="rgba(245, 241, 232, 0.5)">2.1s</text>
  <text x="985" y="425" font-family="monospace" font-size="11" fill="#b8d18a">→ 1.8s</text>
  <text x="1100" y="425" font-family="monospace" font-size="12" fill="#b8d18a" text-anchor="end" font-weight="700">-14%</text>

  <text x="800" y="455" font-family="monospace" font-size="10" fill="rgba(245, 241, 232, 0.5)">Token-Effizienz</text>
  <text x="1100" y="455" font-family="monospace" font-size="12" fill="#b8d18a" text-anchor="end" font-weight="700">+32%</text>

  <text x="800" y="485" font-family="monospace" font-size="10" fill="rgba(245, 241, 232, 0.5)">Cost/Request</text>
  <text x="1100" y="485" font-family="monospace" font-size="12" fill="#b8d18a" text-anchor="end" font-weight="700">-28%</text>

  <rect x="780" y="540" width="340" height="140" rx="12" fill="#0d0d0d" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
  <text x="800" y="565" font-family="monospace" font-size="9" fill="rgba(245, 241, 232, 0.5)">DEPLOYMENT STATUS</text>

  <rect x="800" y="580" width="300" height="30" rx="6" fill="rgba(184, 209, 138, 0.08)"/>
  <circle cx="815" cy="595" r="4" fill="#b8d18a"/>
  <text x="830" y="599" font-family="sans-serif" font-size="11" fill="#b8d18a">✓ Model bereit für Deployment</text>

  <rect x="800" y="620" width="300" height="30" rx="6" fill="rgba(255, 255, 255, 0.03)"/>
  <circle cx="815" cy="635" r="4" fill="rgba(245, 241, 232, 0.5)"/>
  <text x="830" y="639" font-family="sans-serif" font-size="11" fill="rgba(245, 241, 232, 0.7)">Deployment-Slots: 3 verfügbar</text>

  <rect x="80" y="700" width="340" height="50" rx="8" fill="rgba(184, 209, 138, 0.1)" stroke="rgba(184, 209, 138, 0.3)" stroke-width="1"/>
  <text x="100" y="730" font-family="sans-serif" font-size="12" fill="#b8d18a">↑ Accuracy von 78.4% auf 96.4% — +18%</text>

  <rect x="440" y="700" width="340" height="50" rx="8" fill="rgba(255, 45, 135, 0.1)" stroke="rgba(255, 45, 135, 0.3)" stroke-width="1"/>
  <text x="460" y="730" font-family="sans-serif" font-size="12" fill="#ff2d87">⚡ Final Loss 0.08 — sehr gut konvergiert</text>

  <rect x="800" y="700" width="320" height="50" rx="8" fill="rgba(184, 209, 138, 0.1)" stroke="rgba(184, 209, 138, 0.3)" stroke-width="1"/>
  <text x="820" y="730" font-family="sans-serif" font-size="12" fill="#b8d18a">Cost/Request -28% — effizienter!</text>

  <text x="80" y="785" font-family="monospace" font-size="10" fill="rgba(245, 241, 232, 0.5)">Features:</text>
  <text x="145" y="785" font-family="monospace" font-size="10" fill="rgba(245, 241, 232, 0.7)">GPT-4 Fine-Tuning · Custom Training Data · Loss Monitoring · Model Comparison · Auto-Deployment</text>
</svg>
