<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0A0C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#121216;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#grad1)"/>

  <!-- Title Badge -->
  <text x="40" y="35" fill="#FF2D7A" font-size="12" font-family="monospace" letter-spacing="2">WORKFLOW AUTOMATION BUILDER</text>

  <!-- Workflow Canvas -->
  <rect x="40" y="70" width="900" height="540" rx="8" fill="#1C1C22" stroke="rgba(245,242,236,0.08)" stroke-width="1"/>

  <!-- Grid pattern for canvas -->
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(245,242,236,0.02)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect x="40" y="70" width="900" height="540" fill="url(#grid)"/>

  <!-- Trigger Node -->
  <rect x="80" y="250" width="180" height="80" rx="8" fill="rgba(255,45,122,0.12)" stroke="rgba(255,45,122,0.4)" stroke-width="2"/>
  <circle cx="110" cy="280" r="15" fill="rgba(255,45,122,0.2)"/>
  <text x="105" y="286" fill="#FF2D7A" font-size="14">⚡</text>
  <text x="135" y="280" fill="#FF2D7A" font-size="13" font-weight="bold">TRIGGER</text>
  <text x="90" y="303" fill="#F5F2EC" font-size="11">New Customer Signup</text>
  <rect x="90" y="310" width="160" height="12" rx="3" fill="rgba(255,45,122,0.08)"/>
  <text x="95" y="319" fill="#FF2D7A" font-size="9">Webhook: /api/signup</text>

  <!-- Connection Line 1 -->
  <path d="M 260 290 L 320 290" stroke="#FF2D7A" stroke-width="2" fill="none"/>
  <polygon points="320,290 315,285 315,295" fill="#FF2D7A"/>

  <!-- Decision Node 1 -->
  <rect x="330" y="110" width="180" height="360" rx="8" fill="rgba(209,168,92,0.08)" stroke="rgba(209,168,92,0.3)" stroke-width="2"/>
  <circle cx="360" cy="140" r="15" fill="rgba(209,168,92,0.2)"/>
  <text x="354" y="146" fill="#D1A85C" font-size="14">?</text>
  <text x="385" y="140" fill="#D1A85C" font-size="13" font-weight="bold">CONDITION</text>
  <text x="340" y="163" fill="#F5F2EC" font-size="11">Check Plan Type</text>

  <!-- Option 1: Free Plan -->
  <rect x="345" y="185" width="150" height="70" rx="6" fill="rgba(245,242,236,0.04)" stroke="rgba(245,242,236,0.1)" stroke-width="1"/>
  <text x="355" y="205" fill="#9A968C" font-size="10" font-weight="bold">IF: Free Plan</text>
  <text x="355" y="225" fill="#9A968C" font-size="9">plan_type == "free"</text>
  <path d="M 495 220 L 560 220" stroke="#9A968C" stroke-width="2" fill="none"/>
  <polygon points="560,220 555,215 555,225" fill="#9A968C"/>

  <!-- Option 2: Premium Plan -->
  <rect x="345" y="270" width="150" height="70" rx="6" fill="rgba(255,45,122,0.08)" stroke="rgba(255,45,122,0.2)" stroke-width="1"/>
  <text x="355" y="290" fill="#FF2D7A" font-size="10" font-weight="bold">IF: Premium Plan</text>
  <text x="355" y="310" fill="#FF2D7A" font-size="9">plan_type == "premium"</text>
  <path d="M 495 305 L 560 305" stroke="#FF2D7A" stroke-width="2" fill="none"/>
  <polygon points="560,305 555,300 555,310" fill="#FF2D7A"/>

  <!-- Option 3: Enterprise Plan -->
  <rect x="345" y="355" width="150" height="70" rx="6" fill="rgba(143,163,115,0.08)" stroke="rgba(143,163,115,0.2)" stroke-width="1"/>
  <text x="355" y="375" fill="#8FA373" font-size="10" font-weight="bold">IF: Enterprise Plan</text>
  <text x="355" y="395" fill="#8FA373" font-size="9">plan_type == "enterprise"</text>
  <path d="M 495 390 L 560 390" stroke="#8FA373" stroke-width="2" fill="none"/>
  <polygon points="560,390 555,385 555,395" fill="#8FA373"/>

  <!-- Action Nodes - Free Path -->
  <rect x="570" y="185" width="160" height="70" rx="6" fill="rgba(245,242,236,0.04)" stroke="rgba(245,242,236,0.1)" stroke-width="1"/>
  <text x="585" y="210" fill="#9A968C" font-size="11" font-weight="bold">Send Email</text>
  <text x="585" y="228" fill="#9A968C" font-size="9">Template: welcome_free</text>
  <text x="585" y="243" fill="#9A968C" font-size="9">Delay: Immediate</text>

  <!-- Action Nodes - Premium Path -->
  <rect x="570" y="270" width="160" height="70" rx="6" fill="rgba(255,45,122,0.08)" stroke="rgba(255,45,122,0.2)" stroke-width="1"/>
  <text x="585" y="295" fill="#FF2D7A" font-size="11" font-weight="bold">Send Email</text>
  <text x="585" y="313" fill="#FF2D7A" font-size="9">Template: welcome_premium</text>
  <text x="585" y="328" fill="#FF2D7A" font-size="9">+ Schedule onboarding call</text>

  <!-- Action Nodes - Enterprise Path -->
  <rect x="570" y="355" width="160" height="70" rx="6" fill="rgba(143,163,115,0.08)" stroke="rgba(143,163,115,0.2)" stroke-width="1"/>
  <text x="585" y="380" fill="#8FA373" font-size="11" font-weight="bold">Notify Sales Team</text>
  <text x="585" y="398" fill="#8FA373" font-size="9">Slack: #sales-enterprise</text>
  <text x="585" y="413" fill="#8FA373" font-size="9">+ Assign account manager</text>

  <!-- Merge paths -->
  <path d="M 730 220 L 780 290" stroke="#9A968C" stroke-width="2" fill="none"/>
  <path d="M 730 305 L 780 305" stroke="#FF2D7A" stroke-width="2" fill="none"/>
  <path d="M 730 390 L 780 325" stroke="#8FA373" stroke-width="2" fill="none"/>

  <!-- Final Action Node -->
  <rect x="780" y="270" width="140" height="70" rx="6" fill="rgba(255,45,122,0.08)" stroke="rgba(255,45,122,0.3)" stroke-width="2"/>
  <circle cx="805" cy="295" r="12" fill="rgba(255,45,122,0.2)"/>
  <text x="800" y="301" fill="#FF2D7A" font-size="12">✓</text>
  <text x="790" y="323" fill="#FF2D7A" font-size="11" font-weight="bold">Create CRM Entry</text>
  <text x="790" y="337" fill="#9A968C" font-size="9">Auto-tag by plan type</text>

  <!-- Workflow Stats Panel -->
  <rect x="60" y="540" width="860" height="55" rx="6" fill="rgba(255,45,122,0.06)" stroke="rgba(255,45,122,0.2)" stroke-width="1"/>
  <text x="80" y="562" fill="#9A968C" font-size="10">Workflow Status:</text>
  <circle cx="200" cy="558" r="5" fill="#8FA373"/>
  <text x="215" y="562" fill="#8FA373" font-size="11" font-weight="bold">Active</text>

  <text x="80" y="582" fill="#9A968C" font-size="10">Performance:</text>
  <text x="180" y="582" fill="#FF2D7A" font-size="10" font-weight="bold">1,247 executions this month</text>
  <text x="450" y="582" fill="#8FA373" font-size="10">99.8% success rate</text>
  <text x="650" y="582" fill="#9A968C" font-size="10">Avg. runtime: 1.2s</text>

  <!-- Properties Panel -->
  <rect x="960" y="70" width="200" height="540" rx="8" fill="#1C1C22" stroke="rgba(245,242,236,0.08)" stroke-width="1"/>
  <text x="980" y="100" fill="#9A968C" font-size="11" font-family="monospace" letter-spacing="1">PROPERTIES</text>

  <!-- Workflow Settings -->
  <rect x="980" y="120" width="160" height="100" rx="6" fill="rgba(245,242,236,0.04)" stroke="rgba(245,242,236,0.08)" stroke-width="1"/>
  <text x="995" y="145" fill="#F5F2EC" font-size="11" font-weight="bold">Workflow Settings</text>
  <text x="995" y="165" fill="#9A968C" font-size="9">Name: New Customer Flow</text>
  <text x="995" y="182" fill="#9A968C" font-size="9">Version: 2.3</text>
  <text x="995" y="199" fill="#8FA373" font-size="9">Status: ● Active</text>

  <!-- Trigger Config -->
  <rect x="980" y="235" width="160" height="85" rx="6" fill="rgba(255,45,122,0.06)" stroke="rgba(255,45,122,0.15)" stroke-width="1"/>
  <text x="995" y="260" fill="#F5F2EC" font-size="11" font-weight="bold">Trigger Config</text>
  <text x="995" y="280" fill="#9A968C" font-size="9">Type: Webhook</text>
  <text x="995" y="297" fill="#9A968C" font-size="9">Method: POST</text>
  <text x="995" y="314" fill="#FF2D7A" font-size="9">Auth: API Key Required</text>

  <!-- Error Handling -->
  <rect x="980" y="335" width="160" height="85" rx="6" fill="rgba(245,242,236,0.04)" stroke="rgba(245,242,236,0.08)" stroke-width="1"/>
  <text x="995" y="360" fill="#F5F2EC" font-size="11" font-weight="bold">Error Handling</text>
  <text x="995" y="380" fill="#9A968C" font-size="9">Retry: 3 attempts</text>
  <text x="995" y="397" fill="#9A968C" font-size="9">Backoff: Exponential</text>
  <text x="995" y="414" fill="#8FA373" font-size="9">Alert: Slack on failure</text>

  <!-- Execution Log -->
  <rect x="980" y="435" width="160" height="165" rx="6" fill="rgba(245,242,236,0.04)" stroke="rgba(245,242,236,0.08)" stroke-width="1"/>
  <text x="995" y="460" fill="#F5F2EC" font-size="11" font-weight="bold">Recent Executions</text>

  <rect x="990" y="475" width="140" height="28" rx="4" fill="rgba(143,163,115,0.08)"/>
  <text x="998" y="488" fill="#8FA373" font-size="9">2 min ago</text>
  <text x="998" y="498" fill="#8FA373" font-size="8">✓ Success (1.1s)</text>

  <rect x="990" y="510" width="140" height="28" rx="4" fill="rgba(143,163,115,0.08)"/>
  <text x="998" y="523" fill="#8FA373" font-size="9">5 min ago</text>
  <text x="998" y="533" fill="#8FA373" font-size="8">✓ Success (0.9s)</text>

  <rect x="990" y="545" width="140" height="28" rx="4" fill="rgba(143,163,115,0.08)"/>
  <text x="998" y="558" fill="#8FA373" font-size="9">8 min ago</text>
  <text x="998" y="568" fill="#8FA373" font-size="8">✓ Success (1.3s)</text>

  <rect x="990" y="580" width="140" height="12" rx="3" fill="rgba(255,45,122,0.12)"/>
  <text x="998" y="589" fill="#FF2D7A" font-size="8">View all executions →</text>

  <!-- Stats Footer -->
  <rect x="40" y="625" width="1120" height="35" rx="6" fill="rgba(255,45,122,0.06)" stroke="rgba(255,45,122,0.2)" stroke-width="1"/>
  <text x="60" y="647" fill="#9A968C" font-size="11">Active Workflows:</text>
  <text x="220" y="647" fill="#FF2D7A" font-size="11" font-weight="bold">8 Workflows</text>
  <text x="380" y="647" fill="#8FA373" font-size="11">2,345 Total Executions</text>
  <text x="620" y="647" fill="#8FA373" font-size="11">15h Saved This Week</text>
  <text x="880" y="647" fill="#9A968C" font-size="11">99.7% Uptime</text>
</svg>
