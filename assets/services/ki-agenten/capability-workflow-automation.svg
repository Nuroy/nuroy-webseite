<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="800" fill="#0d0d0d"/>

  <!-- Card Container with pink glow -->
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="20" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#ff2d87"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="1120" height="720" rx="18" fill="#1a1a1a" stroke="rgba(255, 45, 135, 0.3)" stroke-width="1" filter="url(#glow)"/>

  <!-- Eyebrow -->
  <text x="80" y="90" font-family="monospace" font-size="10" fill="#ff2d87" letter-spacing="0.08em">WORKFLOW AUTOMATION ENGINE</text>

  <!-- Main Grid -->
  <!-- Left Column: Workflow Diagram -->
  <rect x="80" y="120" width="680" height="560" rx="12" fill="#0d0d0d" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>

  <!-- Workflow Title -->
  <text x="100" y="150" font-family="sans-serif" font-size="14" fill="#f5f1e8" font-weight="600">Lead-to-CRM Automation</text>
  <rect x="590" y="135" width="140" height="24" rx="6" fill="rgba(184, 209, 138, 0.15)"/>
  <circle cx="603" cy="147" r="3" fill="#b8d18a"/>
  <text x="613" y="151" font-family="monospace" font-size="10" fill="#b8d18a">AKTIV</text>

  <!-- Step 1: Trigger -->
  <rect x="140" y="190" width="140" height="70" rx="8" fill="rgba(255, 45, 135, 0.1)" stroke="#ff2d87" stroke-width="2"/>
  <text x="210" y="215" font-family="monospace" font-size="9" fill="#ff2d87" font-weight="600" text-anchor="middle">TRIGGER</text>
  <text x="210" y="235" font-family="sans-serif" font-size="12" fill="#f5f1e8" text-anchor="middle">Neue Lead-</text>
  <text x="210" y="250" font-family="sans-serif" font-size="12" fill="#f5f1e8" text-anchor="middle">Anfrage erhalten</text>

  <!-- Arrow 1 -->
  <line x1="210" y1="260" x2="210" y2="300" stroke="#ff2d87" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Step 2: Enrichment -->
  <rect x="140" y="300" width="140" height="70" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
  <text x="210" y="325" font-family="monospace" font-size="9" fill="rgba(245, 241, 232, 0.5)" font-weight="600" text-anchor="middle">KI-ANALYSE</text>
  <text x="210" y="345" font-family="sans-serif" font-size="12" fill="#f5f1e8" text-anchor="middle">Firmendaten</text>
  <text x="210" y="360" font-family="sans-serif" font-size="12" fill="#f5f1e8" text-anchor="middle">anreichern</text>

  <!-- Arrow 2 -->
  <line x1="210" y1="370" x2="210" y2="410" stroke="#ff2d87" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Step 3: Scoring -->
  <rect x="140" y="410" width="140" height="70" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
  <text x="210" y="435" font-family="monospace" font-size="9" fill="rgba(245, 241, 232, 0.5)" font-weight="600" text-anchor="middle">KI-SCORING</text>
  <text x="210" y="455" font-family="sans-serif" font-size="12" fill="#f5f1e8" text-anchor="middle">Lead bewerten</text>
  <text x="210" y="470" font-family="sans-serif" font-size="12" fill="#f5f1e8" text-anchor="middle">(0-100)</text>

  <!-- Arrow 3 - Branches -->
  <line x1="210" y1="480" x2="210" y2="520" stroke="#ff2d87" stroke-width="2"/>
  <line x1="210" y1="520" x2="390" y2="520" stroke="#ff2d87" stroke-width="2"/>
  <line x1="390" y1="520" x2="390" y2="540" stroke="#ff2d87" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="210" y1="520" x2="550" y2="520" stroke="#ff2d87" stroke-width="2"/>
  <line x1="550" y1="520" x2="550" y2="540" stroke="#ff2d87" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Decision Box -->
  <rect x="180" y="505" width="60" height="30" rx="4" fill="rgba(245, 193, 78, 0.15)"/>
  <text x="210" y="525" font-family="monospace" font-size="9" fill="#f5c14e" text-anchor="middle">IF/ELSE</text>

  <!-- Branch 1: Hot Lead -->
  <rect x="320" y="540" width="140" height="70" rx="8" fill="rgba(184, 209, 138, 0.1)" stroke="#b8d18a" stroke-width="2"/>
  <text x="390" y="565" font-family="monospace" font-size="9" fill="#b8d18a" font-weight="600" text-anchor="middle">SCORE ≥ 80</text>
  <text x="390" y="585" font-family="sans-serif" font-size="12" fill="#f5f1e8" text-anchor="middle">CRM eintragen +</text>
  <text x="390" y="600" font-family="sans-serif" font-size="12" fill="#f5f1e8" text-anchor="middle">Sales benachrichtigen</text>

  <!-- Branch 2: Cold Lead -->
  <rect x="480" y="540" width="140" height="70" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
  <text x="550" y="565" font-family="monospace" font-size="9" fill="rgba(245, 241, 232, 0.5)" font-weight="600" text-anchor="middle">SCORE &lt; 80</text>
  <text x="550" y="585" font-family="sans-serif" font-size="12" fill="#f5f1e8" text-anchor="middle">In Nurture-Liste</text>
  <text x="550" y="600" font-family="sans-serif" font-size="12" fill="#f5f1e8" text-anchor="middle">eintragen</text>

  <!-- Final Arrow -->
  <line x1="390" y1="610" x2="390" y2="630" stroke="#b8d18a" stroke-width="2"/>
  <line x1="390" y1="630" x2="470" y2="630" stroke="#b8d18a" stroke-width="2"/>
  <line x1="550" y1="610" x2="550" y2="630" stroke="rgba(255, 255, 255, 0.3)" stroke-width="2"/>
  <line x1="470" y1="630" x2="550" y2="630" stroke="rgba(255, 255, 255, 0.3)" stroke-width="2"/>
  <line x1="470" y1="630" x2="470" y2="650" stroke="#ff2d87" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Final Step: Complete -->
  <rect x="400" y="650" width="140" height="50" rx="8" fill="rgba(184, 209, 138, 0.1)" stroke="#b8d18a" stroke-width="2"/>
  <text x="470" y="680" font-family="sans-serif" font-size="13" fill="#b8d18a" font-weight="600" text-anchor="middle">✓ Workflow</text>
  <text x="470" y="695" font-family="sans-serif" font-size="13" fill="#b8d18a" font-weight="600" text-anchor="middle">abgeschlossen</text>

  <!-- Stats Overlay -->
  <rect x="100" y="610" width="200" height="60" rx="8" fill="rgba(0, 0, 0, 0.7)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
  <text x="115" y="630" font-family="monospace" font-size="9" fill="rgba(245, 241, 232, 0.5)">Heute ausgeführt:</text>
  <text x="115" y="650" font-family="monospace" font-size="16" fill="#ff2d87" font-weight="700">142×</text>
  <text x="115" y="665" font-family="monospace" font-size="9" fill="rgba(245, 241, 232, 0.5)">Ø Dauer: 2.3s</text>

  <!-- Right Column: Sidebar -->
  <!-- Execution Stats Card -->
  <rect x="780" y="120" width="340" height="160" rx="12" fill="#0d0d0d" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
  <text x="800" y="145" font-family="monospace" font-size="9" fill="rgba(245, 241, 232, 0.5)" letter-spacing="0.05em">EXECUTION STATS</text>

  <text x="800" y="175" font-family="monospace" font-size="10" fill="rgba(245, 241, 232, 0.5)">Erfolgreich abgeschlossen</text>
  <text x="800" y="195" font-family="monospace" font-size="18" fill="#b8d18a" font-weight="700">8.472</text>

  <text x="800" y="225" font-family="monospace" font-size="10" fill="rgba(245, 241, 232, 0.5)">Erfolgsrate</text>
  <text x="800" y="245" font-family="monospace" font-size="18" fill="#ff2d87" font-weight="700">98.7%</text>

  <text x="800" y="270" font-family="monospace" font-size="10" fill="rgba(245, 241, 232, 0.5)">Ø Ausführungszeit</text>
  <text x="1100" y="270" font-family="monospace" font-size="14" fill="#f5f1e8" font-weight="700" text-anchor="end">2.1s</text>

  <!-- Active Workflows Card -->
  <rect x="780" y="300" width="340" height="180" rx="12" fill="#0d0d0d" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
  <text x="800" y="325" font-family="monospace" font-size="9" fill="rgba(245, 241, 232, 0.5)" letter-spacing="0.05em">AKTIVE WORKFLOWS</text>

  <!-- Workflow 1 -->
  <rect x="800" y="340" width="300" height="35" rx="6" fill="rgba(184, 209, 138, 0.08)"/>
  <circle cx="815" cy="357" r="4" fill="#b8d18a"/>
  <text x="830" y="354" font-family="sans-serif" font-size="11" fill="#f5f1e8" font-weight="600">Lead-to-CRM</text>
  <text x="830" y="367" font-family="monospace" font-size="9" fill="rgba(245, 241, 232, 0.5)">142 heute • 98.7% Erfolg</text>

  <!-- Workflow 2 -->
  <rect x="800" y="385" width="300" height="35" rx="6" fill="rgba(184, 209, 138, 0.08)"/>
  <circle cx="815" cy="402" r="4" fill="#b8d18a"/>
  <text x="830" y="399" font-family="sans-serif" font-size="11" fill="#f5f1e8" font-weight="600">Contract-Approval</text>
  <text x="830" y="412" font-family="monospace" font-size="9" fill="rgba(245, 241, 232, 0.5)">23 heute • 100% Erfolg</text>

  <!-- Workflow 3 -->
  <rect x="800" y="430" width="300" height="35" rx="6" fill="rgba(184, 209, 138, 0.08)"/>
  <circle cx="815" cy="447" r="4" fill="#b8d18a"/>
  <text x="830" y="444" font-family="sans-serif" font-size="11" fill="#f5f1e8" font-weight="600">Invoice-Processing</text>
  <text x="830" y="457" font-family="monospace" font-size="9" fill="rgba(245, 241, 232, 0.5)">87 heute • 99.2% Erfolg</text>

  <!-- System Health Card -->
  <rect x="780" y="500" width="340" height="180" rx="12" fill="#0d0d0d" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
  <text x="800" y="525" font-family="monospace" font-size="9" fill="rgba(245, 241, 232, 0.5)" letter-spacing="0.05em">SYSTEM HEALTH</text>

  <text x="800" y="555" font-family="monospace" font-size="10" fill="rgba(245, 241, 232, 0.5)">API-Verbindungen</text>
  <rect x="800" y="562" width="300" height="8" rx="4" fill="rgba(255, 255, 255, 0.05)"/>
  <rect x="800" y="562" width="300" height="8" rx="4" fill="#b8d18a"/>
  <text x="1005" y="570" font-family="monospace" font-size="9" fill="#b8d18a" text-anchor="end">100%</text>

  <text x="800" y="595" font-family="monospace" font-size="10" fill="rgba(245, 241, 232, 0.5)">Workflow-Queue</text>
  <rect x="800" y="602" width="300" height="8" rx="4" fill="rgba(255, 255, 255, 0.05)"/>
  <rect x="800" y="602" width="90" height="8" rx="4" fill="#ff2d87"/>
  <text x="1005" y="610" font-family="monospace" font-size="9" fill="#ff2d87" text-anchor="end">30%</text>

  <text x="800" y="635" font-family="monospace" font-size="10" fill="rgba(245, 241, 232, 0.5)">Fehlerrate (24h)</text>
  <text x="1100" y="655" font-family="monospace" font-size="18" fill="#b8d18a" font-weight="700" text-anchor="end">0.3%</text>

  <!-- Insights Row -->
  <!-- Green Box -->
  <rect x="80" y="700" width="340" height="50" rx="8" fill="rgba(184, 209, 138, 0.1)" stroke="rgba(184, 209, 138, 0.3)" stroke-width="1"/>
  <text x="100" y="730" font-family="sans-serif" font-size="12" fill="#b8d18a">↑ 8.472 Workflows automatisch ausgeführt</text>

  <!-- Pink Box -->
  <rect x="440" y="700" width="340" height="50" rx="8" fill="rgba(255, 45, 135, 0.1)" stroke="rgba(255, 45, 135, 0.3)" stroke-width="1"/>
  <text x="460" y="730" font-family="sans-serif" font-size="12" fill="#ff2d87">Zeitersparnis heute: ~28h manuelle Arbeit</text>

  <!-- Yellow Box -->
  <rect x="800" y="700" width="320" height="50" rx="8" fill="rgba(245, 193, 78, 0.1)" stroke="rgba(245, 193, 78, 0.3)" stroke-width="1"/>
  <text x="820" y="730" font-family="sans-serif" font-size="12" fill="#f5c14e">Queue bei 30% — System läuft optimal</text>

  <!-- Tag Footer -->
  <text x="80" y="785" font-family="monospace" font-size="10" fill="rgba(245, 241, 232, 0.5)">Features:</text>
  <text x="145" y="785" font-family="monospace" font-size="10" fill="rgba(245, 241, 232, 0.7)">Visual Builder · Conditional Logic · API Integrations · Error Handling · Scheduling</text>
</svg>
