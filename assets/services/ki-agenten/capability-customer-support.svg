<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><path fill="#0d0d0d" d="M0 0h1200v800H0z"/><defs><filter id="a"><feGaussianBlur result="coloredBlur" stdDeviation="20"/><feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1120" height="720" x="40" y="40" fill="#1a1a1a" stroke="rgba(255, 45, 135, 0.3)" filter="url(#a)" rx="18"/><text x="80" y="90" fill="#ff2d87" font-family="monospace" font-size="10" letter-spacing=".08em">CUSTOMER SUPPORT AGENT</text><rect width="680" height="560" x="80" y="120" fill="#0d0d0d" stroke="rgba(255, 255, 255, 0.06)" rx="12"/><rect width="680" height="50" x="80" y="120" fill="rgba(255, 255, 255, 0.02)" rx="12"/><text x="100" y="150" fill="#f5f1e8" font-family="sans-serif" font-size="14" font-weight="600">Sarah Meier • TechFlow GmbH</text><rect width="100" height="20" x="640" y="135" fill="rgba(184, 209, 138, 0.15)" rx="10"/><circle cx="650" cy="145" r="3" fill="#b8d18a"/><text x="660" y="149" fill="#b8d18a" font-family="monospace" font-size="10">GELÖST</text><rect width="520" height="70" x="100" y="190" fill="rgba(255, 255, 255, 0.03)" rx="8"/><text x="120" y="210" fill="rgba(245, 241, 232, 0.5)" font-family="monospace" font-size="9">Sarah Meier • 14:23</text><text x="120" y="230" fill="#f5f1e8" font-family="sans-serif" font-size="13">Hallo, ich habe Probleme beim Export der Dashboard-Daten.</text><text x="120" y="248" fill="#f5f1e8" font-family="sans-serif" font-size="13">Die CSV-Datei ist leer, obwohl Daten angezeigt werden.</text><rect width="570" height="90" x="150" y="280" fill="rgba(255, 45, 135, 0.08)" stroke="rgba(255, 45, 135, 0.2)" rx="8"/><text x="170" y="300" fill="#ff2d87" font-family="monospace" font-size="9">KI-Agent • 14:23</text><text x="170" y="320" fill="#f5f1e8" font-family="sans-serif" font-size="13">Hallo Sarah! Ich habe das Problem identifiziert. Bei Dashboards mit</text><text x="170" y="338" fill="#f5f1e8" font-family="sans-serif" font-size="13">mehr als 10.000 Datenpunkten muss der Export über &quot;Export → Erweitert&quot;</text><text x="170" y="356" fill="#f5f1e8" font-family="sans-serif" font-size="13">gestartet werden. Ich habe dir ein kurzes Video erstellt:</text><rect width="200" height="30" x="170" y="365" fill="rgba(255, 45, 135, 0.15)" stroke="rgba(255, 45, 135, 0.3)" rx="6"/><text x="180" y="385" fill="#ff2d87" font-family="monospace" font-size="11">▶ Anleitung ansehen (45s)</text><rect width="520" height="50" x="100" y="390" fill="rgba(255, 255, 255, 0.03)" rx="8"/><text x="120" y="410" fill="rgba(245, 241, 232, 0.5)" font-family="monospace" font-size="9">Sarah Meier • 14:25</text><text x="120" y="430" fill="#f5f1e8" font-family="sans-serif" font-size="13">Perfekt, das hat funktioniert! Vielen Dank 🎉</text><rect width="570" height="70" x="150" y="460" fill="rgba(255, 45, 135, 0.08)" stroke="rgba(255, 45, 135, 0.2)" rx="8"/><text x="170" y="480" fill="#ff2d87" font-family="monospace" font-size="9">KI-Agent • 14:26</text><text x="170" y="500" fill="#f5f1e8" font-family="sans-serif" font-size="13">Sehr gerne! Ich habe das Ticket als &quot;gelöst&quot; markiert und die Lösung</text><text x="170" y="518" fill="#f5f1e8" font-family="sans-serif" font-size="13">in unsere Knowledge Base aufgenommen. Brauchst du noch etwas? 😊</text><rect width="140" height="24" x="100" y="550" fill="rgba(184, 209, 138, 0.1)" rx="6"/><text x="110" y="567" fill="#b8d18a" font-family="monospace" font-size="10">😊 Sentiment: Positiv</text><rect width="120" height="24" x="260" y="550" fill="rgba(255, 255, 255, 0.05)" rx="6"/><text x="270" y="567" fill="rgba(245, 241, 232, 0.7)" font-family="monospace" font-size="10">⏱ Gelöst in 3min</text><rect width="640" height="30" x="100" y="640" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.06)" rx="6"/><text x="115" y="660" fill="rgba(245, 241, 232, 0.3)" font-family="sans-serif" font-size="12">Nachricht eingeben...</text><rect width="340" height="160" x="780" y="120" fill="#0d0d0d" stroke="rgba(255, 255, 255, 0.06)" rx="12"/><text x="800" y="145" fill="rgba(245, 241, 232, 0.5)" font-family="monospace" font-size="9" letter-spacing=".05em">TICKET INFORMATION</text><text x="800" y="175" fill="rgba(245, 241, 232, 0.5)" font-family="monospace" font-size="10">Ticket-ID</text><text x="800" y="195" fill="#f5f1e8" font-family="monospace" font-size="14" font-weight="700">#SUP-2847</text><text x="800" y="225" fill="rgba(245, 241, 232, 0.5)" font-family="monospace" font-size="10">Kategorie</text><text x="800" y="245" fill="rgba(245, 241, 232, 0.7)" font-family="sans-serif" font-size="13">Export / Daten</text><text x="800" y="270" fill="rgba(245, 241, 232, 0.5)" font-family="monospace" font-size="10">Priorität</text><rect width="60" height="20" x="800" y="277" fill="rgba(245, 193, 78, 0.15)" rx="4"/><text x="830" y="291" fill="#f5c14e" font-family="monospace" font-size="10" text-anchor="middle">MITTEL</text><rect width="340" height="180" x="780" y="300" fill="#0d0d0d" stroke="rgba(255, 255, 255, 0.06)" rx="12"/><text x="800" y="325" fill="rgba(245, 241, 232, 0.5)" font-family="monospace" font-size="9" letter-spacing=".05em">AGENT PERFORMANCE</text><text x="800" y="355" fill="rgba(245, 241, 232, 0.5)" font-family="monospace" font-size="10">Lösungsrate</text><rect width="300" height="8" x="800" y="362" fill="rgba(255, 255, 255, 0.05)" rx="4"/><rect width="276" height="8" x="800" y="362" fill="#b8d18a" rx="4"/><text x="1005" y="370" fill="#b8d18a" font-family="monospace" font-size="9" text-anchor="end">92%</text><text x="800" y="395" fill="rgba(245, 241, 232, 0.5)" font-family="monospace" font-size="10">Kundenzufriedenheit</text><rect width="300" height="8" x="800" y="402" fill="rgba(255, 255, 255, 0.05)" rx="4"/><rect width="267" height="8" x="800" y="402" fill="#ff2d87" rx="4"/><text x="1005" y="410" fill="#ff2d87" font-family="monospace" font-size="9" text-anchor="end">89%</text><text x="800" y="435" fill="rgba(245, 241, 232, 0.5)" font-family="monospace" font-size="10">Ø Antwortzeit</text><text x="1100" y="455" fill="#f5f1e8" font-family="monospace" font-size="18" font-weight="700" text-anchor="end">18s</text><rect width="340" height="80" x="780" y="500" fill="#0d0d0d" stroke="rgba(255, 255, 255, 0.06)" rx="12"/><text x="800" y="525" fill="rgba(245, 241, 232, 0.5)" font-family="monospace" font-size="9" letter-spacing=".05em">KNOWLEDGE BASE</text><text x="800" y="555" fill="rgba(245, 241, 232, 0.5)" font-family="monospace" font-size="10">Artikel gefunden</text><text x="1100" y="555" fill="#ff2d87" font-family="monospace" font-size="14" font-weight="700" text-anchor="end">1.243</text><rect width="340" height="50" x="80" y="700" fill="rgba(184, 209, 138, 0.1)" stroke="rgba(184, 209, 138, 0.3)" rx="8"/><text x="100" y="730" fill="#b8d18a" font-family="sans-serif" font-size="12">↑ Lösungsrate +8% seit letztem Monat</text><rect width="340" height="50" x="440" y="700" fill="rgba(255, 45, 135, 0.1)" stroke="rgba(255, 45, 135, 0.3)" rx="8"/><text x="460" y="730" fill="#ff2d87" font-family="sans-serif" font-size="12">47 Tickets heute automatisch gelöst</text><rect width="320" height="50" x="800" y="700" fill="rgba(245, 193, 78, 0.1)" stroke="rgba(245, 193, 78, 0.3)" rx="8"/><text x="820" y="730" fill="#f5c14e" font-family="sans-serif" font-size="12">2 komplexe Fälle an Team eskaliert</text><text x="80" y="785" fill="rgba(245, 241, 232, 0.5)" font-family="monospace" font-size="10">Features:</text><text x="145" y="785" fill="rgba(245, 241, 232, 0.7)" font-family="monospace" font-size="10">Auto-Response · Sentiment Analysis · Knowledge Base · Ticket Routing · Multi-Channel</text></svg>