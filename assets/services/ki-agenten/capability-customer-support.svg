<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="800" fill="#0d0d0d"/>

  <!-- Card Container with pink glow -->
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="20" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="40" y="40" width="1120" height="720" rx="18" fill="#1a1a1a" stroke="rgba(255, 45, 135, 0.3)" stroke-width="1" filter="url(#glow)"/>

  <!-- Eyebrow -->
  <text x="80" y="90" font-family="monospace" font-size="10" fill="#ff2d87" letter-spacing="0.08em">CUSTOMER SUPPORT AGENT</text>

  <!-- Main Grid -->
  <!-- Left Column: Chat View -->
  <rect x="80" y="120" width="680" height="560" rx="12" fill="#0d0d0d" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>

  <!-- Chat Header -->
  <rect x="80" y="120" width="680" height="50" rx="12" fill="rgba(255, 255, 255, 0.02)"/>
  <text x="100" y="150" font-family="sans-serif" font-size="14" fill="#f5f1e8" font-weight="600">Sarah Meier • TechFlow GmbH</text>
  <rect x="640" y="135" width="100" height="20" rx="10" fill="rgba(184, 209, 138, 0.15)"/>
  <circle cx="650" cy="145" r="3" fill="#b8d18a"/>
  <text x="660" y="149" font-family="monospace" font-size="10" fill="#b8d18a">GELÖST</text>

  <!-- User Message 1 -->
  <rect x="100" y="190" width="520" height="70" rx="8" fill="rgba(255, 255, 255, 0.03)"/>
  <text x="120" y="210" font-family="monospace" font-size="9" fill="rgba(245, 241, 232, 0.5)">Sarah Meier • 14:23</text>
  <text x="120" y="230" font-family="sans-serif" font-size="13" fill="#f5f1e8">Hallo, ich habe Probleme beim Export der Dashboard-Daten.</text>
  <text x="120" y="248" font-family="sans-serif" font-size="13" fill="#f5f1e8">Die CSV-Datei ist leer, obwohl Daten angezeigt werden.</text>

  <!-- AI Agent Message 1 -->
  <rect x="150" y="280" width="570" height="90" rx="8" fill="rgba(255, 45, 135, 0.08)" stroke="rgba(255, 45, 135, 0.2)" stroke-width="1"/>
  <text x="170" y="300" font-family="monospace" font-size="9" fill="#ff2d87">KI-Agent • 14:23</text>
  <text x="170" y="320" font-family="sans-serif" font-size="13" fill="#f5f1e8">Hallo Sarah! Ich habe das Problem identifiziert. Bei Dashboards mit</text>
  <text x="170" y="338" font-family="sans-serif" font-size="13" fill="#f5f1e8">mehr als 10.000 Datenpunkten muss der Export über "Export → Erweitert"</text>
  <text x="170" y="356" font-family="sans-serif" font-size="13" fill="#f5f1e8">gestartet werden. Ich habe dir ein kurzes Video erstellt:</text>

  <!-- Video Link -->
  <rect x="170" y="365" width="200" height="30" rx="6" fill="rgba(255, 45, 135, 0.15)" stroke="rgba(255, 45, 135, 0.3)" stroke-width="1"/>
  <text x="180" y="385" font-family="monospace" font-size="11" fill="#ff2d87">▶ Anleitung ansehen (45s)</text>

  <!-- User Message 2 -->
  <rect x="100" y="390" width="520" height="50" rx="8" fill="rgba(255, 255, 255, 0.03)"/>
  <text x="120" y="410" font-family="monospace" font-size="9" fill="rgba(245, 241, 232, 0.5)">Sarah Meier • 14:25</text>
  <text x="120" y="430" font-family="sans-serif" font-size="13" fill="#f5f1e8">Perfekt, das hat funktioniert! Vielen Dank 🎉</text>

  <!-- AI Agent Message 2 -->
  <rect x="150" y="460" width="570" height="70" rx="8" fill="rgba(255, 45, 135, 0.08)" stroke="rgba(255, 45, 135, 0.2)" stroke-width="1"/>
  <text x="170" y="480" font-family="monospace" font-size="9" fill="#ff2d87">KI-Agent • 14:26</text>
  <text x="170" y="500" font-family="sans-serif" font-size="13" fill="#f5f1e8">Sehr gerne! Ich habe das Ticket als "gelöst" markiert und die Lösung</text>
  <text x="170" y="518" font-family="sans-serif" font-size="13" fill="#f5f1e8">in unsere Knowledge Base aufgenommen. Brauchst du noch etwas? 😊</text>

  <!-- Sentiment Badge -->
  <rect x="100" y="550" width="140" height="24" rx="6" fill="rgba(184, 209, 138, 0.1)"/>
  <text x="110" y="567" font-family="monospace" font-size="10" fill="#b8d18a">😊 Sentiment: Positiv</text>

  <!-- Resolution Time -->
  <rect x="260" y="550" width="120" height="24" rx="6" fill="rgba(255, 255, 255, 0.05)"/>
  <text x="270" y="567" font-family="monospace" font-size="10" fill="rgba(245, 241, 232, 0.7)">⏱ Gelöst in 3min</text>

  <!-- Input Field -->
  <rect x="100" y="640" width="640" height="30" rx="6" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
  <text x="115" y="660" font-family="sans-serif" font-size="12" fill="rgba(245, 241, 232, 0.3)">Nachricht eingeben...</text>

  <!-- Right Column: Sidebar -->
  <!-- Ticket Info Card -->
  <rect x="780" y="120" width="340" height="160" rx="12" fill="#0d0d0d" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
  <text x="800" y="145" font-family="monospace" font-size="9" fill="rgba(245, 241, 232, 0.5)" letter-spacing="0.05em">TICKET INFORMATION</text>

  <text x="800" y="175" font-family="monospace" font-size="10" fill="rgba(245, 241, 232, 0.5)">Ticket-ID</text>
  <text x="800" y="195" font-family="monospace" font-size="14" fill="#f5f1e8" font-weight="700">#SUP-2847</text>

  <text x="800" y="225" font-family="monospace" font-size="10" fill="rgba(245, 241, 232, 0.5)">Kategorie</text>
  <text x="800" y="245" font-family="sans-serif" font-size="13" fill="rgba(245, 241, 232, 0.7)">Export / Daten</text>

  <text x="800" y="270" font-family="monospace" font-size="10" fill="rgba(245, 241, 232, 0.5)">Priorität</text>
  <rect x="800" y="277" width="60" height="20" rx="4" fill="rgba(245, 193, 78, 0.15)"/>
  <text x="830" y="291" font-family="monospace" font-size="10" fill="#f5c14e" text-anchor="middle">MITTEL</text>

  <!-- Agent Performance Card -->
  <rect x="780" y="300" width="340" height="180" rx="12" fill="#0d0d0d" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
  <text x="800" y="325" font-family="monospace" font-size="9" fill="rgba(245, 241, 232, 0.5)" letter-spacing="0.05em">AGENT PERFORMANCE</text>

  <text x="800" y="355" font-family="monospace" font-size="10" fill="rgba(245, 241, 232, 0.5)">Lösungsrate</text>
  <rect x="800" y="362" width="300" height="8" rx="4" fill="rgba(255, 255, 255, 0.05)"/>
  <rect x="800" y="362" width="276" height="8" rx="4" fill="#b8d18a"/>
  <text x="1005" y="370" font-family="monospace" font-size="9" fill="#b8d18a" text-anchor="end">92%</text>

  <text x="800" y="395" font-family="monospace" font-size="10" fill="rgba(245, 241, 232, 0.5)">Kundenzufriedenheit</text>
  <rect x="800" y="402" width="300" height="8" rx="4" fill="rgba(255, 255, 255, 0.05)"/>
  <rect x="800" y="402" width="267" height="8" rx="4" fill="#ff2d87"/>
  <text x="1005" y="410" font-family="monospace" font-size="9" fill="#ff2d87" text-anchor="end">89%</text>

  <text x="800" y="435" font-family="monospace" font-size="10" fill="rgba(245, 241, 232, 0.5)">Ø Antwortzeit</text>
  <text x="1100" y="455" font-family="monospace" font-size="18" fill="#f5f1e8" font-weight="700" text-anchor="end">18s</text>

  <!-- Knowledge Base Usage Card -->
  <rect x="780" y="500" width="340" height="80" rx="12" fill="#0d0d0d" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
  <text x="800" y="525" font-family="monospace" font-size="9" fill="rgba(245, 241, 232, 0.5)" letter-spacing="0.05em">KNOWLEDGE BASE</text>

  <text x="800" y="555" font-family="monospace" font-size="10" fill="rgba(245, 241, 232, 0.5)">Artikel gefunden</text>
  <text x="1100" y="555" font-family="monospace" font-size="14" fill="#ff2d87" font-weight="700" text-anchor="end">1.243</text>

  <!-- Insights Row -->
  <!-- Green Box -->
  <rect x="80" y="700" width="340" height="50" rx="8" fill="rgba(184, 209, 138, 0.1)" stroke="rgba(184, 209, 138, 0.3)" stroke-width="1"/>
  <text x="100" y="730" font-family="sans-serif" font-size="12" fill="#b8d18a">↑ Lösungsrate +8% seit letztem Monat</text>

  <!-- Pink Box -->
  <rect x="440" y="700" width="340" height="50" rx="8" fill="rgba(255, 45, 135, 0.1)" stroke="rgba(255, 45, 135, 0.3)" stroke-width="1"/>
  <text x="460" y="730" font-family="sans-serif" font-size="12" fill="#ff2d87">47 Tickets heute automatisch gelöst</text>

  <!-- Yellow Box -->
  <rect x="800" y="700" width="320" height="50" rx="8" fill="rgba(245, 193, 78, 0.1)" stroke="rgba(245, 193, 78, 0.3)" stroke-width="1"/>
  <text x="820" y="730" font-family="sans-serif" font-size="12" fill="#f5c14e">2 komplexe Fälle an Team eskaliert</text>

  <!-- Tag Footer -->
  <text x="80" y="785" font-family="monospace" font-size="10" fill="rgba(245, 241, 232, 0.5)">Features:</text>
  <text x="145" y="785" font-family="monospace" font-size="10" fill="rgba(245, 241, 232, 0.7)">Auto-Response · Sentiment Analysis · Knowledge Base · Ticket Routing · Multi-Channel</text>
</svg>
