<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="800" fill="#0d0d0d"/>

  <!-- Card Container with pink glow -->
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="20" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="chartGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff2d87" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ff2d87" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="40" y="40" width="1120" height="720" rx="18" fill="#1a1a1a" stroke="rgba(255, 45, 135, 0.3)" stroke-width="1" filter="url(#glow)"/>

  <!-- Eyebrow -->
  <text x="80" y="90" font-family="monospace" font-size="10" fill="#ff2d87" letter-spacing="0.08em">DATA ANALYSIS AGENT</text>

  <!-- Main Grid -->
  <!-- Left Column: Chart Area -->
  <rect x="80" y="120" width="680" height="560" rx="12" fill="#0d0d0d" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>

  <!-- Chart Header -->
  <text x="100" y="150" font-family="sans-serif" font-size="14" fill="#f5f1e8" font-weight="600">Revenue-Anomalie-Analyse • Mai 2026</text>
  <rect x="600" y="135" width="140" height="24" rx="6" fill="rgba(255, 45, 135, 0.15)"/>
  <text x="615" y="151" font-family="monospace" font-size="10" fill="#ff2d87">3 Anomalien erkannt</text>

  <!-- Chart Area -->
  <svg x="100" y="170" width="640" height="280" viewBox="0 0 640 280">
    <!-- Grid Lines -->
    <line x1="0" y1="0" x2="640" y2="0" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
    <line x1="0" y1="70" x2="640" y2="70" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
    <line x1="0" y1="140" x2="640" y2="140" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
    <line x1="0" y1="210" x2="640" y2="210" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
    <line x1="0" y1="280" x2="640" y2="280" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>

    <!-- Y-Axis Labels -->
    <text x="5" y="8" font-family="monospace" font-size="9" fill="rgba(245, 241, 232, 0.4)">€100k</text>
    <text x="5" y="78" font-family="monospace" font-size="9" fill="rgba(245, 241, 232, 0.4)">€75k</text>
    <text x="5" y="148" font-family="monospace" font-size="9" fill="rgba(245, 241, 232, 0.4)">€50k</text>
    <text x="5" y="218" font-family="monospace" font-size="9" fill="rgba(245, 241, 232, 0.4)">€25k</text>
    <text x="5" y="278" font-family="monospace" font-size="9" fill="rgba(245, 241, 232, 0.4)">€0</text>

    <!-- Historical Data (Green Line) -->
    <path d="M 60 160 L 120 155 L 180 150 L 240 148 L 300 145 L 360 143 L 420 140 L 480 138 L 540 135 L 600 132"
          stroke="#b8d18a" stroke-width="2" fill="none" opacity="0.5" stroke-dasharray="5,5"/>

    <!-- Actual Data (Pink Line with Area Fill) -->
    <path d="M 60 160 L 120 155 L 180 148 L 240 85 L 300 90 L 360 142 L 420 135 L 480 55 L 540 60 L 600 130
             L 600 280 L 60 280 Z"
          fill="url(#chartGradient)"/>
    <path d="M 60 160 L 120 155 L 180 148 L 240 85 L 300 90 L 360 142 L 420 135 L 480 55 L 540 60 L 600 130"
          stroke="#ff2d87" stroke-width="3" fill="none"/>

    <!-- Anomaly Markers -->
    <!-- Anomaly 1 -->
    <circle cx="240" cy="85" r="8" fill="rgba(255, 45, 135, 0.2)" stroke="#ff2d87" stroke-width="2"/>
    <circle cx="240" cy="85" r="12" fill="none" stroke="#ff2d87" stroke-width="1" opacity="0.5"/>
    <line x1="240" y1="85" x2="240" y2="30" stroke="#ff2d87" stroke-width="1" stroke-dasharray="3,3"/>
    <rect x="180" y="10" width="120" height="22" rx="4" fill="rgba(255, 45, 135, 0.2)"/>
    <text x="240" y="25" font-family="monospace" font-size="9" fill="#ff2d87" text-anchor="middle">↑ +45% Spike</text>

    <!-- Anomaly 2 -->
    <circle cx="360" cy="142" r="8" fill="rgba(245, 193, 78, 0.2)" stroke="#f5c14e" stroke-width="2"/>
    <circle cx="360" cy="142" r="12" fill="none" stroke="#f5c14e" stroke-width="1" opacity="0.5"/>

    <!-- Anomaly 3 -->
    <circle cx="480" cy="55" r="8" fill="rgba(255, 45, 135, 0.2)" stroke="#ff2d87" stroke-width="2"/>
    <circle cx="480" cy="55" r="12" fill="none" stroke="#ff2d87" stroke-width="1" opacity="0.5"/>
    <line x1="480" y1="55" x2="480" y2="30" stroke="#ff2d87" stroke-width="1" stroke-dasharray="3,3"/>
    <rect x="420" y="10" width="120" height="22" rx="4" fill="rgba(255, 45, 135, 0.2)"/>
    <text x="480" y="25" font-family="monospace" font-size="9" fill="#ff2d87" text-anchor="middle">↑ +62% Spike</text>

    <!-- X-Axis Labels -->
    <text x="60" y="295" font-family="monospace" font-size="9" fill="rgba(245, 241, 232, 0.4)" text-anchor="middle">01.05</text>
    <text x="180" y="295" font-family="monospace" font-size="9" fill="rgba(245, 241, 232, 0.4)" text-anchor="middle">05.05</text>
    <text x="300" y="295" font-family="monospace" font-size="9" fill="rgba(245, 241, 232, 0.4)" text-anchor="middle">10.05</text>
    <text x="420" y="295" font-family="monospace" font-size="9" fill="rgba(245, 241, 232, 0.4)" text-anchor="middle">15.05</text>
    <text x="540" y="295" font-family="monospace" font-size="9" fill="rgba(245, 241, 232, 0.4)" text-anchor="middle">20.05</text>

    <!-- Legend -->
    <line x1="50" y1="250" x2="80" y2="250" stroke="#ff2d87" stroke-width="2"/>
    <text x="90" y="254" font-family="monospace" font-size="9" fill="rgba(245, 241, 232, 0.7)">Tatsächlich</text>

    <line x1="170" y1="250" x2="200" y2="250" stroke="#b8d18a" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="210" y="254" font-family="monospace" font-size="9" fill="rgba(245, 241, 232, 0.7)">Prognose</text>
  </svg>

  <!-- Anomaly Details -->
  <text x="100" y="480" font-family="sans-serif" font-size="13" fill="#f5f1e8" font-weight="600">Erkannte Anomalien</text>

  <!-- Detail 1 -->
  <rect x="100" y="495" width="640" height="55" rx="8" fill="rgba(255, 45, 135, 0.08)" stroke="rgba(255, 45, 135, 0.2)" stroke-width="1"/>
  <text x="120" y="515" font-family="monospace" font-size="10" fill="#ff2d87" font-weight="600">04. Mai 2026 • +45% über Erwartung</text>
  <text x="120" y="533" font-family="sans-serif" font-size="12" fill="rgba(245, 241, 232, 0.8)">Ursache: Großkunde TechFlow hat Jahresvertrag abgeschlossen (€24k)</text>

  <!-- Detail 2 -->
  <rect x="100" y="560" width="640" height="55" rx="8" fill="rgba(255, 45, 135, 0.08)" stroke="rgba(255, 45, 135, 0.2)" stroke-width="1"/>
  <text x="120" y="580" font-family="monospace" font-size="10" fill="#ff2d87" font-weight="600">15. Mai 2026 • +62% über Erwartung</text>
  <text x="120" y="598" font-family="sans-serif" font-size="12" fill="rgba(245, 241, 232, 0.8)">Ursache: Launch-Kampagne überperformt (3 Deals in 24h, €38k)</text>

  <!-- Detail 3 -->
  <rect x="100" y="625" width="640" height="45" rx="8" fill="rgba(245, 193, 78, 0.08)" stroke="rgba(245, 193, 78, 0.2)" stroke-width="1"/>
  <text x="120" y="645" font-family="monospace" font-size="10" fill="#f5c14e" font-weight="600">10. Mai 2026 • Ungewöhnliches Pattern</text>
  <text x="120" y="660" font-family="sans-serif" font-size="12" fill="rgba(245, 241, 232, 0.8)">Warnung: Mehrere Anfragen aus unbekannter Quelle (prüfen)</text>

  <!-- Right Column: Sidebar -->
  <!-- Summary Card -->
  <rect x="780" y="120" width="340" height="180" rx="12" fill="#0d0d0d" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
  <text x="800" y="145" font-family="monospace" font-size="9" fill="rgba(245, 241, 232, 0.5)" letter-spacing="0.05em">ANALYSE-ZUSAMMENFASSUNG</text>

  <text x="800" y="175" font-family="monospace" font-size="10" fill="rgba(245, 241, 232, 0.5)">Datenpunkte analysiert</text>
  <text x="800" y="195" font-family="monospace" font-size="18" fill="#f5f1e8" font-weight="700">8.472</text>

  <text x="800" y="225" font-family="monospace" font-size="10" fill="rgba(245, 241, 232, 0.5)">Anomalien gefunden</text>
  <text x="800" y="245" font-family="monospace" font-size="18" fill="#ff2d87" font-weight="700">3</text>

  <text x="800" y="275" font-family="monospace" font-size="10" fill="rgba(245, 241, 232, 0.5)">Konfidenz-Level</text>
  <text x="800" y="295" font-family="monospace" font-size="18" fill="#b8d18a" font-weight="700">94%</text>

  <!-- Model Info Card -->
  <rect x="780" y="320" width="340" height="140" rx="12" fill="#0d0d0d" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
  <text x="800" y="345" font-family="monospace" font-size="9" fill="rgba(245, 241, 232, 0.5)" letter-spacing="0.05em">MODEL INFORMATION</text>

  <text x="800" y="375" font-family="monospace" font-size="10" fill="rgba(245, 241, 232, 0.5)">Algorithmus</text>
  <text x="800" y="395" font-family="monospace" font-size="13" fill="rgba(245, 241, 232, 0.7)">Isolation Forest</text>

  <text x="800" y="425" font-family="monospace" font-size="10" fill="rgba(245, 241, 232, 0.5)">Training-Daten</text>
  <text x="800" y="445" font-family="monospace" font-size="13" fill="rgba(245, 241, 232, 0.7)">12 Monate Historie</text>

  <!-- Insights Card -->
  <rect x="780" y="480" width="340" height="200" rx="12" fill="#0d0d0d" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
  <text x="800" y="505" font-family="monospace" font-size="9" fill="rgba(245, 241, 232, 0.5)" letter-spacing="0.05em">KI-INSIGHTS</text>

  <text x="800" y="535" font-family="sans-serif" font-size="12" fill="rgba(245, 241, 232, 0.8)">• Anomalie-Muster wiederholt</text>
  <text x="810" y="553" font-family="sans-serif" font-size="11" fill="rgba(245, 241, 232, 0.6)">sich Ende jeden Monats</text>

  <text x="800" y="580" font-family="sans-serif" font-size="12" fill="rgba(245, 241, 232, 0.8)">• Launch-Kampagnen zeigen</text>
  <text x="810" y="598" font-family="sans-serif" font-size="11" fill="rgba(245, 241, 232, 0.6)">konsistent hohe Performance</text>

  <text x="800" y="625" font-family="sans-serif" font-size="12" fill="rgba(245, 241, 232, 0.8)">• Empfehlung: Mehr Budget</text>
  <text x="810" y="643" font-family="sans-serif" font-size="11" fill="rgba(245, 241, 232, 0.6)">für Launch-Events (+€10k)</text>

  <!-- Insights Row -->
  <!-- Green Box -->
  <rect x="80" y="700" width="340" height="50" rx="8" fill="rgba(184, 209, 138, 0.1)" stroke="rgba(184, 209, 138, 0.3)" stroke-width="1"/>
  <text x="100" y="730" font-family="sans-serif" font-size="12" fill="#b8d18a">↑ Positive Anomalien führten zu +€62k</text>

  <!-- Pink Box -->
  <rect x="440" y="700" width="340" height="50" rx="8" fill="rgba(255, 45, 135, 0.1)" stroke="rgba(255, 45, 135, 0.3)" stroke-width="1"/>
  <text x="460" y="730" font-family="sans-serif" font-size="12" fill="#ff2d87">Forecast-Genauigkeit 94% über 3 Monate</text>

  <!-- Yellow Box -->
  <rect x="800" y="700" width="320" height="50" rx="8" fill="rgba(245, 193, 78, 0.1)" stroke="rgba(245, 193, 78, 0.3)" stroke-width="1"/>
  <text x="820" y="730" font-family="sans-serif" font-size="12" fill="#f5c14e">1 ungewöhnliches Pattern braucht Review</text>

  <!-- Tag Footer -->
  <text x="80" y="785" font-family="monospace" font-size="10" fill="rgba(245, 241, 232, 0.5)">Features:</text>
  <text x="145" y="785" font-family="monospace" font-size="10" fill="rgba(245, 241, 232, 0.7)">Anomaly Detection · Trend Forecasting · Root Cause Analysis · Auto-Alerts · Pattern Recognition</text>
</svg>
