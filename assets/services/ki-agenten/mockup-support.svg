<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0A0C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#121216;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#grad1)"/>

  <!-- Title Badge -->
  <text x="40" y="35" fill="#FF2D7A" font-size="12" font-family="monospace" letter-spacing="2">CUSTOMER SUPPORT AI AGENT</text>

  <!-- Chat Interface -->
  <rect x="40" y="70" width="750" height="540" rx="8" fill="#1C1C22" stroke="rgba(245,242,236,0.08)" stroke-width="1"/>

  <!-- Chat Header -->
  <rect x="40" y="70" width="750" height="50" rx="8" fill="rgba(245,242,236,0.04)" stroke="rgba(245,242,236,0.08)" stroke-width="1"/>
  <circle cx="70" cy="95" r="15" fill="rgba(255,45,122,0.2)"/>
  <text x="66" y="100" fill="#FF2D7A" font-size="16">AI</text>
  <text x="100" y="100" fill="#F5F2EC" font-size="14" font-weight="bold">Support Agent</text>
  <circle cx="220" cy="95" r="5" fill="#8FA373"/>
  <text x="235" y="100" fill="#8FA373" font-size="11">Online • Avg. response: 1.2s</text>

  <!-- Chat Messages -->

  <!-- Customer Message 1 -->
  <rect x="80" y="150" width="600" height="70" rx="12" fill="rgba(245,242,236,0.06)" stroke="rgba(245,242,236,0.08)" stroke-width="1"/>
  <text x="100" y="172" fill="#9A968C" font-size="10">Customer • 09:42</text>
  <text x="100" y="195" fill="#F5F2EC" font-size="13">Hi, I'm having trouble accessing my account dashboard.</text>
  <text x="100" y="213" fill="#F5F2EC" font-size="13">It shows a blank page after login.</text>

  <!-- AI Processing Indicator -->
  <rect x="80" y="240" width="200" height="35" rx="12" fill="rgba(255,45,122,0.08)" stroke="rgba(255,45,122,0.2)" stroke-width="1"/>
  <circle cx="105" cy="257" r="4" fill="#FF2D7A">
    <animate attributeName="opacity" values="1;0.3;1" dur="1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="130" cy="257" r="4" fill="#FF2D7A">
    <animate attributeName="opacity" values="1;0.3;1" dur="1s" begin="0.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="155" cy="257" r="4" fill="#FF2D7A">
    <animate attributeName="opacity" values="1;0.3;1" dur="1s" begin="0.4s" repeatCount="indefinite"/>
  </circle>
  <text x="175" y="262" fill="#FF2D7A" font-size="11">AI analyzing...</text>

  <!-- AI Response -->
  <rect x="80" y="295" width="650" height="140" rx="12" fill="rgba(255,45,122,0.06)" stroke="rgba(255,45,122,0.15)" stroke-width="1"/>
  <text x="100" y="317" fill="#9A968C" font-size="10">AI Agent • 09:42 (0.8s)</text>
  <text x="100" y="345" fill="#F5F2EC" font-size="13">I understand you're seeing a blank dashboard after login.</text>
  <text x="100" y="363" fill="#F5F2EC" font-size="13">Let me check your account status...</text>
  <text x="100" y="390" fill="#8FA373" font-size="12">✓ Account active</text>
  <text x="100" y="410" fill="#8FA373" font-size="12">✓ No service outages detected</text>
  <text x="100" y="428" fill="#FF2D7A" font-size="12">⚠ Cache issue detected in your browser</text>

  <!-- Suggested Actions -->
  <rect x="100" y="455" width="240" height="30" rx="6" fill="rgba(255,45,122,0.12)" stroke="rgba(255,45,122,0.3)" stroke-width="1"/>
  <text x="115" y="475" fill="#FF2D7A" font-size="12">→ Clear browser cache</text>

  <rect x="360" y="455" width="240" height="30" rx="6" fill="rgba(245,242,236,0.06)" stroke="rgba(245,242,236,0.12)" stroke-width="1"/>
  <text x="375" y="475" fill="#F5F2EC" font-size="12">→ Try incognito mode</text>

  <!-- Customer Message 2 -->
  <rect x="80" y="510" width="500" height="45" rx="12" fill="rgba(245,242,236,0.06)" stroke="rgba(245,242,236,0.08)" stroke-width="1"/>
  <text x="100" y="532" fill="#9A968C" font-size="10">Customer • 09:43</text>
  <text x="100" y="548" fill="#F5F2EC" font-size="13">That worked! Thank you!</text>

  <!-- AI Final Response -->
  <rect x="80" y="570" width="400" height="30" rx="12" fill="rgba(143,163,115,0.08)" stroke="rgba(143,163,115,0.2)" stroke-width="1"/>
  <text x="100" y="592" fill="#8FA373" font-size="13">Great! Is there anything else I can help you with?</text>

  <!-- Context Panel -->
  <rect x="820" y="70" width="340" height="540" rx="8" fill="#1C1C22" stroke="rgba(245,242,236,0.08)" stroke-width="1"/>
  <text x="840" y="100" fill="#9A968C" font-size="11" font-family="monospace" letter-spacing="1">AI CONTEXT AWARENESS</text>

  <!-- Customer Info -->
  <rect x="840" y="120" width="300" height="110" rx="6" fill="rgba(245,242,236,0.04)" stroke="rgba(245,242,236,0.08)" stroke-width="1"/>
  <text x="860" y="145" fill="#F5F2EC" font-size="12" font-weight="bold">Customer Profile</text>
  <text x="860" y="168" fill="#9A968C" font-size="11">Sarah Johnson</text>
  <text x="860" y="185" fill="#9A968C" font-size="11">Plan: Premium</text>
  <text x="860" y="202" fill="#9A968C" font-size="11">Account Age: 2 years</text>
  <text x="860" y="219" fill="#8FA373" font-size="11">✓ No previous issues</text>

  <!-- Knowledge Base Search -->
  <rect x="840" y="245" width="300" height="140" rx="6" fill="rgba(255,45,122,0.06)" stroke="rgba(255,45,122,0.15)" stroke-width="1"/>
  <text x="860" y="270" fill="#F5F2EC" font-size="12" font-weight="bold">Knowledge Base</text>
  <text x="860" y="290" fill="#9A968C" font-size="10">Retrieved 3 articles:</text>

  <rect x="860" y="300" width="260" height="22" rx="4" fill="rgba(255,45,122,0.08)"/>
  <text x="870" y="315" fill="#FF2D7A" font-size="10">Dashboard Cache Issues (98%)</text>

  <rect x="860" y="328" width="260" height="22" rx="4" fill="rgba(245,242,236,0.04)"/>
  <text x="870" y="343" fill="#9A968C" font-size="10">Login Problems (85%)</text>

  <rect x="860" y="356" width="260" height="22" rx="4" fill="rgba(245,242,236,0.04)"/>
  <text x="870" y="371" fill="#9A968C" font-size="10">Browser Compatibility (72%)</text>

  <!-- Sentiment Analysis -->
  <rect x="840" y="400" width="300" height="85" rx="6" fill="rgba(245,242,236,0.04)" stroke="rgba(245,242,236,0.08)" stroke-width="1"/>
  <text x="860" y="425" fill="#F5F2EC" font-size="12" font-weight="bold">Sentiment Analysis</text>

  <text x="860" y="448" fill="#9A968C" font-size="10">Initial: Frustrated</text>
  <rect x="955" y="438" width="160" height="8" rx="4" fill="rgba(245,242,236,0.06)"/>
  <rect x="955" y="438" width="96" height="8" rx="4" fill="#D1A85C"/>

  <text x="860" y="470" fill="#9A968C" font-size="10">Current: Satisfied</text>
  <rect x="955" y="460" width="160" height="8" rx="4" fill="rgba(245,242,236,0.06)"/>
  <rect x="955" y="460" width="144" height="8" rx="4" fill="#8FA373"/>

  <!-- Auto Actions -->
  <rect x="840" y="500" width="300" height="100" rx="6" fill="rgba(143,163,115,0.08)" stroke="rgba(143,163,115,0.2)" stroke-width="1"/>
  <text x="860" y="525" fill="#F5F2EC" font-size="12" font-weight="bold">Automated Actions</text>
  <text x="860" y="548" fill="#8FA373" font-size="11">✓ Article link sent</text>
  <text x="860" y="566" fill="#8FA373" font-size="11">✓ Ticket created (#12453)</text>
  <text x="860" y="584" fill="#8FA373" font-size="11">✓ Follow-up scheduled (24h)</text>

  <!-- Stats Footer -->
  <rect x="40" y="625" width="1120" height="35" rx="6" fill="rgba(255,45,122,0.06)" stroke="rgba(255,45,122,0.2)" stroke-width="1"/>
  <text x="60" y="647" fill="#9A968C" font-size="11">Performance:</text>
  <text x="200" y="647" fill="#8FA373" font-size="11" font-weight="bold">94% Resolution Rate</text>
  <text x="420" y="647" fill="#FF2D7A" font-size="11" font-weight="bold">1.2s Avg Response</text>
  <text x="640" y="647" fill="#8FA373" font-size="11">4.8/5 Customer Satisfaction</text>
  <text x="920" y="647" fill="#9A968C" font-size="11">127 tickets today</text>
</svg>
