<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#0d0d0d"/>
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="20" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="40" y="40" width="1120" height="720" rx="18" fill="#1a1a1a" stroke="rgba(255, 45, 135, 0.3)" stroke-width="1" filter="url(#glow)"/>

  <text x="80" y="90" font-family="monospace" font-size="10" fill="#ff2d87" letter-spacing="0.08em">MATURITY ASSESSMENT • DATA &amp; AI READINESS</text>

  <rect x="80" y="120" width="680" height="560" rx="12" fill="#0d0d0d" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>

  <text x="100" y="150" font-family="sans-serif" font-size="14" fill="#f5f1e8" font-weight="600">Digital Maturity Radar – Aktueller Stand</text>

  <rect x="540" y="135" width="180" height="24" rx="6" fill="rgba(184, 209, 138, 0.15)"/>
  <circle cx="555" cy="147" r="3" fill="#b8d18a"/>
  <text x="565" y="151" font-family="monospace" font-size="10" fill="#b8d18a">Assessment abgeschlossen</text>

  <!-- Overall Score -->
  <rect x="100" y="170" width="640" height="85" rx="8" fill="rgba(255, 45, 135, 0.08)"/>
  <text x="120" y="195" font-family="monospace" font-size="9" fill="rgba(245, 241, 232, 0.5)">GESAMTSCORE</text>
  <text x="120" y="230" font-family="sans-serif" font-size="32" fill="#ff2d87" font-weight="700">3.2 / 5.0</text>
  <text x="120" y="248" font-family="monospace" font-size="11" fill="#ff2d87">Fortgeschritten • Potenzial vorhanden</text>

  <!-- Radar Chart -->
  <g transform="translate(370, 350)">
    <!-- Background circle guides -->
    <circle cx="0" cy="0" r="120" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
    <circle cx="0" cy="0" r="90" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
    <circle cx="0" cy="0" r="60" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
    <circle cx="0" cy="0" r="30" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>

    <!-- Axis lines -->
    <line x1="0" y1="0" x2="0" y2="-120" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
    <line x1="0" y1="0" x2="103.9" y2="-60" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
    <line x1="0" y1="0" x2="103.9" y2="60" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
    <line x1="0" y1="0" x2="0" y2="120" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
    <line x1="0" y1="0" x2="-103.9" y2="60" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
    <line x1="0" y1="0" x2="-103.9" y2="-60" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>

    <!-- Data polygon (current state) -->
    <polygon points="0,-96 62.3,-36 62.3,36 0,72 -62.3,36 -83.1,-48"
             fill="rgba(255, 45, 135, 0.2)"
             stroke="#ff2d87"
             stroke-width="2"/>

    <!-- Data points -->
    <circle cx="0" cy="-96" r="4" fill="#ff2d87"/>
    <circle cx="62.3" cy="-36" r="4" fill="#ff2d87"/>
    <circle cx="62.3" cy="36" r="4" fill="#ff2d87"/>
    <circle cx="0" cy="72" r="4" fill="#ff2d87"/>
    <circle cx="-62.3" cy="36" r="4" fill="#ff2d87"/>
    <circle cx="-83.1" cy="-48" r="4" fill="#ff2d87"/>

    <!-- Labels -->
    <text x="0" y="-135" font-family="monospace" font-size="10" fill="#f5f1e8" text-anchor="middle">Daten (4.0)</text>
    <text x="125" y="-50" font-family="monospace" font-size="10" fill="#f5f1e8" text-anchor="start">Tech (3.0)</text>
    <text x="125" y="40" font-family="monospace" font-size="10" fill="#f5f1e8" text-anchor="start">People (3.0)</text>
    <text x="0" y="140" font-family="monospace" font-size="10" fill="#f5f1e8" text-anchor="middle">Prozesse (3.0)</text>
    <text x="-125" y="40" font-family="monospace" font-size="10" fill="#f5f1e8" text-anchor="end">Kultur (3.0)</text>
    <text x="-125" y="-50" font-family="monospace" font-size="10" fill="#f5f1e8" text-anchor="end">Strategie (3.5)</text>
