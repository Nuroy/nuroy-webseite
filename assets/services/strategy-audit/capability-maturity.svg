  <rect x="440" y="565" width="300" height="35" rx="6" fill="rgba(255, 45, 135, 0.08)"/>
  <text x="460" y="587" font-family="sans-serif" font-size="11" fill="#f5f1e8">Technologie &amp; Tools</text>
  <text x="720" y="587" font-family="monospace" font-size="11" fill="#ff2d87" text-anchor="end" font-weight="700">3.0 / 5.0</text>

  <rect x="100" y="610" width="300" height="35" rx="6" fill="rgba(255, 45, 135, 0.08)"/>
  <text x="120" y="632" font-family="sans-serif" font-size="11" fill="#f5f1e8">People &amp; Skills</text>
  <text x="380" y="632" font-family="monospace" font-size="11" fill="#ff2d87" text-anchor="end" font-weight="700">3.0 / 5.0</text>

  <rect x="440" y="610" width="300" height="35" rx="6" fill="rgba(255, 45, 135, 0.08)"/>
  <text x="460" y="632" font-family="sans-serif" font-size="11" fill="#f5f1e8">Prozesse &amp; Governance</text>
