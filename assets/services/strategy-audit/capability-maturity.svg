  <text x="820" y="184" font-family="monospace" font-size="10" fill="rgba(245, 241, 232, 0.5)">Level 1:</text>
  <text x="1080" y="184" font-family="sans-serif" font-size="10" fill="rgba(245, 241, 232, 0.5)" text-anchor="end">Initial</text>

  <rect x="800" y="200" width="300" height="30" rx="6" fill="rgba(255, 255, 255, 0.03)"/>
  <text x="820" y="219" font-family="monospace" font-size="10" fill="rgba(245, 241, 232, 0.5)">Level 2:</text>
  <text x="1080" y="219" font-family="sans-serif" font-size="10" fill="rgba(245, 241, 232, 0.5)" text-anchor="end">Repeatable</text>

  <rect x="800" y="235" width="300" height="30" rx="6" fill="rgba(255, 45, 135, 0.1)"/>
  <text x="820" y="254" font-family="monospace" font-size="10" fill="#ff2d87">Level 3:</text>
  <text x="1080" y="254" font-family="sans-serif" font-size="10" fill="#ff2d87" text-anchor="end">Defined ← Aktuell</text>

  <rect x="800" y="270" width="300" height="30" rx="6" fill="rgba(255, 255, 255, 0.03)"/>
  <text x="820" y="289" font-family="monospace" font-size="10" fill="rgba(245, 241, 232, 0.5)">Level 4:</text>
  <text x="1080" y="289" font-family="sans-serif" font-size="10" fill="rgba(245, 241, 232, 0.5)" text-anchor="end">Managed</text>

  <rect x="780" y="340" width="340" height="180" rx="12" fill="#0d0d0d" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
  <text x="800" y="365" font-family="monospace" font-size="9" fill="rgba(245, 241, 232, 0.5)">TOP STÄRKEN</text>

  <rect x="800" y="380" width="300" height="30" rx="6" fill="rgba(184, 209, 138, 0.08)"/>
  <circle cx="815" cy="395" r="4" fill="#b8d18a"/>
  <text x="830" y="399" font-family="sans-serif" font-size="11" fill="#b8d18a">✓ Datenqualität sehr gut</text>

  <rect x="800" y="420" width="300" height="30" rx="6" fill="rgba(184, 209, 138, 0.08)"/>
  <circle cx="815" cy="435" r="4" fill="#b8d18a"/>
  <text x="830" y="439" font-family="sans-serif" font-size="11" fill="#b8d18a">✓ Analytics-Infrastruktur solid</text>

  <rect x="800" y="460" width="300" height="30" rx="6" fill="rgba(184, 209, 138, 0.08)"/>
  <circle cx="815" cy="475" r="4" fill="#b8d18a"/>
  <text x="830" y="479" font-family="sans-serif" font-size="11" fill="#b8d18a">✓ Strategische Vision vorhanden</text>

  <rect x="780" y="540" width="340" height="140" rx="12" fill="#0d0d0d" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
  <text x="800" y="565" font-family="monospace" font-size="9" fill="rgba(245, 241, 232, 0.5)">HANDLUNGSFELDER</text>

  <rect x="800" y="580" width="300" height="30" rx="6" fill="rgba(255, 45, 135, 0.08)"/>
  <circle cx="815" cy="595" r="4" fill="#ff2d87"/>
  <text x="830" y="599" font-family="sans-serif" font-size="11" fill="#ff2d87">! Skills-Lücke schließen</text>

  <rect x="800" y="620" width="300" height="30" rx="6" fill="rgba(255, 45, 135, 0.08)"/>
  <circle cx="815" cy="635" r="4" fill="#ff2d87"/>
  <text x="830" y="639" font-family="sans-serif" font-size="11" fill="#ff2d87">! Prozesse standardisieren</text>

  <rect x="80" y="700" width="340" height="50" rx="8" fill="rgba(255, 45, 135, 0.1)" stroke="rgba(255, 45, 135, 0.3)" stroke-width="1"/>
  <text x="100" y="730" font-family="sans-serif" font-size="12" fill="#ff2d87">↑ 3.2/5.0 Gesamtscore — Fortgeschritten</text>

  <rect x="440" y="700" width="340" height="50" rx="8" fill="rgba(184, 209, 138, 0.1)" stroke="rgba(184, 209, 138, 0.3)" stroke-width="1"/>
  <text x="460" y="730" font-family="sans-serif" font-size="12" fill="#b8d18a">⚡ 6 Dimensionen analysiert</text>

  <rect x="800" y="700" width="320" height="50" rx="8" fill="rgba(245, 193, 78, 0.1)" stroke="rgba(245, 193, 78, 0.3)" stroke-width="1"/>
  <text x="820" y="730" font-family="sans-serif" font-size="12" fill="#f5c14e">Level 3 → Level 4 erreichbar</text>

  <text x="80" y="785" font-family="monospace" font-size="10" fill="rgba(245, 241, 232, 0.5)">Bereiche:</text>
  <text x="145" y="785" font-family="monospace" font-size="10" fill="rgba(245, 241, 232, 0.7)">Daten · Technologie · People · Prozesse · Kultur · Strategie · 6-Dimensionen-Radar</text>
</svg>
