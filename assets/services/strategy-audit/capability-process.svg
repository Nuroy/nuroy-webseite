  <rect x="800" y="700" width="320" height="50" rx="8" fill="rgba(245, 193, 78, 0.1)" stroke="rgba(245, 193, 78, 0.3)" stroke-width="1"/>
  <text x="820" y="730" font-family="sans-serif" font-size="12" fill="#f5c14e">+€840k Revenue-Potential</text>

  <text x="80" y="785" font-family="monospace" font-size="10" fill="rgba(245, 241, 232, 0.5)">Stages:</text>
  <text x="145" y="785" font-family="monospace" font-size="10" fill="rgba(245, 241, 232, 0.7)">Lead Gen · Qualification · Proposal · Negotiation · Legal · Close · 6 Stages · 28d Cycle Time</text>
