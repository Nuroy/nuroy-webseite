" height="80" x="320" y="180" fill="rgba(154,150,140,0.12)" stroke="rgba(154,150,140,0.3)" rx="6"/><text x="340" y="205" fill="#9a968c" font-size="11" font-weight="bold">3. Approval Routing</text><text x="340" y="222" fill="#f5f2ec" font-size="9">Email to manager</text><text x="340" y="236" fill="#f5f2ec" font-size="9">Wait for response</text><text x="340" y="250" fill="#d1a85c" font-size="8">⏱ 2-5 days</text><path stroke="#9a968c" stroke-width="2" d="M450 260v30"/><path fill="#9a968c" d="m450 290-5-7h10z"/><rect width="260" height="80" x="320" y="290" fill="rgba(154,150,140,0.12)" stroke="rgba(154,150,140,0.3)" rx="6"/><text x="340" y="315" fill="#9a968c" font-size="11" font-weight="bold">4. Payment Processing</text><text x="340" y="332" fill="#f5f2ec" font-size="9">Manual bank transfer</text><text x="340" y="346" fill="#f5f2ec" font-size="9">File documentation</text><text x="340" y="360" fill="#d1a85c" font-size="8">⏱ 30 min</text><rect width="480" height="150" x="100" y="390" fill="rgba(245,242,236,0.02)" stroke="rgba(245,242,236,0.08)" rx="6"/><text x="120" y="415" fill="#d1a85c" font-size="11" font-weight="bold">⚠ Issues with Manual Process:</text><text x="120" y="435" fill="#f5f2ec" font-size="10">• Average processing time: 2-5 days</text><text x="120" y="453" fill="#f5f2ec" font-size="10">• Error rate: 8%</text><text x="120" y="471" fill="#f5f2ec" font-size="10">• Cost per invoice: €12.50</text><text x="120" y="489" fill="#f5f2ec" font-size="10">• Labor intensive: 55 min per invoice</text><text x="120" y="507" fill="#f5f2ec" font-size="10">• No real-time visibility</text><text x="120" y="525" fill="#f5f2ec" font-size="10">• Duplicate payments risk</text><rect width="520" height="430" x="620" y="130" fill="rgba(143,163,115,0.08)" stroke="rgba(143,163,115,0.2)" rx="6"/><text x="640" y="160" fill="#8fa373" font-size="14" font-weight="bold">AFTER: Automated Process</text><rect width="180" height="60" x="640" y="180" fill="rgba(143,163,115,0.12)" stroke="rgba(143,