<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0A0C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#121216;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="green-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8FA373;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#A3B88C;stop-opacity:0.3" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#grad1)"/>

  <!-- Title Badge -->
  <text x="40" y="35" fill="#8FA373" font-size="12" font-family="monospace" letter-spacing="2">OPERATIONS DASHBOARD</text>

  <!-- Stats Grid - Operations Focused -->
  <rect x="40" y="60" width="340" height="130" rx="8" fill="#1C1C22" stroke="rgba(245,242,236,0.08)" stroke-width="1"/>
  <text x="60" y="95" fill="#9A968C" font-size="11" font-family="monospace" letter-spacing="1">ACTIVE PROJECTS</text>
  <text x="60" y="135" fill="#F5F2EC" font-size="32" font-family="Arial" font-weight="bold">23</text>
  <text x="60" y="160" fill="#8FA373" font-size="11">8 launching this week</text>

  <rect x="400" y="60" width="340" height="130" rx="8" fill="#1C1C22" stroke="rgba(245,242,236,0.08)" stroke-width="1"/>
  <text x="420" y="95" fill="#9A968C" font-size="11" font-family="monospace" letter-spacing="1">TEAM UTILIZATION</text>
  <text x="420" y="135" fill="#8FA373" font-size="32" font-family="Arial" font-weight="bold">76%</text>
  <text x="420" y="160" fill="#9A968C" font-size="11">Optimal capacity</text>

  <rect x="760" y="60" width="400" height="130" rx="8" fill="#1C1C22" stroke="rgba(245,242,236,0.08)" stroke-width="1"/>
  <text x="780" y="95" fill="#9A968C" font-size="11" font-family="monospace" letter-spacing="1">ON-TIME DELIVERY</text>
  <text x="780" y="135" fill="#8FA373" font-size="32" font-family="Arial" font-weight="bold">94%</text>
  <text x="780" y="160" fill="#8FA373" font-size="11">↑ 8% improvement</text>

  <!-- Kanban Board Visualization -->
  <rect x="40" y="210" width="360" height="425" rx="8" fill="#1C1C22" stroke="rgba(245,242,236,0.08)" stroke-width="1"/>
  <text x="60" y="240" fill="#9A968C" font-size="12" font-family="monospace">TO DO</text>
  <rect x="60" y="260" width="320" height="60" rx="6" fill="rgba(245,242,236,0.05)"/>
  <rect x="60" y="330" width="320" height="60" rx="6" fill="rgba(245,242,236,0.05)"/>
  <rect x="60" y="400" width="320" height="60" rx="6" fill="rgba(245,242,236,0.05)"/>

  <rect x="420" y="210" width="360" height="425" rx="8" fill="#1C1C22" stroke="rgba(245,242,236,0.08)" stroke-width="1"/>
  <text x="440" y="240" fill="#D1A85C" font-size="12" font-family="monospace">IN PROGRESS</text>
  <rect x="440" y="260" width="320" height="60" rx="6" fill="rgba(209,168,92,0.1)"/>
  <rect x="440" y="330" width="320" height="60" rx="6" fill="rgba(209,168,92,0.1)"/>
  <rect x="440" y="400" width="320" height="60" rx="6" fill="rgba(209,168,92,0.1)"/>
  <rect x="440" y="470" width="320" height="60" rx="6" fill="rgba(209,168,92,0.1)"/>

  <rect x="800" y="210" width="360" height="425" rx="8" fill="#1C1C22" stroke="rgba(245,242,236,0.08)" stroke-width="1"/>
  <text x="820" y="240" fill="#8FA373" font-size="12" font-family="monospace">DONE</text>
  <rect x="820" y="260" width="320" height="60" rx="6" fill="rgba(143,163,115,0.1)"/>
  <rect x="820" y="330" width="320" height="60" rx="6" fill="rgba(143,163,115,0.1)"/>
  <rect x="820" y="400" width="320" height="60" rx="6" fill="rgba(143,163,115,0.1)"/>
  <rect x="820" y="470" width="320" height="60" rx="6" fill="rgba(143,163,115,0.1)"/>
  <rect x="820" y="540" width="320" height="60" rx="6" fill="rgba(143,163,115,0.1)"/>
</svg>
