<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0A0C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#121216;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pink-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF2D7A;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#FF6B9D;stop-opacity:0.3" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#grad1)"/>

  <!-- Title Badge -->
  <text x="40" y="35" fill="#FF2D7A" font-size="12" font-family="monospace" letter-spacing="2">CUSTOMER SUCCESS DASHBOARD</text>

  <!-- Stats Grid - Customer Success Focused -->
  <rect x="40" y="60" width="340" height="130" rx="8" fill="#1C1C22" stroke="rgba(245,242,236,0.08)" stroke-width="1"/>
  <text x="60" y="95" fill="#9A968C" font-size="11" font-family="monospace" letter-spacing="1">NPS SCORE</text>
  <text x="60" y="135" fill="#8FA373" font-size="32" font-family="Arial" font-weight="bold">72</text>
  <text x="60" y="160" fill="#8FA373" font-size="11">↑ 8 points vs. Q3</text>

  <rect x="400" y="60" width="340" height="130" rx="8" fill="#1C1C22" stroke="rgba(245,242,236,0.08)" stroke-width="1"/>
  <text x="420" y="95" fill="#9A968C" font-size="11" font-family="monospace" letter-spacing="1">CHURN RATE</text>
  <text x="420" y="135" fill="#8FA373" font-size="32" font-family="Arial" font-weight="bold">2.3%</text>
  <text x="420" y="160" fill="#8FA373" font-size="11">↓ 0.5% vs. last month</text>

  <rect x="760" y="60" width="400" height="130" rx="8" fill="#1C1C22" stroke="rgba(245,242,236,0.08)" stroke-width="1"/>
  <text x="780" y="95" fill="#9A968C" font-size="11" font-family="monospace" letter-spacing="1">AVG RESPONSE TIME</text>
  <text x="780" y="135" fill="#FF2D7A" font-size="32" font-family="Arial" font-weight="bold">12 min</text>
  <text x="780" y="160" fill="#8FA373" font-size="11">↓ 3 min improvement</text>

  <!-- NPS Gauge Visualization -->
  <rect x="40" y="210" width="360" height="200" rx="8" fill="#1C1C22" stroke="rgba(245,242,236,0.08)" stroke-width="1"/>
  <text x="60" y="240" fill="#9A968C" font-size="12" font-family="monospace">NPS BREAKDOWN</text>

  <!-- Donut Chart representation -->
  <circle cx="220" cy="330" r="60" stroke="rgba(245,242,236,0.1)" stroke-width="20" fill="none"/>
  <circle cx="220" cy="330" r="60" stroke="#8FA373" stroke-width="20" fill="none"
          stroke-dasharray="260 377" transform="rotate(-90 220 330)"/>
  <text x="220" y="335" font-size="24" font-weight="bold" fill="#8FA373" text-anchor="middle">68%</text>
  <text x="220" y="355" font-size="10" fill="#9A968C" text-anchor="middle">Promoters</text>

  <!-- Support Metrics -->
  <rect x="420" y="210" width="740" height="200" rx="8" fill="#1C1C22" stroke="rgba(245,242,236,0.08)" stroke-width="1"/>
  <text x="440" y="240" fill="#9A968C" font-size="12" font-family="monospace">SUPPORT METRICS</text>

  <text x="460" y="280" fill="#9A968C" font-size="11" font-family="monospace">Active Tickets</text>
  <text x="460" y="305" fill="#F5F2EC" font-size="24" font-weight="bold">23</text>
  <rect x="550" y="288" width="60" height="18" rx="3" fill="rgba(239,68,68,0.12)"/>
  <text x="565" y="300" fill="#EF4444" font-size="10" font-family="monospace">↑ 5</text>

  <text x="750" y="280" fill="#9A968C" font-size="11" font-family="monospace">Resolved (MTD)</text>
  <text x="750" y="305" fill="#F5F2EC" font-size="24" font-weight="bold">412</text>
  <rect x="850" y="288" width="70" height="18" rx="3" fill="rgba(143,163,115,0.12)"/>
  <text x="860" y="300" fill="#8FA373" font-size="10" font-family="monospace">↑ 12%</text>

  <text x="460" y="360" fill="#9A968C" font-size="11" font-family="monospace">First Response</text>
  <text x="460" y="385" fill="#F5F2EC" font-size="24" font-weight="bold">8 min</text>

  <text x="750" y="360" fill="#9A968C" font-size="11" font-family="monospace">CSAT Score</text>
  <text x="750" y="385" fill="#8FA373" font-size="24" font-weight="bold">4.7/5</text>

  <!-- Recent Tickets Table -->
  <rect x="40" y="430" width="1120" height="205" rx="8" fill="#1C1C22" stroke="rgba(245,242,236,0.08)" stroke-width="1"/>
  <text x="60" y="460" fill="#9A968C" font-size="12" font-family="monospace">RECENT ESCALATIONS</text>

  <!-- Table Header -->
  <text x="60" y="490" fill="#5E5A52" font-size="10" font-family="monospace">CUSTOMER</text>
  <text x="350" y="490" fill="#5E5A52" font-size="10" font-family="monospace">ISSUE</text>
  <text x="700" y="490" fill="#5E5A52" font-size="10" font-family="monospace">PRIORITY</text>
  <text x="900" y="490" fill="#5E5A52" font-size="10" font-family="monospace">ASSIGNED</text>
  <line x1="60" y1="500" x2="1120" y2="500" stroke="rgba(245,242,236,0.08)" stroke-width="1"/>

  <!-- Table Rows -->
  <text x="60" y="530" fill="#9A968C" font-size="12" font-family="monospace">TechCorp GmbH</text>
  <text x="350" y="530" fill="#F5F2EC" font-size="12">Integration timeout errors</text>
  <rect x="700" y="518" width="50" height="18" rx="3" fill="rgba(239,68,68,0.12)"/>
  <text x="715" y="530" fill="#EF4444" font-size="10" font-family="monospace">HIGH</text>
  <text x="900" y="530" fill="#9A968C" font-size="11">Sarah M.</text>

  <text x="60" y="570" fill="#9A968C" font-size="12" font-family="monospace">DataFlow Inc</text>
  <text x="350" y="570" fill="#F5F2EC" font-size="12">API rate limit request</text>
  <rect x="700" y="558" width="65" height="18" rx="3" fill="rgba(209,168,92,0.12)"/>
  <text x="710" y="570" fill="#D1A85C" font-size="10" font-family="monospace">MEDIUM</text>
  <text x="900" y="570" fill="#9A968C" font-size="11">Marcus L.</text>

  <text x="60" y="610" fill="#9A968C" font-size="12" font-family="monospace">StartupX</text>
  <text x="350" y="610" fill="#F5F2EC" font-size="12">Onboarding support needed</text>
  <rect x="700" y="598" width="45" height="18" rx="3" fill="rgba(143,163,115,0.12)"/>
  <text x="713" y="610" fill="#8FA373" font-size="10" font-family="monospace">LOW</text>
  <text x="900" y="610" fill="#9A968C" font-size="11">Julia K.</text>
</svg>
