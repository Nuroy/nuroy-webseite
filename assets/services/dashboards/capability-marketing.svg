    <text x="180" y="235" font-family="monospace" font-size="9" fill="rgba(245, 241, 232, 0.4)" text-anchor="middle">7.05</text>
    <text x="300" y="235" font-family="monospace" font-size="9" fill="rgba(245, 241, 232, 0.4)" text-anchor="middle">14.05</text>
    <text x="420" y="235" font-family="monospace" font-size="9" fill="rgba(245, 241, 232, 0.4)" text-anchor="middle">21.05</text>

