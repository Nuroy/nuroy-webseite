  <rect x="800" y="402" width="210" height="8" rx="4" fill="#ff2d87"/>
  <text x="1005" y="410" font-family="monospace" font-size="9" fill="#ff2d87" text-anchor="end">48.2k</text>

  <text x="800" y="435" font-family="monospace" font-size="10" fill="rgba(245, 241, 232, 0.5)">Leads</text>
  <rect x="800" y="442" width="300" height="8" rx="4" fill="rgba(255, 255, 255, 0.05)"/>
  <rect x="800" y="442" width="120" height="8" rx="4" fill="#b8d18a"/>
  <text x="1005" y="450" font-family="monospace" font-size="9" fill="#b8d18a" text-anchor="end">8.4k</text>

  <text x="800" y="475" font-family="monospace" font-size="10" fill="rgba(245, 241, 232, 0.5)">Conversions</text>
  <rect x="800" y="482" width="300" height="8" rx="4" fill="rgba(255, 255, 255, 0.05)"/>
  <rect x="800" y="482" width="48" height="8" rx="4" fill="#b8d18a"/>
  <text x="1005" y="490" font-family="monospace" font-size="9" fill="#b8d18a" text-anchor="end">342</text>

  <!-- Data Sources Card -->
