<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="800" fill="#0d0d0d"/>

  <!-- Card Container with pink glow -->
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="20" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="metaGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff2d87" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ff2d87" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="googleGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b8d18a" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#b8d18a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="linkedinGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5c14e" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f5c14e" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="40" y="40" width="1120" height="720" rx="18" fill="#1a1a1a" stroke="rgba(255, 45, 135, 0.3)" stroke-width="1" filter="url(#glow)"/>

