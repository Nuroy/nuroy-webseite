  <rect x="800" y="362" width="300" height="8" rx="4" fill="#ff2d87"/>
  <text x="1005" y="370" font-family="monospace" font-size="9" fill="#ff2d87" text-anchor="end">2.4M</text>

  <text x="800" y="395" font-family="monospace" font-size="10" fill="rgba(245, 241, 232, 0.5)">Clicks</text>
