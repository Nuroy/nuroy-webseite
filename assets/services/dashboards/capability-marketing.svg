  <text x="820" y="730" font-family="sans-serif" font-size="12" fill="#f5c14e">LinkedIn Budget erhöhen? (Testing)</text>

  <!-- Tag Footer -->
  <text x="80" y="785" font-family="monospace" font-size="10" fill="rgba(245, 241, 232, 0.5)">Features:</text>
  <text x="145" y="785" font-family="monospace" font-size="10" fill="rgba(245, 241, 232, 0.7)">Multi-Channel Attribution · GA4 Integration · ROAS Tracking · Funnel Analysis · Auto-Optimization</text>
