  <text x="120" y="165" font-family="monospace" font-size="9" fill="rgba(245, 241, 232, 0.5)">AD SPEND</text>
  <text x="120" y="195" font-family="sans-serif" font-size="24" fill="#ff2d87" font-weight="700">€12.400</text>

  <rect x="270" y="140" width="150" height="80" rx="8" fill="rgba(184, 209, 138, 0.08)"/>
  <text x="290" y="165" font-family="monospace" font-size="9" fill="rgba(245, 241, 232, 0.5)">CONVERSIONS</text>
  <text x="290" y="195" font-family="sans-serif" font-size="24" fill="#b8d18a" font-weight="700">342</text>

  <rect x="440" y="140" width="150" height="80" rx="8" fill="rgba(255, 45, 135, 0.08)"/>
