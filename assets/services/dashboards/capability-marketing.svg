    <path d="M 60 110 L 140 105 L 220 95 L 300 85 L 380 75 L 460 70 L 540 65 L 600 60"
          stroke="#ff2d87" stroke-width="3" fill="none"/>

    <!-- Google Ads (Green) -->
    <path d="M 60 140 L 140 138 L 220 130 L 300 125 L 380 120 L 460 115 L 540 112 L 600 110
             L 600 220 L 60 220 Z"
          fill="url(#googleGradient)"/>
