  <text x="630" y="165" font-family="monospace" font-size="9" fill="rgba(245, 241, 232, 0.5)">CPA</text>
  <text x="630" y="195" font-family="sans-serif" font-size="24" fill="#f5f1e8" font-weight="700">€36</text>

