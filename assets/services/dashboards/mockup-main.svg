<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0A0C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#121216;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pink-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF2D7A;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#FF6B9D;stop-opacity:0.3" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#grad1)"/>

  <!-- Stats Grid -->
  <rect x="40" y="40" width="340" height="120" rx="8" fill="#1C1C22" stroke="rgba(245,242,236,0.08)" stroke-width="1"/>
  <text x="60" y="75" fill="#9A968C" font-size="11" font-family="monospace" letter-spacing="1">TOTAL REVENUE</text>
  <text x="60" y="115" fill="#F5F2EC" font-size="32" font-family="Arial" font-weight="bold">€ 84.200</text>

  <rect x="400" y="40" width="340" height="120" rx="8" fill="#1C1C22" stroke="rgba(245,242,236,0.08)" stroke-width="1"/>
  <text x="420" y="75" fill="#9A968C" font-size="11" font-family="monospace" letter-spacing="1">ACTIVE USERS</text>
  <text x="420" y="115" fill="#8FA373" font-size="32" font-family="Arial" font-weight="bold">1.243</text>

  <rect x="760" y="40" width="400" height="120" rx="8" fill="#1C1C22" stroke="rgba(245,242,236,0.08)" stroke-width="1"/>
  <text x="780" y="75" fill="#9A968C" font-size="11" font-family="monospace" letter-spacing="1">CONVERSION RATE</text>
  <text x="780" y="115" fill="#FF2D7A" font-size="32" font-family="Arial" font-weight="bold">3.2%</text>

  <!-- Chart Area -->
  <rect x="40" y="180" width="1120" height="220" rx="8" fill="#1C1C22" stroke="rgba(245,242,236,0.08)" stroke-width="1"/>
  <text x="60" y="210" fill="#9A968C" font-size="12" font-family="monospace">REVENUE TREND — LAST 30 DAYS</text>

  <!-- Chart Line -->
  <path d="M 60 360 Q 200 340, 300 320 T 540 300 T 780 280 T 1020 260 T 1120 240"
        stroke="url(#pink-glow)" stroke-width="3" fill="none" opacity="0.8"/>
  <path d="M 60 360 Q 200 340, 300 320 T 540 300 T 780 280 T 1020 260 T 1120 240 L 1120 380 L 60 380 Z"
        fill="url(#pink-glow)" opacity="0.15"/>

  <!-- Data Table -->
  <rect x="40" y="420" width="1120" height="215" rx="8" fill="#1C1C22" stroke="rgba(245,242,236,0.08)" stroke-width="1"/>
  <text x="60" y="450" fill="#9A968C" font-size="12" font-family="monospace">RECENT SOURCES</text>

  <!-- Table Header -->
  <text x="60" y="480" fill="#5E5A52" font-size="10" font-family="monospace">SOURCE</text>
  <text x="400" y="480" fill="#5E5A52" font-size="10" font-family="monospace">VALUE</text>
  <text x="650" y="480" fill="#5E5A52" font-size="10" font-family="monospace">UPDATED</text>
  <text x="900" y="480" fill="#5E5A52" font-size="10" font-family="monospace">STATUS</text>
  <line x1="60" y1="490" x2="1120" y2="490" stroke="rgba(245,242,236,0.08)" stroke-width="1"/>

  <!-- Table Rows -->
  <text x="60" y="520" fill="#9A968C" font-size="12" font-family="monospace">Google Analytics</text>
  <text x="400" y="520" fill="#F5F2EC" font-size="12" font-family="monospace">2.4k visitors</text>
  <text x="650" y="520" fill="#9A968C" font-size="12" font-family="monospace">heute</text>
  <rect x="900" y="508" width="60" height="18" rx="3" fill="rgba(143,163,115,0.12)"/>
  <text x="915" y="520" fill="#8FA373" font-size="10" font-family="monospace">SYNCED</text>

  <text x="60" y="560" fill="#9A968C" font-size="12" font-family="monospace">Stripe</text>
  <text x="400" y="560" fill="#F5F2EC" font-size="12" font-family="monospace">€ 8.7k</text>
  <text x="650" y="560" fill="#9A968C" font-size="12" font-family="monospace">heute</text>
  <rect x="900" y="548" width="60" height="18" rx="3" fill="rgba(143,163,115,0.12)"/>
  <text x="915" y="560" fill="#8FA373" font-size="10" font-family="monospace">SYNCED</text>

  <text x="60" y="600" fill="#9A968C" font-size="12" font-family="monospace">HubSpot CRM</text>
  <text x="400" y="600" fill="#F5F2EC" font-size="12" font-family="monospace">142 leads</text>
  <text x="650" y="600" fill="#9A968C" font-size="12" font-family="monospace">10 min ago</text>
  <rect x="900" y="588" width="70" height="18" rx="3" fill="rgba(255,45,122,0.12)"/>
  <text x="910" y="600" fill="#FF2D7A" font-size="10" font-family="monospace">SYNCING</text>
