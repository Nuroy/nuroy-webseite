<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0A0C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#121216;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pink-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF2D7A;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#FF6B9D;stop-opacity:0.3" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#grad1)"/>

  <!-- Title Badge -->
  <text x="40" y="35" fill="#FF2D7A" font-size="12" font-family="monospace" letter-spacing="2">SALES DASHBOARD</text>

  <!-- Stats Grid - Sales Focused -->
  <rect x="40" y="60" width="340" height="130" rx="8" fill="#1C1C22" stroke="rgba(245,242,236,0.08)" stroke-width="1"/>
  <text x="60" y="95" fill="#9A968C" font-size="11" font-family="monospace" letter-spacing="1">PIPELINE VALUE</text>
  <text x="60" y="135" fill="#F5F2EC" font-size="32" font-family="Arial" font-weight="bold">€ 142k</text>
  <text x="60" y="160" fill="#9A968C" font-size="11">24 active deals</text>

  <rect x="400" y="60" width="340" height="130" rx="8" fill="#1C1C22" stroke="rgba(245,242,236,0.08)" stroke-width="1"/>
  <text x="420" y="95" fill="#9A968C" font-size="11" font-family="monospace" letter-spacing="1">CLOSED (MTD)</text>
  <text x="420" y="135" fill="#8FA373" font-size="32" font-family="Arial" font-weight="bold">€ 84k</text>
  <text x="420" y="160" fill="#8FA373" font-size="11">↑ 32% vs. last month</text>

  <rect x="760" y="60" width="400" height="130" rx="8" fill="#1C1C22" stroke="rgba(245,242,236,0.08)" stroke-width="1"/>
  <text x="780" y="95" fill="#9A968C" font-size="11" font-family="monospace" letter-spacing="1">WIN RATE</text>
  <text x="780" y="135" fill="#FF2D7A" font-size="32" font-family="Arial" font-weight="bold">68%</text>
  <text x="780" y="160" fill="#8FA373" font-size="11">↑ 12% improvement</text>

  <!-- Pipeline Funnel Visualization -->
  <rect x="40" y="210" width="550" height="200" rx="8" fill="#1C1C22" stroke="rgba(245,242,236,0.08)" stroke-width="1"/>
  <text x="60" y="240" fill="#9A968C" font-size="12" font-family="monospace">SALES FUNNEL</text>

  <!-- Funnel Stages (trapezoid shapes) -->
  <path d="M 100 270 L 520 270 L 480 310 L 140 310 Z" fill="url(#pink-glow)" opacity="0.7"/>
  <text x="150" y="295" fill="#F5F2EC" font-size="12">Leads (142) — € 284k</text>

  <path d="M 140 320 L 480 320 L 440 360 L 180 360 Z" fill="url(#pink-glow)" opacity="0.6"/>
  <text x="200" y="345" fill="#F5F2EC" font-size="12">Qualified (68) — € 196k</text>

  <path d="M 180 370 L 440 370 L 400 390 Z" fill="url(#pink-glow)" opacity="0.5"/>
  <text x="240" y="385" fill="#F5F2EC" font-size="11">Proposal (24) — € 142k</text>

  <!-- Team Performance -->
  <rect x="610" y="210" width="550" height="200" rx="8" fill="#1C1C22" stroke="rgba(245,242,236,0.08)" stroke-width="1"/>
  <text x="630" y="240" fill="#9A968C" font-size="12" font-family="monospace">TOP PERFORMERS (THIS MONTH)</text>

  <!-- Leaderboard -->
  <circle cx="660" cy="280" r="20" fill="rgba(255,45,122,0.2)" stroke="#FF2D7A" stroke-width="2"/>
  <text x="660" y="287" fill="#FF2D7A" font-size="14" font-weight="bold" text-anchor="middle">1</text>
  <text x="695" y="287" fill="#F5F2EC" font-size="13" font-family="monospace">Sarah M. — € 42k closed</text>

  <circle cx="660" cy="330" r="20" fill="rgba(143,163,115,0.2)" stroke="#8FA373" stroke-width="2"/>
  <text x="660" y="337" fill="#8FA373" font-size="14" font-weight="bold" text-anchor="middle">2</text>
  <text x="695" y="337" fill="#F5F2EC" font-size="13" font-family="monospace">Marcus L. — € 38k closed</text>

  <circle cx="660" cy="380" r="20" fill="rgba(245,242,236,0.1)" stroke="#9A968C" stroke-width="2"/>
  <text x="660" y="387" fill="#9A968C" font-size="14" font-weight="bold" text-anchor="middle">3</text>
  <text x="695" y="387" fill="#F5F2EC" font-size="13" font-family="monospace">Julia K. — € 28k closed</text>

  <!-- Active Deals Table -->
  <rect x="40" y="430" width="1120" height="205" rx="8" fill="#1C1C22" stroke="rgba(245,242,236,0.08)" stroke-width="1"/>
  <text x="60" y="460" fill="#9A968C" font-size="12" font-family="monospace">HOT DEALS — CLOSING THIS WEEK</text>

  <!-- Table Header -->
  <text x="60" y="490" fill="#5E5A52" font-size="10" font-family="monospace">COMPANY</text>
  <text x="350" y="490" fill="#5E5A52" font-size="10" font-family="monospace">VALUE</text>
  <text x="550" y="490" fill="#5E5A52" font-size="10" font-family="monospace">CLOSE DATE</text>
  <text x="750" y="490" fill="#5E5A52" font-size="10" font-family="monospace">STATUS</text>
  <text x="950" y="490" fill="#5E5A52" font-size="10" font-family="monospace">OWNER</text>
  <line x1="60" y1="500" x2="1120" y2="500" stroke="rgba(245,242,236,0.08)" stroke-width="1"/>

  <!-- Table Rows -->
  <text x="60" y="530" fill="#9A968C" font-size="12" font-family="monospace">Acme Corp</text>
  <text x="350" y="530" fill="#F5F2EC" font-size="12" font-family="monospace">€ 24k</text>
  <text x="550" y="530" fill="#9A968C" font-size="12" font-family="monospace">15.02.26</text>
  <rect x="750" y="518" width="70" height="18" rx="3" fill="rgba(255,45,122,0.12)"/>
  <text x="760" y="530" fill="#FF2D7A" font-size="10" font-family="monospace">CLOSING</text>
  <text x="950" y="530" fill="#9A968C" font-size="11">Sarah M.</text>

  <text x="60" y="570" fill="#9A968C" font-size="12" font-family="monospace">TechStart GmbH</text>
  <text x="350" y="570" fill="#F5F2EC" font-size="12" font-family="monospace">€ 18k</text>
  <text x="550" y="570" fill="#9A968C" font-size="12" font-family="monospace">20.02.26</text>
  <rect x="750" y="558" width="50" height="18" rx="3" fill="rgba(143,163,115,0.12)"/>
  <text x="760" y="570" fill="#8FA373" font-size="10" font-family="monospace">WON</text>
  <text x="950" y="570" fill="#9A968C" font-size="11">Marcus L.</text>

  <text x="60" y="610" fill="#9A968C" font-size="12" font-family="monospace">DataFlow Inc</text>
  <text x="350" y="610" fill="#F5F2EC" font-size="12" font-family="monospace">€ 32k</text>
  <text x="550" y="610" fill="#9A968C" font-size="12" font-family="monospace">28.02.26</text>
  <rect x="750" y="598" width="95" height="18" rx="3" fill="rgba(209,168,92,0.12)"/>
  <text x="755" y="610" fill="#D1A85C" font-size="10" font-family="monospace">NEGOTIATION</text>
  <text x="950" y="610" fill="#9A968C" font-size="11">Julia K.</text>
</svg>
