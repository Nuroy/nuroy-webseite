<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0A0C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#121216;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pink-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF2D7A;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#FF6B9D;stop-opacity:0.3" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#grad1)"/>

  <!-- Title Badge -->
  <text x="40" y="35" fill="#FF2D7A" font-size="12" font-family="monospace" letter-spacing="2">MARKETING DASHBOARD</text>

  <!-- Stats Grid - Marketing Focused -->
  <rect x="40" y="60" width="340" height="130" rx="8" fill="#1C1C22" stroke="rgba(245,242,236,0.08)" stroke-width="1"/>
  <text x="60" y="95" fill="#9A968C" font-size="11" font-family="monospace" letter-spacing="1">AD SPEND (MTD)</text>
  <text x="60" y="135" fill="#F5F2EC" font-size="32" font-family="Arial" font-weight="bold">€ 12.400</text>
  <text x="60" y="160" fill="#D1A85C" font-size="11">↑ 18% vs. last month</text>

  <rect x="400" y="60" width="340" height="130" rx="8" fill="#1C1C22" stroke="rgba(245,242,236,0.08)" stroke-width="1"/>
  <text x="420" y="95" fill="#9A968C" font-size="11" font-family="monospace" letter-spacing="1">CONVERSIONS</text>
  <text x="420" y="135" fill="#8FA373" font-size="32" font-family="Arial" font-weight="bold">342</text>
  <text x="420" y="160" fill="#8FA373" font-size="11">↑ 24% vs. last month</text>

  <rect x="760" y="60" width="400" height="130" rx="8" fill="#1C1C22" stroke="rgba(245,242,236,0.08)" stroke-width="1"/>
  <text x="780" y="95" fill="#9A968C" font-size="11" font-family="monospace" letter-spacing="1">ROAS (RETURN ON AD SPEND)</text>
  <text x="780" y="135" fill="#FF2D7A" font-size="32" font-family="Arial" font-weight="bold">4.2x</text>
  <text x="780" y="160" fill="#8FA373" font-size="11">↑ 0.8x improvement</text>

  <!-- Campaign Performance Chart -->
  <rect x="40" y="210" width="1120" height="200" rx="8" fill="#1C1C22" stroke="rgba(245,242,236,0.08)" stroke-width="1"/>
  <text x="60" y="240" fill="#9A968C" font-size="12" font-family="monospace">CAMPAIGN PERFORMANCE — 7 DAYS</text>

  <!-- Chart Bars (simplified bar chart representation) -->
  <rect x="100" y="300" width="120" height="80" rx="4" fill="url(#pink-glow)" opacity="0.7"/>
  <text x="150" y="395" fill="#9A968C" font-size="10" text-anchor="middle">Meta Ads</text>

  <rect x="280" y="330" width="120" height="50" rx="4" fill="url(#pink-glow)" opacity="0.5"/>
  <text x="330" y="395" fill="#9A968C" font-size="10" text-anchor="middle">Google</text>

  <rect x="460" y="340" width="120" height="40" rx="4" fill="url(#pink-glow)" opacity="0.4"/>
  <text x="510" y="395" fill="#9A968C" font-size="10" text-anchor="middle">LinkedIn</text>

  <rect x="640" y="320" width="120" height="60" rx="4" fill="url(#pink-glow)" opacity="0.6"/>
  <text x="690" y="395" fill="#9A968C" font-size="10" text-anchor="middle">TikTok</text>

  <rect x="820" y="310" width="120" height="70" rx="4" fill="url(#pink-glow)" opacity="0.65"/>
  <text x="870" y="395" fill="#9A968C" font-size="10" text-anchor="middle">YouTube</text>

  <rect x="1000" y="350" width="120" height="30" rx="4" fill="url(#pink-glow)" opacity="0.3"/>
  <text x="1050" y="395" fill="#9A968C" font-size="10" text-anchor="middle">Display</text>

  <!-- Active Campaigns Table -->
  <rect x="40" y="430" width="1120" height="205" rx="8" fill="#1C1C22" stroke="rgba(245,242,236,0.08)" stroke-width="1"/>
  <text x="60" y="460" fill="#9A968C" font-size="12" font-family="monospace">ACTIVE CAMPAIGNS</text>

  <!-- Table Header -->
  <text x="60" y="490" fill="#5E5A52" font-size="10" font-family="monospace">CAMPAIGN</text>
  <text x="400" y="490" fill="#5E5A52" font-size="10" font-family="monospace">BUDGET</text>
  <text x="600" y="490" fill="#5E5A52" font-size="10" font-family="monospace">SPENT</text>
  <text x="800" y="490" fill="#5E5A52" font-size="10" font-family="monospace">STATUS</text>
  <line x1="60" y1="500" x2="1120" y2="500" stroke="rgba(245,242,236,0.08)" stroke-width="1"/>

  <!-- Table Rows -->
  <text x="60" y="530" fill="#9A968C" font-size="12" font-family="monospace">Meta Ads — Summer Sale</text>
  <text x="400" y="530" fill="#F5F2EC" font-size="12" font-family="monospace">€ 8.000</text>
  <text x="600" y="530" fill="#9A968C" font-size="12" font-family="monospace">€ 6.200 (78%)</text>
  <rect x="800" y="518" width="60" height="18" rx="3" fill="rgba(143,163,115,0.12)"/>
  <text x="815" y="530" fill="#8FA373" font-size="10" font-family="monospace">ACTIVE</text>

  <text x="60" y="570" fill="#9A968C" font-size="12" font-family="monospace">Google Ads — Brand</text>
  <text x="400" y="570" fill="#F5F2EC" font-size="12" font-family="monospace">€ 5.000</text>
  <text x="600" y="570" fill="#9A968C" font-size="12" font-family="monospace">€ 4.800 (96%)</text>
  <rect x="800" y="558" width="60" height="18" rx="3" fill="rgba(143,163,115,0.12)"/>
  <text x="815" y="570" fill="#8FA373" font-size="10" font-family="monospace">ACTIVE</text>

  <text x="60" y="610" fill="#9A968C" font-size="12" font-family="monospace">LinkedIn — B2B Lead Gen</text>
  <text x="400" y="610" fill="#F5F2EC" font-size="12" font-family="monospace">€ 2.400</text>
  <text x="600" y="610" fill="#9A968C" font-size="12" font-family="monospace">€ 1.400 (58%)</text>
  <rect x="800" y="598" width="65" height="18" rx="3" fill="rgba(209,168,92,0.12)"/>
  <text x="810" y="610" fill="#D1A85C" font-size="10" font-family="monospace">PAUSED</text>
</svg>
