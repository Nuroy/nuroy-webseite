<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0A0C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#121216;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blue-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4A9EFF;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#6BB3FF;stop-opacity:0.3" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#grad1)"/>

  <!-- Title Badge -->
  <text x="40" y="35" fill="#4A9EFF" font-size="12" font-family="monospace" letter-spacing="2">FINANCE DASHBOARD</text>

  <!-- Stats Grid - Finance Focused -->
  <rect x="40" y="60" width="340" height="130" rx="8" fill="#1C1C22" stroke="rgba(245,242,236,0.08)" stroke-width="1"/>
  <text x="60" y="95" fill="#9A968C" font-size="11" font-family="monospace" letter-spacing="1">RUNWAY</text>
  <text x="60" y="135" fill="#4A9EFF" font-size="32" font-family="Arial" font-weight="bold">18 mo</text>
  <text x="60" y="160" fill="#9A968C" font-size="11">Based on current burn</text>

  <rect x="400" y="60" width="340" height="130" rx="8" fill="#1C1C22" stroke="rgba(245,242,236,0.08)" stroke-width="1"/>
  <text x="420" y="95" fill="#9A968C" font-size="11" font-family="monospace" letter-spacing="1">BURN RATE</text>
  <text x="420" y="135" fill="#F5F2EC" font-size="32" font-family="Arial" font-weight="bold">€ 42K</text>
  <text x="420" y="160" fill="#9A968C" font-size="11">/month</text>

  <rect x="760" y="60" width="400" height="130" rx="8" fill="#1C1C22" stroke="rgba(245,242,236,0.08)" stroke-width="1"/>
  <text x="780" y="95" fill="#9A968C" font-size="11" font-family="monospace" letter-spacing="1">ARR (ANNUAL RECURRING REV.)</text>
  <text x="780" y="135" fill="#8FA373" font-size="32" font-family="Arial" font-weight="bold">€ 1.2M</text>
  <text x="780" y="160" fill="#8FA373" font-size="11">↑ 28% YoY growth</text>

  <!-- Cash Flow Chart -->
  <rect x="40" y="210" width="550" height="200" rx="8" fill="#1C1C22" stroke="rgba(245,242,236,0.08)" stroke-width="1"/>
  <text x="60" y="240" fill="#9A968C" font-size="12" font-family="monospace">CASH FLOW — 6 MONTHS</text>

  <!-- Bar Chart (Revenue vs Expenses) -->
  <rect x="100" y="330" width="50" height="60" rx="4" fill="#8FA373" opacity="0.7"/>
  <rect x="170" y="320" width="50" height="70" rx="4" fill="#8FA373" opacity="0.7"/>
  <rect x="240" y="310" width="50" height="80" rx="4" fill="#8FA373" opacity="0.7"/>
  <rect x="310" y="320" width="50" height="70" rx="4" fill="url(#blue-glow)" opacity="0.7"/>
  <rect x="380" y="300" width="50" height="90" rx="4" fill="url(#blue-glow)" opacity="0.7"/>
  <rect x="450" y="290" width="50" height="100" rx="4" fill="url(#blue-glow)" opacity="0.7"/>

  <!-- Labels -->
  <text x="125" y="395" font-size="10" fill="#9A968C" text-anchor="middle">Jun</text>
  <text x="195" y="395" font-size="10" fill="#9A968C" text-anchor="middle">Jul</text>
  <text x="265" y="395" font-size="10" fill="#9A968C" text-anchor="middle">Aug</text>
  <text x="335" y="395" font-size="10" fill="#9A968C" text-anchor="middle">Sep</text>
  <text x="405" y="395" font-size="10" fill="#9A968C" text-anchor="middle">Oct</text>
  <text x="475" y="395" font-size="10" fill="#9A968C" text-anchor="middle">Nov</text>

  <!-- Budget Progress -->
  <rect x="610" y="210" width="550" height="200" rx="8" fill="#1C1C22" stroke="rgba(245,242,236,0.08)" stroke-width="1"/>
  <text x="630" y="240" fill="#9A968C" font-size="12" font-family="monospace">Q4 BUDGET TRACKING</text>

  <!-- Progress Bars -->
  <text x="650" y="280" fill="#9A968C" font-size="11">Engineering</text>
  <rect x="650" y="290" width="480" height="16" rx="8" fill="rgba(245,242,236,0.05)"/>
  <rect x="650" y="290" width="350" height="16" rx="8" fill="url(#blue-glow)" opacity="0.6"/>
  <text x="1060" y="302" fill="#4A9EFF" font-size="10" font-weight="bold">73%</text>

  <text x="650" y="335" fill="#9A968C" font-size="11">Marketing</text>
  <rect x="650" y="345" width="480" height="16" rx="8" fill="rgba(245,242,236,0.05)"/>
  <rect x="650" y="345" width="290" height="16" rx="8" fill="url(#blue-glow)" opacity="0.6"/>
  <text x="1060" y="357" fill="#4A9EFF" font-size="10" font-weight="bold">60%</text>

  <text x="650" y="390" fill="#9A968C" font-size="11">Operations</text>
  <rect x="650" y="400" width="480" height="16" rx="8" fill="rgba(245,242,236,0.05)"/>
  <rect x="650" y="400" width="410" height="16" rx="8" fill="#D1A85C" opacity="0.6"/>
  <text x="1060" y="412" fill="#D1A85C" font-size="10" font-weight="bold">85%</text>

  <!-- Financial Projections Table -->
  <rect x="40" y="430" width="1120" height="205" rx="8" fill="#1C1C22" stroke="rgba(245,242,236,0.08)" stroke-width="1"/>
  <text x="60" y="460" fill="#9A968C" font-size="12" font-family="monospace">FORECAST — NEXT 3 MONTHS</text>

  <!-- Table Header -->
  <text x="60" y="490" fill="#5E5A52" font-size="10" font-family="monospace">MONTH</text>
  <text x="300" y="490" fill="#5E5A52" font-size="10" font-family="monospace">PROJECTED REV.</text>
  <text x="550" y="490" fill="#5E5A52" font-size="10" font-family="monospace">EXPENSES</text>
  <text x="800" y="490" fill="#5E5A52" font-size="10" font-family="monospace">NET INCOME</text>
  <text x="1000" y="490" fill="#5E5A52" font-size="10" font-family="monospace">CASH BALANCE</text>
  <line x1="60" y1="500" x2="1120" y2="500" stroke="rgba(245,242,236,0.08)" stroke-width="1"/>

  <!-- Table Rows -->
  <text x="60" y="530" fill="#9A968C" font-size="12" font-family="monospace">December 2025</text>
  <text x="300" y="530" fill="#8FA373" font-size="12" font-family="monospace">€ 124.000</text>
  <text x="550" y="530" fill="#F5F2EC" font-size="12" font-family="monospace">€ 86.000</text>
  <text x="800" y="530" fill="#8FA373" font-size="12" font-family="monospace">+€ 38.000</text>
  <text x="1000" y="530" fill="#4A9EFF" font-size="12" font-family="monospace">€ 842.000</text>

  <text x="60" y="570" fill="#9A968C" font-size="12" font-family="monospace">January 2026</text>
  <text x="300" y="570" fill="#8FA373" font-size="12" font-family="monospace">€ 138.000</text>
  <text x="550" y="570" fill="#F5F2EC" font-size="12" font-family="monospace">€ 92.000</text>
  <text x="800" y="570" fill="#8FA373" font-size="12" font-family="monospace">+€ 46.000</text>
  <text x="1000" y="570" fill="#4A9EFF" font-size="12" font-family="monospace">€ 888.000</text>

  <text x="60" y="610" fill="#9A968C" font-size="12" font-family="monospace">February 2026</text>
  <text x="300" y="610" fill="#8FA373" font-size="12" font-family="monospace">€ 152.000</text>
  <text x="550" y="610" fill="#F5F2EC" font-size="12" font-family="monospace">€ 98.000</text>
  <text x="800" y="610" fill="#8FA373" font-size="12" font-family="monospace">+€ 54.000</text>
  <text x="1000" y="610" fill="#4A9EFF" font-size="12" font-family="monospace">€ 942.000</text>
</svg>
