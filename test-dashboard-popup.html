<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Popup Test</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 40px;
      background: #fafaf7;
      max-width: 900px;
      margin: 0 auto;
    }

    /* Dashboard Popup - SIMPLE VERSION */
    .dashboard-popup {
      position: fixed;
      z-index: 10000;
      width: 420px;
      max-width: calc(100vw - 32px);
      background: white;
      border: 1px solid #e0e0e0;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .dashboard-popup.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .popup-close {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 32px;
      height: 32px;
      border: none;
      background: #f0f0f0;
      border-radius: 6px;
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
      color: #666;
    }

    .popup-close:hover {
      background: #e0e0e0;
      color: #333;
    }

    .popup-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #e0e0e0;
    }

    .popup-header h4 {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
      color: #1a1a1a;
    }

    .popup-tag {
      font-size: 10px;
      font-family: monospace;
      text-transform: uppercase;
      color: #FF2D7A;
      background: rgba(255, 45, 122, 0.1);
      padding: 4px 8px;
      border-radius: 4px;
      font-weight: 600;
    }

    .popup-desc {
      margin: 0 0 20px;
      font-size: 14px;
      line-height: 1.6;
      color: #666;
    }

    .popup-features {
      font-size: 13px;
    }

    .popup-features strong {
      display: block;
      margin-bottom: 8px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #999;
    }

    .popup-features ul {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .popup-features li {
      padding: 6px 0 6px 20px;
      position: relative;
      color: #666;
      line-height: 1.5;
    }

    .popup-features li::before {
      content: '';
      position: absolute;
      left: 0;
      top: 13px;
      width: 6px;
      height: 6px;
      background: #FF2D7A;
      border-radius: 50%;
    }

    /* Module Items Styling */
    #dashboard-showcase {
      background: white;
      border-radius: 12px;
      border: 1px solid #e0e0e0;
      overflow: hidden;
    }

    .dashboard-module-item {
      padding: 24px;
      border-bottom: 1px solid #e0e0e0;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .dashboard-module-item:last-child {
      border-bottom: none;
    }

    .dashboard-module-item:hover {
      background: #f9f9f9;
    }

    .module-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .module-header h3 {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
      color: #1a1a1a;
    }

    .module-tag {
      font-size: 10px;
      font-family: monospace;
      text-transform: uppercase;
      color: #999;
      letter-spacing: 0.1em;
    }

    .dashboard-module-item p {
      margin: 0;
      font-size: 15px;
      color: #666;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <h1>Dashboard Popup Test</h1>
  <p style="color: #666; margin-bottom: 40px;">Hover über einen Eintrag (Desktop) oder klicke (Mobile) um das Popup zu sehen.</p>

  <div id="dashboard-showcase"></div>

  <script>
    // Test data
    window.SERVICE_DATA = {
      dashboardModules: [
        {
          title: 'Sales & Revenue Dashboard',
          desc: 'Echtzeit-Übersicht über Umsätze, Conversions und Performance-Trends.',
          tag: 'Vertrieb',
          detailedDesc: 'Das Sales Dashboard vereint alle wichtigen Vertriebs-Kennzahlen in einer zentralen Übersicht.',
          features: [
            'Pipeline-Übersicht mit Deal-Status und Wert',
            'Conversion-Rates pro Verkaufsphase',
            'Umsatz-Trends und Forecasts',
            'Top-Performer und Team-Rankings'
          ]
        },
        {
          title: 'Marketing Analytics Dashboard',
          desc: 'Kampagnen-Performance, ROI und Customer Journey in einer Ansicht.',
          tag: 'Marketing',
          detailedDesc: 'Alle Marketing-Kanäle, Kampagnen und KPIs auf einen Blick.',
          features: [
            'Multi-Channel Attribution',
            'Campaign Performance Tracking',
            'Lead Quality Scoring',
            'Budget vs. Actual Spend'
          ]
        },
        {
          title: 'Customer Success Dashboard',
          desc: 'Health Scores, Churn-Risiko und Engagement-Metriken.',
          tag: 'CS',
          detailedDesc: 'Behaltet den Überblick über Kundenzufriedenheit und Retention.',
          features: [
            'Customer Health Score',
            'Churn Risk Indicators',
            'NPS & CSAT Tracking',
            'Product Usage Analytics'
          ]
        }
      ]
    };

    // Dashboard Showcase Implementation
    (function() {
      'use strict';

      // Wait for DOM
      document.addEventListener('DOMContentLoaded', initDashboardShowcase);

      function initDashboardShowcase() {
        const container = document.querySelector('#dashboard-showcase');
        const modules = window.SERVICE_DATA?.dashboardModules;

        if (!container || !modules || !modules.length) {
          console.error('Container or modules not found');
          return;
        }

        console.log('Initializing with', modules.length, 'modules');

        // Render modules
        renderModules(container, modules);

        // Create single shared popup
        const popup = createPopup();

        // Attach event listeners
        attachEventListeners(container, modules, popup);

        console.log('Dashboard showcase initialized successfully');
      }

      function renderModules(container, modules) {
        container.innerHTML = modules.map((mod, i) => `
          <div class="dashboard-module-item" data-index="${i}">
            <div class="module-header">
              <h3>${mod.title}</h3>
              <span class="module-tag">${mod.tag}</span>
            </div>
            <p>${mod.desc}</p>
          </div>
        `).join('');
      }

      function createPopup() {
        const popup = document.createElement('div');
        popup.className = 'dashboard-popup';
        popup.innerHTML = `
          <button class="popup-close">×</button>
          <div class="popup-content"></div>
        `;
        document.body.appendChild(popup);

        // Close on button click
        popup.querySelector('.popup-close').onclick = () => hidePopup(popup);

        // Close on outside click
        popup.onclick = (e) => {
          if (e.target === popup) hidePopup(popup);
        };

        return popup;
      }

      function attachEventListeners(container, modules, popup) {
        const items = container.querySelectorAll('.dashboard-module-item');

        items.forEach((item, index) => {
          // Desktop: hover
          item.addEventListener('mouseenter', () => showPopup(popup, modules[index], item));
          item.addEventListener('mouseleave', () => {
            // Delay hide to allow moving to popup
            setTimeout(() => {
              if (!popup.matches(':hover')) hidePopup(popup);
            }, 100);
          });

          // Mobile/Desktop: click
          item.addEventListener('click', (e) => {
            e.preventDefault();
            if (popup.classList.contains('visible')) {
              hidePopup(popup);
            } else {
              showPopup(popup, modules[index], item);
            }
          });
        });

        // Don't hide when hovering popup itself
        popup.addEventListener('mouseenter', () => popup.classList.add('hover'));
        popup.addEventListener('mouseleave', () => {
          popup.classList.remove('hover');
          hidePopup(popup);
        });
      }

      function showPopup(popup, module, triggerElement) {
        // Update content
        const content = popup.querySelector('.popup-content');
        content.innerHTML = `
          <div class="popup-header">
            <h4>${module.title}</h4>
            <span class="popup-tag">${module.tag}</span>
          </div>
          <p class="popup-desc">${module.detailedDesc || module.desc}</p>
          <div class="popup-features">
            <strong>Was drin ist:</strong>
            <ul>
              ${(module.features || []).map(f => `<li>${f}</li>`).join('')}
            </ul>
          </div>
        `;

        // Position popup
        const rect = triggerElement.getBoundingClientRect();
        const isMobile = window.innerWidth < 768;

        if (isMobile) {
          // Mobile: centered, below item
          popup.style.left = '50%';
          popup.style.top = `${rect.bottom + window.scrollY + 16}px`;
          popup.style.transform = 'translateX(-50%)';
        } else {
          // Desktop: to the right of item
          popup.style.left = `${rect.right + 24}px`;
          popup.style.top = `${rect.top + window.scrollY}px`;
          popup.style.transform = 'none';

          // If too far right, position on left
          if (rect.right + 24 + 420 > window.innerWidth) {
            popup.style.left = `${rect.left - 420 - 24}px`;
          }
        }

        // Show
        popup.classList.add('visible');
        console.log('Popup shown for', module.title);
      }

      function hidePopup(popup) {
        if (!popup.classList.contains('hover')) {
          popup.classList.remove('visible');
          console.log('Popup hidden');
        }
      }
    })();
  </script>
</body>
</html>
